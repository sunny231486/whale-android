                <!-- 4. 自定义贴图与大小 -->
                <div class="card">
                  <h3>🖼️ 第四步：自定义角色贴图与大小调节</h3>
                  <div class="sprite-preview-row">
                    <div class="sprite-box">
                      <img id="prev-idle-img" src="whale-official-icon.png" />
                      <div style="font-size:11.5px; color:var(--mute); margin-bottom:4px;" id="lbl-idle-status">当前：默认大肥鱼</div>
                      <button class="btn" style="margin-top:2px; padding:7px 10px; font-size:12px;" onclick="MainBridge.pickCustomSprite('idle')">📂 更换平时贴图</button>
                    </div>
                    <div class="sprite-box">
                      <img id="prev-talk-img" src="whale-official-icon.png" />
                      <div style="font-size:11.5px; color:var(--mute); margin-bottom:4px;" id="lbl-talk-status">说话差分：未设置(可选)</div>
                      <button class="btn secondary" style="margin-top:2px; padding:7px 10px; font-size:12px;" onclick="MainBridge.pickCustomSprite('talk')">🗣️ 更换说话贴图</button>
                    </div>
