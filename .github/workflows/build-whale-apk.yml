                      Intent openAppIntent = new Intent(this, MainActivity.class);
                      PendingIntent pi = PendingIntent.getActivity(this, 0, openAppIntent,
                              PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                      Notification notification = new NotificationCompat.Builder(this, CHANNEL_ID)
                              .setContentTitle("大肥鱼正在桌面陪伴你")
                              .setContentText("点击打开设置面板 · 待机贴边露头中")
                              .setSmallIcon(android.R.drawable.sym_def_app_icon)
                              .setContentIntent(pi)
                              .setPriority(NotificationCompat.PRIORITY_MIN)
                              .build();
                      startForeground(1001, notification);

                      IntentFilter filter = new IntentFilter();
                      filter.addAction(Intent.ACTION_SCREEN_OFF);
                      filter.addAction(Intent.ACTION_SCREEN_ON);
                      filter.addAction(Intent.ACTION_POWER_CONNECTED);
                      filter.addAction(Intent.ACTION_POWER_DISCONNECTED);
                      filter.addAction(Intent.ACTION_BATTERY_LOW);
                      registerReceiver(systemEventReceiver, filter);

                      initOverlayWindow();
                  }

                  private void initOverlayWindow() {
                      if (!Settings.canDrawOverlays(this)) return;
                      windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);
                      DisplayMetrics dm = getResources().getDisplayMetrics();
                      density = dm.density;
                      screenWidth = dm.widthPixels;
                      screenHeight = dm.heightPixels;

                      int wPx = dpToPx(110);
                      int hPx = dpToPx(95);

                      layoutParams = new WindowManager.LayoutParams(
                              wPx,
                              hPx,
                              WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                      | WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL
                                      | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                              PixelFormat.TRANSLUCENT
                      );
                      layoutParams.gravity = Gravity.TOP | Gravity.START;
                      layoutParams.x = (screenWidth - wPx) / 2;
                      layoutParams.y = screenHeight - hPx;

                      overlayWebView = new WebView(this);
                      overlayWebView.setBackgroundColor(Color.TRANSPARENT);
                      overlayWebView.setVerticalScrollBarEnabled(false);
                      overlayWebView.setHorizontalScrollBarEnabled(false);

                      WebSettings s = overlayWebView.getSettings();
                      s.setJavaScriptEnabled(true);
                      s.setDomStorageEnabled(true);
                      s.setMediaPlaybackRequiresUserGesture(false);

                      final WebViewAssetLoader assetLoader = new WebViewAssetLoader.Builder()
                              .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                              .build();

                      overlayWebView.setWebViewClient(new WebViewClient() {
                          @Override
                          public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                              return assetLoader.shouldInterceptRequest(request.getUrl());
                          }
                      });

                      overlayWebView.addJavascriptInterface(new OverlayJsBridge(), "OverlayBridge");
                      windowManager.addView(overlayWebView, layoutParams);
                      overlayWebView.loadUrl("https://appassets.androidplatform.net/assets/www/overlay-pet.html");
                  }

                  private int dpToPx(int dp) {
                      return Math.round(dp * density);
                  }

                  public void evalJs(final String script) {
                      if (overlayWebView == null) return;
                      overlayWebView.post(() -> overlayWebView.evaluateJavascript(script, null));
                  }

                  public void notifyInstantEvent(String type, String defaultLine) {
                      String safe = defaultLine.replace("'", "\\'");
                      evalJs("window.onNativeInstantEvent && window.onNativeInstantEvent('" + type + "', '" + safe + "');");
                  }

                  public void notifySongChanged(String songInfo) {
                      String safe = songInfo.replace("'", "\\'");
