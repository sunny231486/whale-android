                      evalJs(String.format(Locale.US, "window.onSystemAudioBeat && window.onSystemAudioBeat(%.4f, %b);", rms, isBeat));
                  }

                  public void dispatchSystemAudioWav(String b64Wav) {
                      evalJs("window.onSystemAudioWav && window.onSystemAudioWav('" + b64Wav + "');");
                  }

                  public void dispatchSystemAudioStatus(boolean active, String msg) {
                      String safe = msg.replace("'", "\\'");
                      evalJs("window.onSystemAudioStatus && window.onSystemAudioStatus(" + active + ", '" + safe + "');");
                  }

                  public void reloadConfigFromMain() {
                      evalJs("window.reloadWhaleConfig && window.reloadWhaleConfig();");
                  }

                  private void updateWindowGeometry(String mode, int petSizeDp, boolean focusable) {
                      if (windowManager == null || overlayWebView == null) return;
                      DisplayMetrics dm = getResources().getDisplayMetrics();
                      screenWidth = dm.widthPixels;
                      screenHeight = dm.heightPixels;

                      int oldCenterX = layoutParams.x + layoutParams.width / 2;
                      int oldBottomY = layoutParams.y + layoutParams.height;

                      currentMode = mode;
                      petBaseDp = Math.max(85, Math.min(270, petSizeDp));

                      int targetW;
                      int targetH;
                      if ("peek".equals(mode)) {
                          if ("left".equals(dockEdge) || "right".equals(dockEdge)) {
                              targetW = dpToPx(Math.round(petBaseDp * 0.52f));
                              targetH = dpToPx(Math.round(petBaseDp * 0.85f));
                          } else {
                              targetW = dpToPx(Math.round(petBaseDp * 0.85f));
                              targetH = dpToPx(Math.round(petBaseDp * 0.52f));
                          }
                      } else if ("chat".equals(mode)) {
                          targetW = Math.min(screenWidth - dpToPx(16), dpToPx(Math.max(300, petBaseDp + 160)));
                          targetH = dpToPx(petBaseDp + 210);
                      } else {
                          targetW = Math.min(screenWidth - dpToPx(20), dpToPx(Math.max(260, petBaseDp + 120)));
                          targetH = dpToPx(petBaseDp + 160);
                      }

                      layoutParams.width = targetW;
                      layoutParams.height = targetH;

                      if (focusable) {
                          layoutParams.flags &= ~WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE;
                      } else {
                          layoutParams.flags |= WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE;
                      }

                      if ("left".equals(dockEdge)) {
                          layoutParams.x = 0;
                          layoutParams.y = Math.max(dpToPx(40), Math.min(screenHeight - targetH - dpToPx(40), oldBottomY - targetH));
                      } else if ("right".equals(dockEdge)) {
                          layoutParams.x = screenWidth - targetW;
                          layoutParams.y = Math.max(dpToPx(40), Math.min(screenHeight - targetH - dpToPx(40), oldBottomY - targetH));
                      } else {
                          layoutParams.x = Math.max(0, Math.min(screenWidth - targetW, oldCenterX - targetW / 2));
                          layoutParams.y = screenHeight - targetH;
                      }

                      windowManager.updateViewLayout(overlayWebView, layoutParams);
                      if (focusable) {
                          overlayWebView.requestFocus();
                          InputMethodManager imm = (InputMethodManager) getSystemService(Context.INPUT_METHOD_SERVICE);
                          if (imm != null) {
                              imm.showSoftInput(overlayWebView, InputMethodManager.SHOW_IMPLICIT);
                          }
                      }
                  }

                  public class OverlayJsBridge {
                      @JavascriptInterface
                      public void setOverlayMode(final String mode, final int petSizeDp, final boolean needKeyboard) {
                          if (overlayWebView == null) return;
                          overlayWebView.post(() -> updateWindowGeometry(mode, petSizeDp, needKeyboard));
                      }

                      @JavascriptInterface
                      public void moveOverlayBy(final int dxCss, final int dyCss) {
                          if (overlayWebView == null || windowManager == null) return;
                          overlayWebView.post(() -> {
                              layoutParams.x += Math.round(dxCss * density);
                              layoutParams.y += Math.round(dyCss * density);
                              windowManager.updateViewLayout(overlayWebView, layoutParams);
                          });
                      }

                      @JavascriptInterface
                      public String snapToNearestEdge() {
                          if (overlayWebView == null || windowManager == null) return dockEdge;
                          DisplayMetrics dm = getResources().getDisplayMetrics();
                          screenWidth = dm.widthPixels;
                          screenHeight = dm.heightPixels;

                          int centerX = layoutParams.x + layoutParams.width / 2;
                          int centerY = layoutParams.y + layoutParams.height / 2;

                          int distLeft = centerX;
                          int distRight = screenWidth - centerX;
                          int distBottom = screenHeight - centerY;

                          if (distBottom <= distLeft && distBottom <= distRight || centerY > screenHeight * 0.72f) {
                              dockEdge = "bottom";
                          } else if (distLeft < distRight) {
                              dockEdge = "left";
                          } else {
                              dockEdge = "right";
                          }

                          overlayWebView.post(() -> {
                              updateWindowGeometry(currentMode, petBaseDp, false);
                              evalJs("window.onDockEdgeChanged && window.onDockEdgeChanged('" + dockEdge + "');");
                          });
                          return dockEdge;
                      }

