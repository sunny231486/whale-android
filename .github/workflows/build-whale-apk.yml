              package com.takboo.whalecompanion;

              import android.Manifest;
              import android.app.Activity;
              import android.content.Context;
              import android.content.Intent;
              import android.content.SharedPreferences;
              import android.media.projection.MediaProjectionManager;
              import android.net.Uri;
              import android.os.Build;
              import android.os.Bundle;
              import android.provider.Settings;
              import android.webkit.JavascriptInterface;
              import android.webkit.WebResourceRequest;
              import android.webkit.WebResourceResponse;
              import android.webkit.WebSettings;
              import android.webkit.WebView;
              import android.webkit.WebViewClient;
              import androidx.appcompat.app.AppCompatActivity;
              import androidx.core.app.ActivityCompat;
              import androidx.webkit.WebViewAssetLoader;
              import java.io.File;
              import java.io.FileOutputStream;
              import java.io.InputStream;

              public class MainActivity extends AppCompatActivity {
                  private static final int REQ_MEDIA_PROJECTION = 2001;
                  private static final int REQ_PERMS = 2002;
                  private static final int REQ_OVERLAY = 2003;
                  private static final int REQ_PICK_IDLE_SPRITE = 2004;
                  private static final int REQ_PICK_TALK_SPRITE = 2005;
                  private WebView controlWebView;

                  @Override
                  protected void onCreate(Bundle savedInstanceState) {
                      super.onCreate(savedInstanceState);
                      controlWebView = new WebView(this);
                      setContentView(controlWebView);

                      WebSettings s = controlWebView.getSettings();
                      s.setJavaScriptEnabled(true);
                      s.setDomStorageEnabled(true);
                      s.setCacheMode(WebSettings.LOAD_NO_CACHE);

                      final WebViewAssetLoader assetLoader = new WebViewAssetLoader.Builder()
                              .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                              .build();

                      controlWebView.setWebViewClient(new WebViewClient() {
                          @Override
                          public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                              return FloatingOverlayService.interceptCustomSpriteRequest(MainActivity.this, request, assetLoader);
                          }
                      });

                      controlWebView.addJavascriptInterface(new MainControlBridge(), "MainBridge");
                      requestBasePermissions();
                      controlWebView.loadUrl("https://appassets.androidplatform.net/assets/www/control-panel.html");
                  }

                  @Override
                  protected void onResume() {
                      super.onResume();
                      if (controlWebView != null) {
                          controlWebView.evaluateJavascript("window.refreshDashboard && window.refreshDashboard();", null);
                      }
                  }

                  private void requestBasePermissions() {
                      String[] perms = new String[]{
                              Manifest.permission.RECORD_AUDIO,
                              Manifest.permission.ACCESS_COARSE_LOCATION,
                              Manifest.permission.ACCESS_FINE_LOCATION
                      };
                      ActivityCompat.requestPermissions(this, perms, REQ_PERMS);
                  }

                  private void savePickedSpriteUri(Uri uri, String targetFileName) {
                      if (uri == null) return;
                      try {
                          String mime = getContentResolver().getType(uri);
                          if (mime == null || mime.isEmpty()) mime = "image/png";
                          InputStream is = getContentResolver().openInputStream(uri);
                          if (is == null) return;
                          File outFile = new File(getFilesDir(), targetFileName);
                          FileOutputStream fos = new FileOutputStream(outFile);
                          byte[] buf = new byte[8192];
                          int len;
                          while ((len = is.read(buf)) > 0) {
                              fos.write(buf, 0, len);
                          }
                          fos.flush();
                          fos.close();
                          is.close();

                          SharedPreferences sp = getSharedPreferences("whale_native_prefs", MODE_PRIVATE);
                          sp.edit().putString("mime_" + targetFileName, mime).apply();

                          if (FloatingOverlayService.instance != null) {
                              FloatingOverlayService.instance.notifyCustomSpriteUpdated();
                          }
                          if (controlWebView != null) {
                              controlWebView.evaluateJavascript("window.onCustomSpriteChanged && window.onCustomSpriteChanged();", null);
                          }
                      } catch (Exception ignored) {}
                  }

                  @Override
                  protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                      super.onActivityResult(requestCode, resultCode, data);
                      if (requestCode == REQ_OVERLAY) {
                          if (Settings.canDrawOverlays(this)) {
                              startFloatingService();
                          }
                          if (controlWebView != null) {
                              controlWebView.evaluateJavascript("window.refreshDashboard && window.refreshDashboard();", null);
                          }
                      } else if (requestCode == REQ_MEDIA_PROJECTION) {
                          if (resultCode == Activity.RESULT_OK && data != null) {
                              Intent serviceIntent = new Intent(this, SystemAudioCaptureService.class);
                              serviceIntent.setAction(SystemAudioCaptureService.ACTION_START);
                              serviceIntent.putExtra(SystemAudioCaptureService.EXTRA_RESULT_DATA, data);
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  startForegroundService(serviceIntent);
                              } else {
                                  startService(serviceIntent);
                              }
                          }
                      } else if (requestCode == REQ_PICK_IDLE_SPRITE && resultCode == Activity.RESULT_OK && data != null) {
                          savePickedSpriteUri(data.getData(), "custom_idle.dat");
                      } else if (requestCode == REQ_PICK_TALK_SPRITE && resultCode == Activity.RESULT_OK && data != null) {
                          savePickedSpriteUri(data.getData(), "custom_talk.dat");
                      }
                  }

                  private void startFloatingService() {
                      Intent i = new Intent(this, FloatingOverlayService.class);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(i);
                      } else {
                          startService(i);
                      }
                  }

                  public class MainControlBridge {
                      @JavascriptInterface
                      public boolean canDrawOverlays() {
                          return Settings.canDrawOverlays(MainActivity.this);
                      }

                      @JavascriptInterface
                      public boolean isOverlayRunning() {
                          return FloatingOverlayService.instance != null;
                      }

                      @JavascriptInterface
                      public void toggleFloatingOverlay() {
                          runOnUiThread(() -> {
                              if (!Settings.canDrawOverlays(MainActivity.this)) {
                                  Intent intent = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                          Uri.parse("package:" + getPackageName()));
                                  startActivityForResult(intent, REQ_OVERLAY);
                                  return;
                              }
                              if (FloatingOverlayService.instance != null) {
                                  stopService(new Intent(MainActivity.this, FloatingOverlayService.class));
                              } else {
                                  startFloatingService();
                              }
                              controlWebView.postDelayed(() ->
                                      controlWebView.evaluateJavascript("window.refreshDashboard && window.refreshDashboard();", null), 400);
                          });
                      }

                      @JavascriptInterface
                      public void pickCustomSprite(final String kind) {
                          runOnUiThread(() -> {
                              Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                              intent.setType("image/*");
                              intent.addCategory(Intent.CATEGORY_OPENABLE);
                              int code = "talk".equals(kind) ? REQ_PICK_TALK_SPRITE : REQ_PICK_IDLE_SPRITE;
                              startActivityForResult(Intent.createChooser(intent, "选择自定义角色贴图 (PNG/GIF/WebP)"), code);
                          });
                      }

                      @JavascriptInterface
                      public void resetCustomSprites() {
                          runOnUiThread(() -> {
                              new File(getFilesDir(), "custom_idle.dat").delete();
                              new File(getFilesDir(), "custom_talk.dat").delete();
                              if (FloatingOverlayService.instance != null) {
                                  FloatingOverlayService.instance.notifyCustomSpriteUpdated();
                              }
                              if (controlWebView != null) {
                                  controlWebView.evaluateJavascript("window.onCustomSpriteChanged && window.onCustomSpriteChanged();", null);
                              }
                          });
                      }

                      @JavascriptInterface
                      public boolean hasCustomSprite(String kind) {
                          String fn = "talk".equals(kind) ? "custom_talk.dat" : "custom_idle.dat";
                          return new File(getFilesDir(), fn).exists();
                      }

                      @JavascriptInterface
                      public void openNotificationAccessSettings() {
                          Intent intent = new Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS);
                          startActivity(intent);
                      }

                      @JavascriptInterface
                      public void toggleSystemAudioCapture(boolean autoSliceWav) {
                          runOnUiThread(() -> {
                              if (SystemAudioCaptureService.isCapturing) {
                                  Intent stopIntent = new Intent(MainActivity.this, SystemAudioCaptureService.class);
                                  stopIntent.setAction(SystemAudioCaptureService.ACTION_STOP);
                                  startService(stopIntent);
                              } else {
                                  SystemAudioCaptureService.enableAutoSliceWav = autoSliceWav;
                                  MediaProjectionManager mpm = (MediaProjectionManager) getSystemService(Context.MEDIA_PROJECTION_SERVICE);
                                  if (mpm != null) {
                                      startActivityForResult(mpm.createScreenCaptureIntent(), REQ_MEDIA_PROJECTION);
                                  }
                              }
                          });
                      }

                      @JavascriptInterface
                      public String getDeviceStatusJson() {
                          return DeviceContextHelper.getDeviceStatusJson(MainActivity.this);
                      }

                      @JavascriptInterface
                      public void notifyConfigSaved(int newSizeDp) {
                          if (FloatingOverlayService.instance != null) {
                              FloatingOverlayService.instance.updatePetSizeFromSettings(newSizeDp);
                          }
                      }

                      @JavascriptInterface
                      public void triggerTestContextGreeting() {
                          if (FloatingOverlayService.instance != null) {
                              FloatingOverlayService.instance.evalPanelJs("window.triggerHalfHourContextChat && window.triggerHalfHourContextChat(true);");
                          }
                      }
                  }
              }
