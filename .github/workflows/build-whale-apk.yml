                <!-- 3. 长期记忆本 -->
                <div class="card">
                  <h3>🧠 第三步：长期记忆本（自动注入每次对话）</h3>
                  <div style="display:flex; gap:6px; margin-bottom:10px;">
                    <input id="new-mem-input" placeholder="例如：我每天早上7点半起床 / 喜欢喝冰美式..." style="flex:1; padding:8px 10px; border-radius:9px; border:1px solid rgba(255,255,255,0.16); background:#0f172a; color:#f8fafc; font-size:12.5px;" />
