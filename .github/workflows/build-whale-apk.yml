# ==============================================================================
# 🐟 DeepSeek 大肥鱼（dsh-coopanion）安卓全局悬浮伴侣版 · v7 自定义贴图与精准状态版
# ==============================================================================
# ✨ v7 针对实机反馈的 4 项专项修复与升级：
# 1. 【思考/生成时点击 ✕ 立即中断生成 (AbortController)】：
#    - 思考或流式输出期间，右侧按钮自动变为醒目的「✕ 停止」，点击瞬间调用 AbortController.abort()
#      切断网络流、停止读秒并保留已生成内容；再点一次 ✕ 则收起面板。
# 2. 【新增充电到 80% 与用电到 40% 实时探头提醒】：
#    - 监听原生 ACTION_BATTERY_CHANGED 广播：充电达到 80% 时自动探头提醒养护电池；
#      日常放电用到 40%（以及 20%）时自动探头提醒留意电量，带防重复触发状态锁。
# 3. 【彻底修复闹钟始终显示 00:00 的 Bug】：
#    - 原因：vivo/小米等系统后台计步器（如 vivo 健康）会注册午夜 00:00 的伪 AlarmClock 唤醒。
#    - 修复：优先读取系统时钟写入的 NEXT_ALARM_FORMATTED，并对 getNextAlarmClock() 校验创建者包名
#      （仅采纳系统时钟 com.android.BBKClock / deskclock / alarm 等真实闹钟，剔除 00:00 计步器伪闹钟）。
# 4. 【支持自定义角色贴图（从手机相册自由更换任意角色 PNG / GIF 动图 / WebP）】：
#    - 在主控制台新增「🖼️ 从相册更换角色贴图」与「🗣️ 更换说话张嘴差分贴图（可选）」，
#      支持静态透明 PNG（自动赋予呼吸与跳跃动画）和 GIF/WebP 动图，并可随时一键恢复默认大肥鱼。
# ==============================================================================

name: Build DeepSeek Whale Android APK v7

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出当前仓库
        uses: actions/checkout@v4

      - name: 2. 拉取 takboo/dsh-coopanion 官方仓库并提取原版大肥鱼贴图
        run: |
          git clone --depth 1 https://github.com/takboo/dsh-coopanion.git /tmp/dsh-coopanion
          mkdir -p /tmp/whale-android/app/src/main/assets/www
          cp -r /tmp/dsh-coopanion/web/* /tmp/whale-android/app/src/main/assets/www/ || true
          if [ -d "/tmp/dsh-coopanion/assets" ]; then
            cp -r /tmp/dsh-coopanion/assets /tmp/whale-android/app/src/main/assets/www/assets || true
          fi
          if [ -f "/tmp/dsh-coopanion/desktop/icon.png" ]; then
            cp /tmp/dsh-coopanion/desktop/icon.png /tmp/whale-android/app/src/main/assets/www/whale-official-icon.png
          fi
          python3 - << 'PY'
          import os, json

          root = '/tmp/whale-android/app/src/main/assets/www'
          files = []
          whale_images = []
          for dirpath, _, filenames in os.walk(root):
              for f in filenames:
                  full = os.path.join(dirpath, f)
                  rel = os.path.relpath(full, root).replace('\\', '/')
                  files.append(rel)
                  low = rel.lower()
                  if low.endswith(('.png', '.webp', '.svg', '.gif')) and ('whale' in low or 'icon' in low or 'figure' in low or 'assets' in low):
                      whale_images.append(rel)

          preferred = []
          for kw in ['whale-official-icon.png', 'preview', 'thumb', 'full', 'body', 'idle', 'stand', 'whale', 'icon']:
              for img in whale_images:
                  if kw in img.lower() and img not in preferred:
                      preferred.append(img)

          with open(os.path.join(root, 'whale-assets-manifest.json'), 'w', encoding='utf-8') as out:
              json.dump({'files': sorted(files), 'whaleImages': preferred}, out, ensure_ascii=False, indent=2)
          print(f"Extracted {len(files)} files, {len(preferred)} whale textures.")
          PY

      - name: 3. 配置 JDK 17 编译环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. 挂载预装 Android SDK 并签收协议
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: 5. 生成 v7 安卓工程（停止生成 + 80%/40%电量提醒 + 真实闹钟过滤 + 自定义角色贴图）
        run: |
          python3 - << 'PY'
          import os, textwrap

          base = '/tmp/whale-android'
          java_dir = os.path.join(base, 'app/src/main/java/com/takboo/whalecompanion')
          res_values = os.path.join(base, 'app/src/main/res/values')
          www_dir = os.path.join(base, 'app/src/main/assets/www')
          os.makedirs(java_dir, exist_ok=True)
          os.makedirs(res_values, exist_ok=True)
          os.makedirs(www_dir, exist_ok=True)

          # 1. Gradle 配置
          with open(os.path.join(base, 'settings.gradle'), 'w', encoding='utf-8') as f:
              f.write("rootProject.name = 'WhaleCompanionV7'\ninclude ':app'\n")

          with open(os.path.join(base, 'build.gradle'), 'w', encoding='utf-8') as f:
              f.write(textwrap.dedent(r"""
              buildscript {
                  repositories {
                      google()
                      mavenCentral()
                  }
                  dependencies {
                      classpath 'com.android.tools.build:gradle:8.2.2'
                  }
              }
              allprojects {
                  repositories {
                      google()
                      mavenCentral()
                  }
              }
              """).lstrip())

          with open(os.path.join(base, 'gradle.properties'), 'w', encoding='utf-8') as f:
              f.write("android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2048m\n")

          with open(os.path.join(base, 'app/build.gradle'), 'w', encoding='utf-8') as f:
              f.write(textwrap.dedent(r"""
              plugins {
                  id 'com.android.application'
              }
              android {
                  namespace 'com.takboo.whalecompanion'
                  compileSdk 34
                  defaultConfig {
                      applicationId "com.takboo.whalecompanion"
                      minSdk 29
                      targetSdk 34
                      versionCode 7
                      versionName "7.0.0-custom-sprite-alarm-fix"
                  }
                  buildTypes {
                      debug {
                          minifyEnabled false
                      }
                  }
                  compileOptions {
                      sourceCompatibility JavaVersion.VERSION_17
                      targetCompatibility JavaVersion.VERSION_17
                  }
              }
              dependencies {
                  implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  implementation 'androidx.appcompat:appcompat:1.6.1'
                  implementation 'androidx.core:core:1.12.0'
                  implementation 'androidx.webkit:webkit:1.9.0'
              }
              """).lstrip())

          # 2. AndroidManifest.xml
          with open(os.path.join(base, 'app/src/main/AndroidManifest.xml'), 'w', encoding='utf-8') as f:
              f.write(textwrap.dedent(r"""
              <?xml version="1.0" encoding="utf-8"?>
              <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                  <uses-permission android:name="android.permission.INTERNET" />
                  <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
                  <uses-permission android:name="android.permission.RECORD_AUDIO" />
                  <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
                  <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
                  <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
                  <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
                  <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
                  <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

                  <queries>
                      <package android:name="com.salt.music" />
                      <intent>
                          <action android:name="android.media.browse.MediaBrowserService" />
                      </intent>
                      <intent>
                          <action android:name="android.intent.action.SHOW_ALARMS" />
                      </intent>
                  </queries>

                  <application
                      android:allowBackup="true"
                      android:label="大肥鱼全局伴侣"
                      android:usesCleartextTraffic="true"
                      android:theme="@style/Theme.AppCompat.NoActionBar">

                      <activity
                          android:name=".MainActivity"
                          android:exported="true"
                          android:launchMode="singleTask"
                          android:configChanges="orientation|screenSize|keyboardHidden">
                          <intent-filter>
                              <action android:name="android.intent.action.MAIN" />
                              <category android:name="android.intent.category.LAUNCHER" />
                          </intent-filter>
                      </activity>

                      <service
                          android:name=".FloatingOverlayService"
                          android:enabled="true"
                          android:exported="false"
                          android:foregroundServiceType="specialUse">
                          <property
                              android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                              android:value="desktop_pet_companion_overlay" />
                      </service>

                      <service
                          android:name=".SystemAudioCaptureService"
                          android:enabled="true"
                          android:exported="false"
                          android:foregroundServiceType="mediaProjection" />

                      <service
                          android:name=".WhaleNotificationListener"
                          android:label="大肥鱼状态与歌名感知"
                          android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                          android:exported="true">
                          <intent-filter>
                              <action android:name="android.service.notification.NotificationListenerService" />
                          </intent-filter>
                      </service>
                  </application>
              </manifest>
              """).lstrip())

          # 3. WhaleNotificationListener.java (保持 Salt Player 椒盐音乐与全局媒体会话三通道识曲)
          with open(os.path.join(java_dir, 'WhaleNotificationListener.java'), 'w', encoding='utf-8') as f:
              f.write(textwrap.dedent(r"""
              package com.takboo.whalecompanion;

              import android.app.Notification;
              import android.content.BroadcastReceiver;
              import android.content.ComponentName;
              import android.content.Context;
              import android.content.Intent;
              import android.content.IntentFilter;
              import android.media.MediaMetadata;
              import android.media.session.MediaController;
              import android.media.session.MediaSession;
              import android.media.session.MediaSessionManager;
              import android.media.session.PlaybackState;
              import android.os.Build;
              import android.os.Bundle;
              import android.service.notification.NotificationListenerService;
              import android.service.notification.StatusBarNotification;
              import java.util.ArrayList;
              import java.util.List;

              public class WhaleNotificationListener extends NotificationListenerService {
                  public static volatile boolean isConnected = false;
                  public static volatile int missedCallCount = 0;
                  public static volatile int unreadSmsCount = 0;
                  public static volatile int unreadSocialCount = 0;
                  public static volatile String currentSongTitle = "";
                  public static volatile String currentSongArtist = "";
                  public static volatile String currentMusicApp = "";
                  private static String lastNotifiedSong = "";

                  private MediaSessionManager mediaSessionManager;
                  private final List<MediaController> registeredControllers = new ArrayList<>();

                  private final MediaSessionManager.OnActiveSessionsChangedListener sessionsChangedListener = controllers -> {
                      bindMediaControllers(controllers);
                      refreshActiveNotifications();
                  };

                  private final BroadcastReceiver mediaBroadcastReceiver = new BroadcastReceiver() {
                      @Override
                      public void onReceive(Context context, Intent intent) {
                          if (intent == null) return;
                          String track = intent.getStringExtra("track");
                          String artist = intent.getStringExtra("artist");
                          if (track != null && !track.trim().isEmpty()) {
                              updateSongState(track.trim(), artist != null ? artist.trim() : "", "broadcast");
                          }
                          refreshActiveNotifications();
                      }
                  };

                  @Override
                  public void onListenerConnected() {
                      super.onListenerConnected();
                      isConnected = true;
                      try {
                          mediaSessionManager = (MediaSessionManager) getSystemService(Context.MEDIA_SESSION_SERVICE);
                          if (mediaSessionManager != null) {
                              ComponentName cn = new ComponentName(this, WhaleNotificationListener.class);
                              mediaSessionManager.addOnActiveSessionsChangedListener(sessionsChangedListener, cn);
                              bindMediaControllers(mediaSessionManager.getActiveSessions(cn));
                          }
                      } catch (Exception ignored) {}

                      try {
                          IntentFilter mf = new IntentFilter();
                          mf.addAction("com.android.music.metachanged");
                          mf.addAction("com.android.music.playstatechanged");
                          mf.addAction("com.salt.music.metachanged");
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                              registerReceiver(mediaBroadcastReceiver, mf, Context.RECEIVER_EXPORTED);
                          } else {
                              registerReceiver(mediaBroadcastReceiver, mf);
                          }
                      } catch (Exception ignored) {}

                      refreshActiveNotifications();
                  }

                  @Override
                  public void onListenerDisconnected() {
                      super.onListenerDisconnected();
                      isConnected = false;
                      try {
                          if (mediaSessionManager != null) {
                              mediaSessionManager.removeOnActiveSessionsChangedListener(sessionsChangedListener);
                          }
                          unregisterReceiver(mediaBroadcastReceiver);
                      } catch (Exception ignored) {}
                  }

                  private void bindMediaControllers(List<MediaController> controllers) {
                      if (controllers == null) return;
                      registeredControllers.clear();
                      for (final MediaController mc : controllers) {
                          registeredControllers.add(mc);
                          readFromMediaController(mc);
                          try {
                              mc.registerCallback(new MediaController.Callback() {
                                  @Override
                                  public void onMetadataChanged(MediaMetadata metadata) {
                                      readFromMediaController(mc);
                                  }
                                  @Override
                                  public void onPlaybackStateChanged(PlaybackState state) {
                                      readFromMediaController(mc);
                                  }
                              });
                          } catch (Exception ignored) {}
                      }
                  }

                  private boolean readFromMediaController(MediaController mc) {
                      if (mc == null) return false;
                      try {
                          String pkg = mc.getPackageName() != null ? mc.getPackageName() : "";
                          PlaybackState ps = mc.getPlaybackState();
                          boolean isPlaying = ps != null && (ps.getState() == PlaybackState.STATE_PLAYING || ps.getState() == PlaybackState.STATE_BUFFERING);
                          MediaMetadata meta = mc.getMetadata();
                          if (meta != null) {
                              String title = meta.getString(MediaMetadata.METADATA_KEY_TITLE);
                              if (title == null || title.isEmpty()) {
                                  title = meta.getString(MediaMetadata.METADATA_KEY_DISPLAY_TITLE);
                              }
                              String artist = meta.getString(MediaMetadata.METADATA_KEY_ARTIST);
                              if (artist == null || artist.isEmpty()) {
                                  artist = meta.getString(MediaMetadata.METADATA_KEY_ALBUM_ARTIST);
                              }
                              if (artist == null || artist.isEmpty()) {
                                  artist = meta.getString(MediaMetadata.METADATA_KEY_ALBUM);
                              }
                              if (title != null && !title.trim().isEmpty()) {
                                  if (isPlaying || pkg.contains("com.salt.music") || currentSongTitle.isEmpty()) {
                                      updateSongState(title.trim(), artist != null ? artist.trim() : "", pkg);
                                      return true;
                                  }
                              }
                          }
                      } catch (Exception ignored) {}
                      return false;
                  }

                  private synchronized void updateSongState(String title, String artist, String pkg) {
                      if (title == null || title.isEmpty()) return;
                      currentSongTitle = title;
                      currentSongArtist = artist != null ? artist : "";
                      currentMusicApp = pkg != null ? pkg : "";
                      String fullSong = currentSongTitle + (currentSongArtist.isEmpty() ? "" : " - " + currentSongArtist);
                      if (!fullSong.equals(lastNotifiedSong)) {
                          lastNotifiedSong = fullSong;
                          if (FloatingOverlayService.instance != null) {
                              FloatingOverlayService.instance.notifySongChanged(fullSong);
                          }
                      }
                  }

                  @Override
                  public void onNotificationPosted(StatusBarNotification sbn) {
                      int prevMissed = missedCallCount;
                      refreshActiveNotifications();
                      if (missedCallCount > prevMissed && FloatingOverlayService.instance != null) {
                          FloatingOverlayService.instance.notifyInstantEvent("missed_call", "主人，刚才有未接来电哦，快看看是谁打来的吧！");
                      }
                  }

                  @Override
                  public void onNotificationRemoved(StatusBarNotification sbn) {
                      refreshActiveNotifications();
                  }

                  public void refreshActiveNotifications() {
                      try {
                          if (mediaSessionManager != null) {
                              ComponentName cn = new ComponentName(this, WhaleNotificationListener.class);
                              List<MediaController> activeList = mediaSessionManager.getActiveSessions(cn);
                              if (activeList != null) {
                                  for (MediaController mc : activeList) {
                                      if (readFromMediaController(mc)) break;
                                  }
                              }
                          }

                          StatusBarNotification[] list = getActiveNotifications();
                          if (list == null) return;
                          int missed = 0;
                          int sms = 0;
                          int social = 0;

                          for (StatusBarNotification sbn : list) {
                              String pkg = sbn.getPackageName() != null ? sbn.getPackageName().toLowerCase() : "";
                              Notification n = sbn.getNotification();
                              if (n == null) continue;
                              String cat = n.category != null ? n.category : "";
                              Bundle extras = n.extras;
                              String title = extras != null && extras.getCharSequence(Notification.EXTRA_TITLE) != null
                                      ? extras.getCharSequence(Notification.EXTRA_TITLE).toString().trim() : "";
                              String text = extras != null && extras.getCharSequence(Notification.EXTRA_TEXT) != null
                                      ? extras.getCharSequence(Notification.EXTRA_TEXT).toString().trim() : "";
                              String subText = extras != null && extras.getCharSequence(Notification.EXTRA_SUB_TEXT) != null
                                      ? extras.getCharSequence(Notification.EXTRA_SUB_TEXT).toString().trim() : "";

                              boolean isMusicPkg = pkg.contains("com.salt.music") || pkg.contains("salt")
                                      || pkg.contains("music") || pkg.contains("spotify")
                                      || pkg.contains("netease") || pkg.contains("kugou")
                                      || pkg.contains("kuwo") || pkg.contains("qqmusic")
                                      || pkg.contains("apple.android.music") || pkg.contains("foobar")
                                      || pkg.contains("poweramp") || pkg.contains("player");

                              if (extras != null && (extras.containsKey(Notification.EXTRA_MEDIA_SESSION) || "transport".equals(cat) || isMusicPkg)) {
                                  try {
                                      MediaSession.Token token = extras.getParcelable(Notification.EXTRA_MEDIA_SESSION);
                                      if (token != null) {
           	                              MediaController mc = new MediaController(this, token);
                                          if (readFromMediaController(mc)) continue;
                                      }
                                  } catch (Exception ignored) {}

                                  if (!title.isEmpty() && !title.equals("Salt Player") && !title.equals("椒盐音乐")) {
                                      updateSongState(title, !text.isEmpty() ? text : subText, pkg);
                                  }
                                  continue;
                              }

                              if (Notification.CATEGORY_MISSED_CALL.equals(cat) || (pkg.contains("dialer") || pkg.contains("telecom") || pkg.contains("phone")) && (title.contains("未接") || text.contains("未接") || title.toLowerCase().contains("missed"))) {
                                  missed++;
                              } else if (pkg.contains("mms") || pkg.contains("messaging") || pkg.contains("sms")) {
                                  sms++;
                              } else if (Notification.CATEGORY_MESSAGE.equals(cat) || pkg.contains("tencent.mm") || pkg.contains("mobileqq") || pkg.contains("telegram") || pkg.contains("whatsapp")) {
                                  social++;
                              }
                          }
                          missedCallCount = missed;
                          unreadSmsCount = sms;
                          unreadSocialCount = social;
                      } catch (Exception ignored) {}
                  }
              }
              """).lstrip())

          # 4. DeviceContextHelper.java (核心修复 #3：彻底解决 vivo/国产系统后台计步器伪造 00:00 闹钟的问题)
          with open(os.path.join(java_dir, 'DeviceContextHelper.java'), 'w', encoding='utf-8') as f:
              f.write(textwrap.dedent(r"""
              package com.takboo.whalecompanion;

              import android.Manifest;
              import android.app.AlarmManager;
              import android.app.PendingIntent;
              import android.content.Context;
              import android.content.Intent;
              import android.content.IntentFilter;
              import android.content.pm.PackageManager;
              import android.location.Location;
              import android.location.LocationManager;
              import android.os.BatteryManager;
              import android.provider.Settings;
              import androidx.core.content.ContextCompat;
              import org.json.JSONObject;
              import java.text.SimpleDateFormat;
              import java.util.Calendar;
              import java.util.Date;
              import java.util.List;
              import java.util.Locale;

              public class DeviceContextHelper {

                  // 精准获取真实用户闹钟（过滤 vivo 健康、微信计步器等注册的午夜 00:00 伪闹钟）
                  public static String resolveRealNextAlarm(Context ctx) {
                      try {
                          // 通道 A：先读系统时钟写入的 NEXT_ALARM_FORMATTED（vivo BBKClock / 原生 DeskClock 标准字段）
                          String sysFormatted = Settings.System.getString(ctx.getContentResolver(), Settings.System.NEXT_ALARM_FORMATTED);
                          if (sysFormatted != null) {
                              sysFormatted = sysFormatted.trim();
                              if (!sysFormatted.isEmpty() && !sysFormatted.endsWith("00:00") && !sysFormatted.equals("0:00")) {
                                  return sysFormatted;
                              }
                          }
                          String globalFormatted = Settings.Global.getString(ctx.getContentResolver(), "next_alarm_formatted");
                          if (globalFormatted != null) {
                              globalFormatted = globalFormatted.trim();
                              if (!globalFormatted.isEmpty() && !globalFormatted.endsWith("00:00") && !globalFormatted.equals("0:00")) {
                                  return globalFormatted;
                              }
                          }

                          // 通道 B：检查 AlarmManager.getNextAlarmClock() 并校验创建者包名与时间特征
                          AlarmManager am = (AlarmManager) ctx.getSystemService(Context.ALARM_SERVICE);
                          if (am != null && am.getNextAlarmClock() != null) {
                              AlarmManager.AlarmClockInfo info = am.getNextAlarmClock();
                              long triggerMs = info.getTriggerTime();
                              PendingIntent pi = info.getShowIntent();
                              String creatorPkg = (pi != null && pi.getCreatorPackage() != null)
                                      ? pi.getCreatorPackage().toLowerCase() : "";

                              Calendar cal = Calendar.getInstance();
                              cal.setTimeInMillis(triggerMs);
                              int hour = cal.get(Calendar.HOUR_OF_DAY);
                              int minute = cal.get(Calendar.MINUTE);
                              int second = cal.get(Calendar.SECOND);

                              // 判断是否来自真正的系统时钟/闹钟 App（如 vivo 的 com.android.bbkclock、原生 deskclock 等）
                              boolean isRealClockApp = creatorPkg.contains("clock")
                                      || creatorPkg.contains("alarm")
                                      || creatorPkg.contains("bbk")
                                      || creatorPkg.contains("time")
                                      || creatorPkg.contains("calendar");

                              // 判断是否是健康/计步/社交后台注册的午夜 00:00 定时任务
                              boolean isFakeMidnightReset = (hour == 0 && minute == 0) && (!isRealClockApp || second != 0);

                              if (!isFakeMidnightReset && (isRealClockApp || !(hour == 0 && minute == 0))) {
                                  SimpleDateFormat alarmFmt = new SimpleDateFormat("EEE HH:mm", Locale.CHINA);
                                  return alarmFmt.format(new Date(triggerMs));
                              }
                          }

                          // 如果用户在时钟里确实设置了一个整点 00:00 的真实闹钟且 NEXT_ALARM_FORMATTED 有值
                          if (sysFormatted != null && !sysFormatted.isEmpty()) {
                              AlarmManager am2 = (AlarmManager) ctx.getSystemService(Context.ALARM_SERVICE);
                              if (am2 != null && am2.getNextAlarmClock() != null && am2.getNextAlarmClock().getShowIntent() != null) {
                                  String pkg = am2.getNextAlarmClock().getShowIntent().getCreatorPackage();
                                  if (pkg != null && (pkg.toLowerCase().contains("clock") || pkg.toLowerCase().contains("alarm"))) {
                                      return sysFormatted;
                                  }
                              }
                          }
                      } catch (Exception ignored) {}
                      return "未设置";
                  }

                  public static String getDeviceStatusJson(Context ctx) {
                      JSONObject obj = new JSONObject();
                      try {
                          SimpleDateFormat sdf = new SimpleDateFormat("yyyy-MM-dd EEEE HH:mm", Locale.CHINA);
                          obj.put("timeStr", sdf.format(new Date()));

                          IntentFilter ifilter = new IntentFilter(Intent.ACTION_BATTERY_CHANGED);
                          Intent batteryStatus = ctx.registerReceiver(null, ifilter);
                          if (batteryStatus != null) {
                              int level = batteryStatus.getIntExtra(BatteryManager.EXTRA_LEVEL, -1);
                              int scale = batteryStatus.getIntExtra(BatteryManager.EXTRA_SCALE, -1);
                              int pct = (level >= 0 && scale > 0) ? Math.round((level * 100f) / scale) : -1;
                              int status = batteryStatus.getIntExtra(BatteryManager.EXTRA_STATUS, -1);
                              boolean isCharging = status == BatteryManager.BATTERY_STATUS_CHARGING || status == BatteryManager.BATTERY_STATUS_FULL;
                              int tempTenths = batteryStatus.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 0);
                              obj.put("batteryPct", pct);
                              obj.put("isCharging", isCharging);
                              obj.put("batteryTempC", tempTenths / 10.0);
                          }

                          obj.put("nextAlarm", resolveRealNextAlarm(ctx));

                          obj.put("notificationAccess", WhaleNotificationListener.isConnected);
                          obj.put("missedCalls", WhaleNotificationListener.missedCallCount);
                          obj.put("unreadSms", WhaleNotificationListener.unreadSmsCount);
                          obj.put("unreadSocial", WhaleNotificationListener.unreadSocialCount);
                          String song = WhaleNotificationListener.currentSongTitle;
                          if (!WhaleNotificationListener.currentSongArtist.isEmpty()) {
                              song += " - " + WhaleNotificationListener.currentSongArtist;
                          }
                          obj.put("currentSong", song);
                          obj.put("musicApp", WhaleNotificationListener.currentMusicApp);

                          if (ContextCompat.checkSelfPermission(ctx, Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED) {
                              LocationManager lm = (LocationManager) ctx.getSystemService(Context.LOCATION_SERVICE);
                              if (lm != null) {
                                  List<String> providers = lm.getProviders(true);
                                  Location best = null;
                                  for (String p : providers) {
                                      Location l = lm.getLastKnownLocation(p);
                                      if (l != null && (best == null || l.getAccuracy() < best.getAccuracy())) {
                                          best = l;
                                      }
                                  }
                                  if (best != null) {
                                      obj.put("lat", best.getLatitude());
                                      obj.put("lon", best.getLongitude());
                                  }
                              }
                          }
                      } catch (Exception ignored) {}
                      return obj.toString();
                  }
              }
