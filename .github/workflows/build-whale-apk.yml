                      screenHeight = dm.heightPixels;

                      int fullPx = dp(petSizeDp);
                      int halfPx = Math.max(dp(22), Math.round(fullPx * 0.56f));

                      if (isPeekMode) {
                          if ("left".equals(dockEdge)) {
                              petParams.width = halfPx;
                              petParams.height = fullPx;
                              petParams.x = 0;
                              petParams.y = Math.max(dp(40), Math.min(screenHeight - fullPx - dp(40), anchorY));
                          } else if ("right".equals(dockEdge)) {
                              petParams.width = halfPx;
                              petParams.height = fullPx;
                              petParams.x = screenWidth - halfPx;
                              petParams.y = Math.max(dp(40), Math.min(screenHeight - fullPx - dp(40), anchorY));
                          } else {
                              petParams.width = fullPx;
                              petParams.height = halfPx;
                              petParams.x = Math.max(dp(10), Math.min(screenWidth - fullPx - dp(10), anchorX));
                              petParams.y = screenHeight - halfPx;
                          }
                      } else {
                          petParams.width = fullPx;
                          petParams.height = fullPx;
                          if ("left".equals(dockEdge)) {
                              petParams.x = dp(4);
                              petParams.y = Math.max(dp(40), Math.min(screenHeight - fullPx - dp(40), anchorY));
                          } else if ("right".equals(dockEdge)) {
                              petParams.x = screenWidth - fullPx - dp(4);
                              petParams.y = Math.max(dp(40), Math.min(screenHeight - fullPx - dp(40), anchorY));
                          } else {
                              petParams.x = Math.max(dp(10), Math.min(screenWidth - fullPx - dp(10), anchorX));
                              petParams.y = screenHeight - fullPx - dp(6);
                          }
                      }
                      windowManager.updateViewLayout(petWebView, petParams);
                  }

                  private void showPanelWindow(String panelState, boolean focusKeyboard) {
