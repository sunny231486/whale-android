# ==============================================================================
# 🐟 DeepSeek 大肥鱼（dsh-coopanion）安卓全局 AI 助理版 · v8
# ==============================================================================
# ✨ v8 在 v7-fixed 基础上新增与修复：
# 1. 【音乐白名单自由配置 + 防抖冷却】：默认仅监听 com.salt.music（Salt Player），支持自由增删包名，
#    严格校验 PLAYING 状态 + 3秒防抖 + 可调冷却时间（默认120秒），彻底杜绝多软件同时播放触发刷屏请求。
# 2. 【通知权限持久化检测 + 自动静默重连】：改用系统 enabled_notification_listeners 真实状态校验，
#    若已授权但被 HyperOS 休眠解绑，自动调用 NotificationListenerService.requestRebind() 静默拉起。
# 3. 【原生文件导入/导出预设（SAF 存储访问框架）】：彻底替代失效的 prompt()，直接调起系统文件管理器
#    保存/读取 .json 预设文件（兼容 Android 10~15 / HyperOS），并附带可视化复制/粘贴弹窗备份。
# 4. 【Common Intents + Shizuku 双引擎动手能力】：AI 回复中可自动执行切歌/暂停(MediaController)、
#    设闹钟/倒计时(AlarmClock)、打开任意已安装 App、网页搜索、复制文本、调音量、Shizuku 调亮度等。
# 5. 【一键看屏互动（多模态识屏）】：面板新增「👁️ 看屏」按钮，Shizuku 已授权时毫秒级无弹窗静默截屏，
#    未开启 Shizuku 时自动回退为系统单次 MediaProjection 截屏，直传 Gemini / OpenAI 视觉接口。
# 6. 【长期记忆本 + 历史对话面板】：支持手动/AI自动写入长期记忆并持久注入上下文，浮窗内置可滚动历史记录抽屉。
# ==============================================================================

name: Build DeepSeek Whale Android APK v8

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出当前仓库
        uses: actions/checkout@v4

      - name: 2. 拉取 takboo/dsh-coopanion 官方仓库并提取原版大肥鱼贴图
        run: |
          git clone --depth 1 https://github.com/takboo/dsh-coopanion.git /tmp/dsh-coopanion
          mkdir -p /tmp/whale-android/app/src/main/assets/www
          cp -r /tmp/dsh-coopanion/web/* /tmp/whale-android/app/src/main/assets/www/ || true
          if [ -d "/tmp/dsh-coopanion/assets" ]; then
            cp -r /tmp/dsh-coopanion/assets /tmp/whale-android/app/src/main/assets/www/assets || true
          fi
          if [ -f "/tmp/dsh-coopanion/desktop/icon.png" ]; then
            cp /tmp/dsh-coopanion/desktop/icon.png /tmp/whale-android/app/src/main/assets/www/whale-official-icon.png
          fi
          python3 - << 'PY'
          import os, json

          root = '/tmp/whale-android/app/src/main/assets/www'
          files = []
          whale_images = []
          for dirpath, _, filenames in os.walk(root):
              for f in filenames:
                  full = os.path.join(dirpath, f)
                  rel = os.path.relpath(full, root).replace('\\', '/')
                  files.append(rel)
                  low = rel.lower()
                  if low.endswith(('.png', '.webp', '.svg', '.gif')) and ('whale' in low or 'icon' in low or 'figure' in low or 'assets' in low):
                      whale_images.append(rel)

          preferred = []
          for kw in ['whale-official-icon.png', 'preview', 'thumb', 'full', 'body', 'idle', 'stand', 'whale', 'icon']:
              for img in whale_images:
                  if kw in img.lower() and img not in preferred:
                      preferred.append(img)

          with open(os.path.join(root, 'whale-assets-manifest.json'), 'w', encoding='utf-8') as out:
              json.dump({'files': sorted(files), 'whaleImages': preferred}, out, ensure_ascii=False, indent=2)
          print(f"Extracted {len(files)} files, {len(preferred)} whale textures.")
          PY

      - name: 3. 配置 JDK 17 编译环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. 挂载预装 Android SDK 并签收协议
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: 5. 生成 v8 安卓工程（白名单识曲 + 通知自动重连 + Shizuku + Common Intents + 看屏 + 记忆/历史 + SAF 导入导出）
        run: |
          python3 - << 'PY'
          import os, textwrap

          base = '/tmp/whale-android'
          java_dir = os.path.join(base, 'app/src/main/java/com/takboo/whalecompanion')
          res_values = os.path.join(base, 'app/src/main/res/values')
          www_dir = os.path.join(base, 'app/src/main/assets/www')
          os.makedirs(java_dir, exist_ok=True)
          os.makedirs(res_values, exist_ok=True)
          os.makedirs(www_dir, exist_ok=True)

          # 1. Gradle 配置
          with open(os.path.join(base, 'settings.gradle'), 'w', encoding='utf-8') as f:
              f.write("rootProject.name = 'WhaleCompanionV8'\ninclude ':app'\n")

          with open(os.path.join(base, 'build.gradle'), 'w', encoding='utf-8') as f:
              f.write(textwrap.dedent(r"""
              buildscript {
                  repositories {
                      google()
                      mavenCentral()
                  }
                  dependencies {
                      classpath 'com.android.tools.build:gradle:8.2.2'
                  }
              }
              allprojects {
                  repositories {
                      google()
                      mavenCentral()
                  }
              }
              """).lstrip())

          with open(os.path.join(base, 'gradle.properties'), 'w', encoding='utf-8') as f:
              f.write("android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2048m\n")

          with open(os.path.join(base, 'app/build.gradle'), 'w', encoding='utf-8') as f:
              f.write(textwrap.dedent(r"""
              plugins {
                  id 'com.android.application'
              }
              android {
                  namespace 'com.takboo.whalecompanion'
                  compileSdk 34
                  defaultConfig {
                      applicationId "com.takboo.whalecompanion"
                      minSdk 29
                      targetSdk 34
                      versionCode 8
                      versionName "8.0.0-global-ai-assistant"
                  }
                  buildTypes {
                      debug {
                          minifyEnabled false
                      }
                  }
                  compileOptions {
                      sourceCompatibility JavaVersion.VERSION_17
                      targetCompatibility JavaVersion.VERSION_17
                  }
              }
              dependencies {
                  implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  implementation 'androidx.appcompat:appcompat:1.6.1'
                  implementation 'androidx.core:core:1.12.0'
                  implementation 'androidx.webkit:webkit:1.9.0'
                  implementation 'dev.rikka.shizuku:api:13.1.5'
                  implementation 'dev.rikka.shizuku:provider:13.1.5'
              }
              """).lstrip())

          # 2. AndroidManifest.xml
          with open(os.path.join(base, 'app/src/main/AndroidManifest.xml'), 'w', encoding='utf-8') as f:
              f.write(textwrap.dedent(r"""
              <?xml version="1.0" encoding="utf-8"?>
              <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                  <uses-permission android:name="android.permission.INTERNET" />
                  <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
                  <uses-permission android:name="android.permission.RECORD_AUDIO" />
                  <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
                  <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
                  <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
                  <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
                  <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
                  <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
                  <uses-permission android:name="com.android.alarm.permission.SET_ALARM" />
                  <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
                  <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
                  <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />

                  <queries>
                      <package android:name="com.salt.music" />
                      <package android:name="moe.shizuku.privileged.api" />
                      <intent>
                          <action android:name="android.media.browse.MediaBrowserService" />
                      </intent>
                      <intent>
                          <action android:name="android.intent.action.SHOW_ALARMS" />
                      </intent>
                      <intent>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent>
                  </queries>

                  <application
                      android:allowBackup="true"
                      android:label="大肥鱼全局伴侣"
                      android:usesCleartextTraffic="true"
                      android:theme="@style/Theme.AppCompat.NoActionBar">

                      <provider
                          android:name="rikka.shizuku.ShizukuProvider"
                          android:authorities="${applicationId}.shizuku"
                          android:multiprocess="false"
                          android:enabled="true"
                          android:exported="true"
                          android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />

                      <activity
                          android:name=".MainActivity"
                          android:exported="true"
                          android:launchMode="singleTask"
                          android:configChanges="orientation|screenSize|keyboardHidden">
                          <intent-filter>
                              <action android:name="android.intent.action.MAIN" />
                              <category android:name="android.intent.category.LAUNCHER" />
                          </intent-filter>
                      </activity>

                      <activity
                          android:name=".ScreenCaptureActivity"
                          android:exported="false"
                          android:excludeFromRecents="true"
                          android:theme="@android:style/Theme.Translucent.NoTitleBar" />

                      <service
                          android:name=".FloatingOverlayService"
                          android:enabled="true"
                          android:exported="false"
                          android:foregroundServiceType="specialUse">
                          <property
                              android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                              android:value="desktop_pet_companion_overlay" />
                      </service>

                      <service
                          android:name=".SystemAudioCaptureService"
                          android:enabled="true"
                          android:exported="false"
                          android:foregroundServiceType="mediaProjection" />

                      <service
                          android:name=".WhaleNotificationListener"
                          android:label="大肥鱼状态与歌名感知"
                          android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                          android:exported="true">
                          <intent-filter>
                              <action android:name="android.service.notification.NotificationListenerService" />
                          </intent-filter>
                      </service>
                  </application>
              </manifest>
              """).lstrip())

          # 3. ShizukuHelper.java (Shizuku 检测、授权、静默截屏与系统控制)
          with open(os.path.join(java_dir, 'ShizukuHelper.java'), 'w', encoding='utf-8') as f:
              f.write(textwrap.dedent(r"""
              package com.takboo.whalecompanion;

              import android.content.Context;
              import android.content.pm.PackageManager;
              import android.graphics.Bitmap;
              import android.graphics.BitmapFactory;
              import android.util.Base64;
              import java.io.ByteArrayOutputStream;
              import java.io.InputStream;
              import java.lang.reflect.Method;
              import rikka.shizuku.Shizuku;

              public class ShizukuHelper {
                  public static final int REQ_SHIZUKU_PERMISSION = 3001;

                  public static boolean isAvailable() {
                      try {
                          return Shizuku.pingBinder();
                      } catch (Throwable ignored) {
                          return false;
                      }
                  }

                  public static boolean hasPermission() {
                      try {
                          if (!Shizuku.pingBinder()) return false;
                          if (Shizuku.isPreV11()) return false;
                          return Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED;
                      } catch (Throwable ignored) {
                          return false;
                      }
                  }

                  public static String getStatusText() {
                      if (!isAvailable()) return "未运行（请先在 Shizuku App 中启动服务）";
                      if (hasPermission()) return "已授权并就绪（支持免弹窗静默截屏与系统控制）";
                      return "服务运行中，等待点击授权";
                  }

                  public static boolean requestPermission() {
                      try {
                          if (!Shizuku.pingBinder()) return false;
                          if (Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED) return true;
                          Shizuku.requestPermission(REQ_SHIZUKU_PERMISSION);
                          return true;
                      } catch (Throwable ignored) {
                          return false;
                      }
                  }

                  private static Process startShizukuProcess(String[] cmd) throws Exception {
                      Method m = Shizuku.class.getDeclaredMethod("newProcess", String[].class, String[].class, String.class);
                      m.setAccessible(true);
                      return (Process) m.invoke(null, cmd, null, null);
                  }

                  public static byte[] execShellBytes(String[] cmd) {
                      if (!hasPermission()) return null;
                      Process proc = null;
                      try {
                          proc = startShizukuProcess(cmd);
                          if (proc == null) return null;
                          InputStream is = proc.getInputStream();
                          ByteArrayOutputStream baos = new ByteArrayOutputStream();
                          byte[] buf = new byte[16384];
                          int len;
                          while ((len = is.read(buf)) > 0) {
                              baos.write(buf, 0, len);
                          }
                          proc.waitFor();
                          return baos.toByteArray();
                      } catch (Throwable ignored) {
                          return null;
                      } finally {
                          if (proc != null) {
                              try { proc.destroy(); } catch (Throwable ignored) {}
                          }
                      }
                  }

                  public static String execShellText(String command) {
                      byte[] out = execShellBytes(new String[]{"sh", "-c", command});
                      if (out == null) return null;
                      return new String(out).trim();
                  }

                  public static String captureScreenBase64(Context ctx) {
                      if (!hasPermission()) return null;
                      try {
                          byte[] pngBytes = execShellBytes(new String[]{"screencap", "-p"});
                          if (pngBytes == null || pngBytes.length < 1024) return null;
                          Bitmap bmp = BitmapFactory.decodeByteArray(pngBytes, 0, pngBytes.length);
                          if (bmp == null) return null;
                          return encodeBitmapToJpegBase64(bmp, 960, 74);
                      } catch (Throwable ignored) {
                          return null;
                      }
                  }

                  public static String encodeBitmapToJpegBase64(Bitmap bmp, int maxWidth, int quality) {
                      if (bmp == null) return null;
                      try {
                          Bitmap target = bmp;
                          if (bmp.getWidth() > maxWidth) {
                              int newH = Math.round((float) bmp.getHeight() * maxWidth / bmp.getWidth());
                              target = Bitmap.createScaledBitmap(bmp, maxWidth, newH, true);
                          }
                          ByteArrayOutputStream baos = new ByteArrayOutputStream();
                          target.compress(Bitmap.CompressFormat.JPEG, quality, baos);
                          if (target != bmp) target.recycle();
                          bmp.recycle();
                          return Base64.encodeToString(baos.toByteArray(), Base64.NO_WRAP);
                      } catch (Throwable ignored) {
                          return null;
                      }
                  }
              }
              """).lstrip())

          # 4. WhaleNotificationListener.java (严格白名单音乐识曲 + PLAYING 校验 + 防抖 + MediaController 播放控制)
          with open(os.path.join(java_dir, 'WhaleNotificationListener.java'), 'w', encoding='utf-8') as f:
              f.write(textwrap.dedent(r"""
              package com.takboo.whalecompanion;

              import android.app.Notification;
              import android.content.BroadcastReceiver;
              import android.content.ComponentName;
              import android.content.Context;
              import android.content.Intent;
              import android.content.IntentFilter;
              import android.content.SharedPreferences;
              import android.media.MediaMetadata;
              import android.media.session.MediaController;
              import android.media.session.MediaSession;
              import android.media.session.MediaSessionManager;
              import android.media.session.PlaybackState;
              import android.os.Build;
              import android.os.Bundle;
              import android.os.Handler;
              import android.os.Looper;
              import android.service.notification.NotificationListenerService;
              import android.service.notification.StatusBarNotification;
              import java.util.ArrayList;
              import java.util.Arrays;
              import java.util.List;

              public class WhaleNotificationListener extends NotificationListenerService {
                  public static volatile boolean isConnected = false;
                  public static volatile WhaleNotificationListener instance = null;
                  public static volatile int missedCallCount = 0;
                  public static volatile int unreadSmsCount = 0;
                  public static volatile int unreadSocialCount = 0;
                  public static volatile String currentSongTitle = "";
                  public static volatile String currentSongArtist = "";
                  public static volatile String currentMusicApp = "";
                  private static String lastNotifiedSong = "";
                  private static long lastSongNotifyTimeMs = 0L;

                  private MediaSessionManager mediaSessionManager;
                  private final List<MediaController> registeredControllers = new ArrayList<>();
                  private final Handler debounceHandler = new Handler(Looper.getMainLooper());
                  private Runnable pendingSongRunnable = null;

                  public static List<String> getMusicWhitelist(Context ctx) {
                      SharedPreferences sp = ctx.getSharedPreferences("whale_native_prefs", MODE_PRIVATE);
                      String raw = sp.getString("musicWhitelist", "com.salt.music");
                      List<String> list = new ArrayList<>();
                      if (raw != null) {
                          String[] parts = raw.split("[,;\\s\\n]+");
                          for (String p : parts) {
                              String t = p.trim().toLowerCase();
                              if (!t.isEmpty()) list.add(t);
                          }
                      }
                      if (list.isEmpty()) list.add("com.salt.music");
                      return list;
                  }

                  public static boolean isPackageWhitelisted(Context ctx, String pkg) {
                      if (pkg == null || pkg.trim().isEmpty()) return false;
                      String low = pkg.trim().toLowerCase();
                      for (String allowed : getMusicWhitelist(ctx)) {
                          if (low.equals(allowed) || low.contains(allowed)) {
                              return true;
                          }
                      }
                      return false;
                  }

                  public static int getSongCooldownSec(Context ctx) {
                      SharedPreferences sp = ctx.getSharedPreferences("whale_native_prefs", MODE_PRIVATE);
                      return Math.max(10, sp.getInt("songCooldownSec", 120));
                  }

                  public static boolean controlMediaPlayback(Context ctx, String action) {
                      try {
                          MediaSessionManager msm = (MediaSessionManager) ctx.getSystemService(Context.MEDIA_SESSION_SERVICE);
                          if (msm == null) return false;
                          ComponentName cn = new ComponentName(ctx, WhaleNotificationListener.class);
                          List<MediaController> list = msm.getActiveSessions(cn);
                          if (list == null || list.isEmpty()) return false;
                          MediaController target = null;
                          for (MediaController mc : list) {
                              if (isPackageWhitelisted(ctx, mc.getPackageName())) {
                                  target = mc;
                                  break;
                              }
                          }
                          if (target == null) target = list.get(0);
                          MediaController.TransportControls tc = target.getTransportControls();
                          if ("next".equals(action)) { tc.skipToNext(); return true; }
                          if ("prev".equals(action)) { tc.skipToPrevious(); return true; }
                          if ("pause".equals(action)) { tc.pause(); return true; }
                          if ("play".equals(action)) { tc.play(); return true; }
                      } catch (Exception ignored) {}
                      return false;
                  }

                  private final MediaSessionManager.OnActiveSessionsChangedListener sessionsChangedListener = controllers -> {
                      bindMediaControllers(controllers);
                      refreshActiveNotifications();
                  };

                  private final BroadcastReceiver mediaBroadcastReceiver = new BroadcastReceiver() {
                      @Override
                      public void onReceive(Context context, Intent intent) {
                          if (intent == null) return;
                          // 仅当 Salt Player 在白名单中时响应其专属切歌广播，避免其他软件的通用广播误触发
                          if (!isPackageWhitelisted(context, "com.salt.music")) return;
                          String act = intent.getAction();
                          if (!"com.salt.music.metachanged".equals(act)) return;
                          boolean playing = intent.getBooleanExtra("playing", true);
                          if (!playing) return;
                          String track = intent.getStringExtra("track");
                          String artist = intent.getStringExtra("artist");
                          if (track != null && !track.trim().isEmpty()) {
                              updateSongState(track.trim(), artist != null ? artist.trim() : "", "com.salt.music");
                          }
                      }
                  };

                  @Override
                  public void onListenerConnected() {
                      super.onListenerConnected();
                      isConnected = true;
                      instance = this;
                      try {
                          mediaSessionManager = (MediaSessionManager) getSystemService(Context.MEDIA_SESSION_SERVICE);
                          if (mediaSessionManager != null) {
                              ComponentName cn = new ComponentName(this, WhaleNotificationListener.class);
                              mediaSessionManager.addOnActiveSessionsChangedListener(sessionsChangedListener, cn);
                              bindMediaControllers(mediaSessionManager.getActiveSessions(cn));
                          }
                      } catch (Exception ignored) {}

                      try {
                          IntentFilter mf = new IntentFilter();
                          mf.addAction("com.salt.music.metachanged");
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                              registerReceiver(mediaBroadcastReceiver, mf, Context.RECEIVER_EXPORTED);
                          } else {
                              registerReceiver(mediaBroadcastReceiver, mf);
                          }
                      } catch (Exception ignored) {}

                      refreshActiveNotifications();
                  }

                  @Override
                  public void onListenerDisconnected() {
                      super.onListenerDisconnected();
                      isConnected = false;
                      instance = null;
                      try {
                          if (mediaSessionManager != null) {
                              mediaSessionManager.removeOnActiveSessionsChangedListener(sessionsChangedListener);
                          }
                          unregisterReceiver(mediaBroadcastReceiver);
                      } catch (Exception ignored) {}
                  }

                  private void bindMediaControllers(List<MediaController> controllers) {
                      if (controllers == null) return;
                      registeredControllers.clear();
                      for (final MediaController mc : controllers) {
                          if (!isPackageWhitelisted(this, mc.getPackageName())) continue;
                          registeredControllers.add(mc);
                          readFromMediaController(mc);
                          try {
                              mc.registerCallback(new MediaController.Callback() {
                                  @Override
                                  public void onMetadataChanged(MediaMetadata metadata) {
                                      readFromMediaController(mc);
                                  }
                                  @Override
                                  public void onPlaybackStateChanged(PlaybackState state) {
                                      readFromMediaController(mc);
                                  }
                              });
                          } catch (Exception ignored) {}
                      }
                  }

                  private boolean readFromMediaController(MediaController mc) {
                      if (mc == null) return false;
                      try {
                          String pkg = mc.getPackageName() != null ? mc.getPackageName() : "";
                          if (!isPackageWhitelisted(this, pkg)) return false;

                          PlaybackState ps = mc.getPlaybackState();
                          boolean isPlaying = ps != null && ps.getState() == PlaybackState.STATE_PLAYING;
                          if (!isPlaying) return false;

                          MediaMetadata meta = mc.getMetadata();
                          if (meta != null) {
                              String title = meta.getString(MediaMetadata.METADATA_KEY_TITLE);
                              if (title == null || title.isEmpty()) {
                                  title = meta.getString(MediaMetadata.METADATA_KEY_DISPLAY_TITLE);
                              }
                              String artist = meta.getString(MediaMetadata.METADATA_KEY_ARTIST);
                              if (artist == null || artist.isEmpty()) {
                                  artist = meta.getString(MediaMetadata.METADATA_KEY_ALBUM_ARTIST);
                              }
                              if (artist == null || artist.isEmpty()) {
                                  artist = meta.getString(MediaMetadata.METADATA_KEY_ALBUM);
                              }
                              if (title != null && !title.trim().isEmpty()) {
                                  updateSongState(title.trim(), artist != null ? artist.trim() : "", pkg);
                                  return true;
                              }
                          }
                      } catch (Exception ignored) {}
                      return false;
                  }

                  private synchronized void updateSongState(String title, String artist, String pkg) {
                      if (title == null || title.isEmpty()) return;
                      if (!isPackageWhitelisted(this, pkg)) return;
                      currentSongTitle = title;
                      currentSongArtist = artist != null ? artist : "";
                      currentMusicApp = pkg != null ? pkg : "";
                      final String fullSong = currentSongTitle + (currentSongArtist.isEmpty() ? "" : " - " + currentSongArtist);
                      if (fullSong.equals(lastNotifiedSong)) return;

                      // 3 秒防抖：确保连续切歌时只触发最终停留的那一首，且遵守冷却时间
                      if (pendingSongRunnable != null) {
                          debounceHandler.removeCallbacks(pendingSongRunnable);
                      }
                      pendingSongRunnable = () -> {
                          long now = System.currentTimeMillis();
                          long cooldownMs = getSongCooldownSec(WhaleNotificationListener.this) * 1000L;
                          if (fullSong.equals(lastNotifiedSong)) return;
                          lastNotifiedSong = fullSong;
                          if (now - lastSongNotifyTimeMs < cooldownMs) return;
                          lastSongNotifyTimeMs = now;
                          if (FloatingOverlayService.instance != null) {
                              FloatingOverlayService.instance.notifySongChanged(fullSong);
                          }
                      };
                      debounceHandler.postDelayed(pendingSongRunnable, 3000);
                  }

                  @Override
                  public void onNotificationPosted(StatusBarNotification sbn) {
                      int prevMissed = missedCallCount;
                      refreshActiveNotifications();
                      if (missedCallCount > prevMissed && FloatingOverlayService.instance != null) {
                          FloatingOverlayService.instance.notifyInstantEvent("missed_call", "主人，刚才有未接来电哦，快看看是谁打来的吧！");
                      }
                  }

                  @Override
                  public void onNotificationRemoved(StatusBarNotification sbn) {
                      refreshActiveNotifications();
                  }

                  public void refreshActiveNotifications() {
                      try {
                          boolean foundWhitelistedPlaying = false;
                          if (mediaSessionManager != null) {
                              ComponentName cn = new ComponentName(this, WhaleNotificationListener.class);
                              List<MediaController> activeList = mediaSessionManager.getActiveSessions(cn);
                              if (activeList != null) {
                                  for (MediaController mc : activeList) {
                                      if (readFromMediaController(mc)) {
                                          foundWhitelistedPlaying = true;
                                          break;
                                      }
                                  }
                              }
                          }

                          StatusBarNotification[] list = getActiveNotifications();
                          if (list == null) return;
                          int missed = 0;
                          int sms = 0;
                          int social = 0;

                          for (StatusBarNotification sbn : list) {
                              String pkg = sbn.getPackageName() != null ? sbn.getPackageName().toLowerCase() : "";
                              Notification n = sbn.getNotification();
                              if (n == null) continue;
                              String cat = n.category != null ? n.category : "";
                              Bundle extras = n.extras;
                              String title = extras != null && extras.getCharSequence(Notification.EXTRA_TITLE) != null
                                      ? extras.getCharSequence(Notification.EXTRA_TITLE).toString().trim() : "";
                              String text = extras != null && extras.getCharSequence(Notification.EXTRA_TEXT) != null
                                      ? extras.getCharSequence(Notification.EXTRA_TEXT).toString().trim() : "";
                              String subText = extras != null && extras.getCharSequence(Notification.EXTRA_SUB_TEXT) != null
                                      ? extras.getCharSequence(Notification.EXTRA_SUB_TEXT).toString().trim() : "";

                              // 严格限制：仅白名单内的播放器通知才解析为歌曲，彻底忽略 B站/抖音/系统视频等其他媒体
                              if (!foundWhitelistedPlaying && isPackageWhitelisted(this, pkg) && extras != null) {
                                  try {
                                      MediaSession.Token token = extras.getParcelable(Notification.EXTRA_MEDIA_SESSION);
                                      if (token != null) {
                                          MediaController mc = new MediaController(this, token);
                                          if (readFromMediaController(mc)) {
                                              foundWhitelistedPlaying = true;
                                              continue;
                                          }
                                      }
                                  } catch (Exception ignored) {}
                                  continue;
                              }

                              if (Notification.CATEGORY_MISSED_CALL.equals(cat) || (pkg.contains("dialer") || pkg.contains("telecom") || pkg.contains("phone")) && (title.contains("未接") || text.contains("未接") || title.toLowerCase().contains("missed"))) {
                                  missed++;
                              } else if (pkg.contains("mms") || pkg.contains("messaging") || pkg.contains("sms")) {
                                  sms++;
                              } else if (Notification.CATEGORY_MESSAGE.equals(cat) || pkg.contains("tencent.mm") || pkg.contains("mobileqq") || pkg.contains("telegram") || pkg.contains("whatsapp")) {
                                  social++;
                              }
                          }
                          missedCallCount = missed;
                          unreadSmsCount = sms;
                          unreadSocialCount = social;
                      } catch (Exception ignored) {}
                  }
              }
              """).lstrip())

          # 5. DeviceContextHelper.java (真实通知权限检测 + requestRebind 自动重连 + 真实闹钟过滤 + Shizuku 状态)
          with open(os.path.join(java_dir, 'DeviceContextHelper.java'), 'w', encoding='utf-8') as f:
              f.write(textwrap.dedent(r"""
              package com.takboo.whalecompanion;

              import android.Manifest;
              import android.app.AlarmManager;
              import android.app.PendingIntent;
              import android.content.ComponentName;
              import android.content.Context;
              import android.content.Intent;
              import android.content.IntentFilter;
              import android.content.pm.PackageManager;
              import android.location.Location;
              import android.location.LocationManager;
              import android.os.BatteryManager;
              import android.os.Build;
              import android.provider.Settings;
              import android.service.notification.NotificationListenerService;
              import androidx.core.content.ContextCompat;
              import org.json.JSONObject;
              import java.text.SimpleDateFormat;
              import java.util.Calendar;
              import java.util.Date;
              import java.util.List;
              import java.util.Locale;

              public class DeviceContextHelper {

                  public static boolean isNotificationListenerEnabled(Context ctx) {
                      try {
                          String flat = Settings.Secure.getString(ctx.getContentResolver(), "enabled_notification_listeners");
                          if (flat == null || flat.isEmpty()) return false;
                          return flat.contains(ctx.getPackageName());
                      } catch (Exception ignored) {
                          return false;
                      }
                  }

                  public static void ensureNotificationListenerBound(Context ctx) {
                      try {
                          if (isNotificationListenerEnabled(ctx) && !WhaleNotificationListener.isConnected) {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                                  NotificationListenerService.requestRebind(
                                          new ComponentName(ctx, WhaleNotificationListener.class)
                                  );
                              }
                          }
                      } catch (Exception ignored) {}
                  }

                  public static String resolveRealNextAlarm(Context ctx) {
                      try {
                          String sysFormatted = Settings.System.getString(ctx.getContentResolver(), Settings.System.NEXT_ALARM_FORMATTED);
                          if (sysFormatted != null) {
                              sysFormatted = sysFormatted.trim();
                              if (!sysFormatted.isEmpty() && !sysFormatted.endsWith("00:00") && !sysFormatted.equals("0:00")) {
                                  return sysFormatted;
                              }
                          }
                          String globalFormatted = Settings.Global.getString(ctx.getContentResolver(), "next_alarm_formatted");
                          if (globalFormatted != null) {
                              globalFormatted = globalFormatted.trim();
                              if (!globalFormatted.isEmpty() && !globalFormatted.endsWith("00:00") && !globalFormatted.equals("0:00")) {
                                  return globalFormatted;
                              }
                          }

                          AlarmManager am = (AlarmManager) ctx.getSystemService(Context.ALARM_SERVICE);
                          if (am != null && am.getNextAlarmClock() != null) {
                              AlarmManager.AlarmClockInfo info = am.getNextAlarmClock();
                              long triggerMs = info.getTriggerTime();
                              PendingIntent pi = info.getShowIntent();
                              String creatorPkg = (pi != null && pi.getCreatorPackage() != null)
                                      ? pi.getCreatorPackage().toLowerCase() : "";

                              Calendar cal = Calendar.getInstance();
                              cal.setTimeInMillis(triggerMs);
                              int hour = cal.get(Calendar.HOUR_OF_DAY);
                              int minute = cal.get(Calendar.MINUTE);
                              int second = cal.get(Calendar.SECOND);

                              boolean isRealClockApp = creatorPkg.contains("clock")
                                      || creatorPkg.contains("alarm")
                                      || creatorPkg.contains("bbk")
                                      || creatorPkg.contains("miui")
                                      || creatorPkg.contains("time")
                                      || creatorPkg.contains("calendar");

                              boolean isFakeMidnightReset = (hour == 0 && minute == 0) && (!isRealClockApp || second != 0);

                              if (!isFakeMidnightReset && (isRealClockApp || !(hour == 0 && minute == 0))) {
                                  SimpleDateFormat alarmFmt = new SimpleDateFormat("EEE HH:mm", Locale.CHINA);
                                  return alarmFmt.format(new Date(triggerMs));
                              }
                          }
                      } catch (Exception ignored) {}
                      return "未设置";
                  }

                  public static String getDeviceStatusJson(Context ctx) {
                      ensureNotificationListenerBound(ctx);
                      JSONObject obj = new JSONObject();
                      try {
                          SimpleDateFormat sdf = new SimpleDateFormat("yyyy-MM-dd EEEE HH:mm", Locale.CHINA);
                          obj.put("timeStr", sdf.format(new Date()));

                          IntentFilter ifilter = new IntentFilter(Intent.ACTION_BATTERY_CHANGED);
                          Intent batteryStatus = ctx.registerReceiver(null, ifilter);
                          if (batteryStatus != null) {
                              int level = batteryStatus.getIntExtra(BatteryManager.EXTRA_LEVEL, -1);
                              int scale = batteryStatus.getIntExtra(BatteryManager.EXTRA_SCALE, -1);
                              int pct = (level >= 0 && scale > 0) ? Math.round((level * 100f) / scale) : -1;
                              int status = batteryStatus.getIntExtra(BatteryManager.EXTRA_STATUS, -1);
                              boolean isCharging = status == BatteryManager.BATTERY_STATUS_CHARGING || status == BatteryManager.BATTERY_STATUS_FULL;
                              int tempTenths = batteryStatus.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 0);
                              obj.put("batteryPct", pct);
                              obj.put("isCharging", isCharging);
                              obj.put("batteryTempC", tempTenths / 10.0);
                          }

                          obj.put("nextAlarm", resolveRealNextAlarm(ctx));

                          boolean notifGranted = isNotificationListenerEnabled(ctx);
                          obj.put("notificationGranted", notifGranted);
                          obj.put("notificationAccess", WhaleNotificationListener.isConnected);
                          obj.put("shizukuAvailable", ShizukuHelper.isAvailable());
                          obj.put("shizukuGranted", ShizukuHelper.hasPermission());
                          obj.put("shizukuStatus", ShizukuHelper.getStatusText());

                          obj.put("missedCalls", WhaleNotificationListener.missedCallCount);
                          obj.put("unreadSms", WhaleNotificationListener.unreadSmsCount);
                          obj.put("unreadSocial", WhaleNotificationListener.unreadSocialCount);
                          String song = WhaleNotificationListener.currentSongTitle;
                          if (!WhaleNotificationListener.currentSongArtist.isEmpty()) {
                              song += " - " + WhaleNotificationListener.currentSongArtist;
                          }
                          obj.put("currentSong", song);
                          obj.put("musicApp", WhaleNotificationListener.currentMusicApp);

                          if (ContextCompat.checkSelfPermission(ctx, Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED) {
                              LocationManager lm = (LocationManager) ctx.getSystemService(Context.LOCATION_SERVICE);
                              if (lm != null) {
                                  List<String> providers = lm.getProviders(true);
                                  Location best = null;
                                  for (String p : providers) {
                                      Location l = lm.getLastKnownLocation(p);
                                      if (l != null && (best == null || l.getAccuracy() < best.getAccuracy())) {
                                          best = l;
                                      }
                                  }
                                  if (best != null) {
                                      obj.put("lat", best.getLatitude());
                                      obj.put("lon", best.getLongitude());
                                  }
                              }
                          }
                      } catch (Exception ignored) {}
                      return obj.toString();
                  }
              }
              """).lstrip())

          # 6. AssistantActionHelper.java (Common Intents + MediaController + Shizuku 动手执行引擎)
          with open(os.path.join(java_dir, 'AssistantActionHelper.java'), 'w', encoding='utf-8') as f:
              f.write(textwrap.dedent(r"""
              package com.takboo.whalecompanion;

              import android.app.SearchManager;
              import android.content.ClipData;
              import android.content.ClipboardManager;
              import android.content.Context;
              import android.content.Intent;
              import android.content.pm.ApplicationInfo;
              import android.content.pm.PackageManager;
              import android.media.AudioManager;
              import android.net.Uri;
              import android.provider.AlarmClock;
              import android.view.KeyEvent;
              import java.util.List;

              public class AssistantActionHelper {

                  public static String executeAction(Context ctx, String actionType, String arg1, String arg2) {
                      if (actionType == null) return "未知指令";
                      String act = actionType.trim().toLowerCase();
                      String a1 = arg1 != null ? arg1.trim() : "";
                      String a2 = arg2 != null ? arg2.trim() : "";

                      try {
                          switch (act) {
                              case "music_next":
                                  if (WhaleNotificationListener.controlMediaPlayback(ctx, "next")) return "已切到下一首";
                                  sendMediaKey(ctx, KeyEvent.KEYCODE_MEDIA_NEXT);
                                  return "已发送下一首指令";
                              case "music_prev":
                                  if (WhaleNotificationListener.controlMediaPlayback(ctx, "prev")) return "已切回上一首";
                                  sendMediaKey(ctx, KeyEvent.KEYCODE_MEDIA_PREVIOUS);
                                  return "已发送上一首指令";
                              case "music_pause":
                                  if (WhaleNotificationListener.controlMediaPlayback(ctx, "pause")) return "已暂停播放";
                                  sendMediaKey(ctx, KeyEvent.KEYCODE_MEDIA_PAUSE);
                                  return "已发送暂停指令";
                              case "music_play":
                                  if (WhaleNotificationListener.controlMediaPlayback(ctx, "play")) return "已继续播放";
                                  sendMediaKey(ctx, KeyEvent.KEYCODE_MEDIA_PLAY);
                                  return "已发送播放指令";

                              case "set_alarm": {
                                  String[] hm = a1.replace("：", ":").split(":");
                                  int hour = Integer.parseInt(hm[0].trim());
                                  int minute = hm.length > 1 ? Integer.parseInt(hm[1].trim()) : 0;
                                  Intent intent = new Intent(AlarmClock.ACTION_SET_ALARM);
                                  intent.putExtra(AlarmClock.EXTRA_HOUR, hour);
                                  intent.putExtra(AlarmClock.EXTRA_MINUTES, minute);
                                  if (!a2.isEmpty()) intent.putExtra(AlarmClock.EXTRA_MESSAGE, a2);
                                  intent.putExtra(AlarmClock.EXTRA_SKIP_UI, true);
                                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                  ctx.startActivity(intent);
                                  return String.format("已设定 %02d:%02d 闹钟%s", hour, minute, a2.isEmpty() ? "" : "（" + a2 + "）");
                              }

                              case "set_timer": {
                                  int seconds = Math.max(1, Integer.parseInt(a1.replaceAll("[^0-9]", "")));
                                  Intent intent = new Intent(AlarmClock.ACTION_SET_TIMER);
                                  intent.putExtra(AlarmClock.EXTRA_LENGTH, seconds);
                                  if (!a2.isEmpty()) intent.putExtra(AlarmClock.EXTRA_MESSAGE, a2);
                                  intent.putExtra(AlarmClock.EXTRA_SKIP_UI, true);
                                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                  ctx.startActivity(intent);
                                  return "已开启 " + seconds + " 秒倒计时" + (a2.isEmpty() ? "" : "（" + a2 + "）");
                              }

                              case "open_app": {
                                  String opened = openAppByNameOrPkg(ctx, a1);
                                  return opened != null ? "已打开 " + opened : "未找到应用：" + a1;
                              }

                              case "web_search": {
                                  try {
                                      Intent si = new Intent(Intent.ACTION_WEB_SEARCH);
                                      si.putExtra(SearchManager.QUERY, a1);
                                      si.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                      ctx.startActivity(si);
                                  } catch (Exception e) {
                                      Intent bi = new Intent(Intent.ACTION_VIEW, Uri.parse("https://www.bing.com/search?q=" + Uri.encode(a1)));
                                      bi.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                      ctx.startActivity(bi);
                                  }
                                  return "已搜索：" + a1;
                              }

                              case "copy": {
                                  ClipboardManager cm = (ClipboardManager) ctx.getSystemService(Context.CLIPBOARD_SERVICE);
                                  if (cm != null) {
                                      cm.setPrimaryClip(ClipData.newPlainText("WhaleAI", a1));
                                      return "已复制到剪贴板";
                                  }
                                  return "剪贴板不可用";
                              }

                              case "volume": {
                                  int pct = Math.max(0, Math.min(100, Integer.parseInt(a1.replaceAll("[^0-9]", ""))));
                                  AudioManager am = (AudioManager) ctx.getSystemService(Context.AUDIO_SERVICE);
                                  if (am != null) {
                                      int max = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC);
                                      int target = Math.round(max * pct / 100f);
                                      am.setStreamVolume(AudioManager.STREAM_MUSIC, target, AudioManager.FLAG_SHOW_UI);
                                      return "已将媒体音量调至 " + pct + "%";
                                  }
                                  return "音量调节失败";
                              }

                              case "brightness": {
                                  int pct = Math.max(5, Math.min(100, Integer.parseInt(a1.replaceAll("[^0-9]", ""))));
                                  if (ShizukuHelper.hasPermission()) {
                                      int val = Math.round(pct * 255f / 100f);
                                      ShizukuHelper.execShellText("settings put system screen_brightness_mode 0 && settings put system screen_brightness " + val);
                                      return "已通过 Shizuku 将亮度调至 " + pct + "%";
                                  }
                                  return "调节亮度需要开启 Shizuku 授权";
                              }

                              default:
                                  return "暂不支持指令：" + act;
                          }
                      } catch (Exception e) {
                          return "执行失败：" + e.getMessage();
                      }
                  }

                  private static void sendMediaKey(Context ctx, int keyCode) {
                      AudioManager am = (AudioManager) ctx.getSystemService(Context.AUDIO_SERVICE);
                      if (am != null) {
                          am.dispatchMediaKeyEvent(new KeyEvent(KeyEvent.ACTION_DOWN, keyCode));
                          am.dispatchMediaKeyEvent(new KeyEvent(KeyEvent.ACTION_UP, keyCode));
                      }
                  }

                  private static String openAppByNameOrPkg(Context ctx, String query) {
                      if (query == null || query.isEmpty()) return null;
                      PackageManager pm = ctx.getPackageManager();
                      Intent direct = pm.getLaunchIntentForPackage(query);
                      if (direct != null) {
                          direct.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          ctx.startActivity(direct);
                          return query;
                      }
                      String q = query.toLowerCase();
                      // 常见中文别名映射
                      if (q.contains("b站") || q.contains("哔哩")) q = "bilibili";
                      else if (q.contains("椒盐")) q = "com.salt.music";
                      else if (q.contains("微信")) q = "com.tencent.mm";
                      else if (q.equals("qq")) q = "com.tencent.mobileqq";

                      Intent aliasDirect = pm.getLaunchIntentForPackage(q);
                      if (aliasDirect != null) {
                          aliasDirect.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          ctx.startActivity(aliasDirect);
                          return query;
                      }

                      List<ApplicationInfo> apps = pm.getInstalledApplications(PackageManager.GET_META_DATA);
                      for (ApplicationInfo app : apps) {
                          Intent li = pm.getLaunchIntentForPackage(app.packageName);
                          if (li == null) continue;
                          String label = pm.getApplicationLabel(app).toString();
                          if (label.toLowerCase().contains(q) || app.packageName.toLowerCase().contains(q)) {
                              li.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              ctx.startActivity(li);
                              return label;
                          }
                      }
                      return null;
                  }
              }
              """).lstrip())

          # 7. ScreenCaptureActivity.java (未启用 Shizuku 时的 MediaProjection 单次看屏回退通道)
          with open(os.path.join(java_dir, 'ScreenCaptureActivity.java'), 'w', encoding='utf-8') as f:
              f.write(textwrap.dedent(r"""
              package com.takboo.whalecompanion;

              import android.app.Activity;
              import android.content.Context;
              import android.content.Intent;
              import android.graphics.Bitmap;
              import android.graphics.PixelFormat;
              import android.hardware.display.DisplayManager;
              import android.hardware.display.VirtualDisplay;
              import android.media.Image;
              import android.media.ImageReader;
              import android.media.projection.MediaProjection;
              import android.media.projection.MediaProjectionManager;
              import android.os.Bundle;
              import android.os.Handler;
              import android.os.Looper;
              import android.util.DisplayMetrics;
              import java.nio.ByteBuffer;

              public class ScreenCaptureActivity extends Activity {
                  private static final int REQ_SHOT = 4001;

                  @Override
                  protected void onCreate(Bundle savedInstanceState) {
                      super.onCreate(savedInstanceState);
                      MediaProjectionManager mpm = (MediaProjectionManager) getSystemService(Context.MEDIA_PROJECTION_SERVICE);
                      if (mpm != null) {
                          startActivityForResult(mpm.createScreenCaptureIntent(), REQ_SHOT);
                      } else {
                          notifyFail("系统不支持截屏授权");
                          finish();
                      }
                  }

                  @Override
                  protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                      super.onActivityResult(requestCode, resultCode, data);
                      if (requestCode == REQ_SHOT && resultCode == RESULT_OK && data != null) {
                          captureSingleFrame(data);
                      } else {
                          notifyFail("已取消截屏授权");
                          finish();
                      }
                  }

                  private void captureSingleFrame(Intent projectionData) {
                      try {
                          MediaProjectionManager mpm = (MediaProjectionManager) getSystemService(Context.MEDIA_PROJECTION_SERVICE);
                          final MediaProjection mp = mpm.getMediaProjection(RESULT_OK, projectionData);
                          if (mp == null) {
                              notifyFail("无法创建 MediaProjection");
                              finish();
                              return;
                          }
                          DisplayMetrics dm = getResources().getDisplayMetrics();
                          final int w = dm.widthPixels;
                          final int h = dm.heightPixels;
                          final int dpi = dm.densityDpi;
                          final ImageReader reader = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 2);
                          final VirtualDisplay vd = mp.createVirtualDisplay("WhaleShot", w, h, dpi,
                                  DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, reader.getSurface(), null, null);

                          new Handler(Looper.getMainLooper()).postDelayed(() -> {
                              try {
                                  Image img = reader.acquireLatestImage();
                                  if (img != null) {
                                      Image.Plane[] planes = img.getPlanes();
                                      ByteBuffer buf = planes[0].getBuffer();
                                      int pixelStride = planes[0].getPixelStride();
                                      int rowStride = planes[0].getRowStride();
                                      int rowPadding = rowStride - pixelStride * w;
                                      Bitmap bmp = Bitmap.createBitmap(w + rowPadding / pixelStride, h, Bitmap.Config.ARGB_8888);
                                      bmp.copyPixelsFromBuffer(buf);
                                      img.close();
                                      Bitmap cropped = Bitmap.createBitmap(bmp, 0, 0, w, h);
                                      if (cropped != bmp) bmp.recycle();
                                      String b64 = ShizukuHelper.encodeBitmapToJpegBase64(cropped, 960, 74);
                                      if (FloatingOverlayService.instance != null && b64 != null) {
                                          FloatingOverlayService.instance.deliverScreenShotBase64(b64);
                                      } else {
                                          notifyFail("截屏图像编码失败");
                                      }
                                  } else {
                                      notifyFail("未捕获到屏幕画面");
                                  }
                              } catch (Throwable e) {
                                  notifyFail("截屏出错：" + e.getMessage());
                              } finally {
                                  try { vd.release(); } catch (Throwable ignored) {}
                                  try { reader.close(); } catch (Throwable ignored) {}
                                  try { mp.stop(); } catch (Throwable ignored) {}
                                  finish();
                              }
                          }, 350);
                      } catch (Throwable e) {
                          notifyFail("截屏异常：" + e.getMessage());
                          finish();
                      }
                  }

                  private void notifyFail(String msg) {
                      if (FloatingOverlayService.instance != null) {
                          FloatingOverlayService.instance.deliverScreenShotError(msg);
                      }
                  }
              }
              """).lstrip())

