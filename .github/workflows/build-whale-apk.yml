                          temperature: temp,
                          topP: topP,
                          maxOutputTokens: maxTok
                        };
                        if (!isNaN(thinkBudget) && thinkBudget >= 0 && cleanModel.includes('2.5')) {
                          genConfig.thinkingConfig = { thinkingBudget: thinkBudget };
                        }

                        const res = await fetch(url, {
                          method: 'POST',
                          headers: { 'Content-Type': 'application/json' },
                          signal: signal,
                          body: JSON.stringify({
                            systemInstruction: { parts: [{ text: sysText }] },
                            contents: geminiContents,
                            generationConfig: genConfig
                          })
                        });
                        if (!res.ok) throw new Error('Gemini HTTP ' + res.status);

                        const reader = res.body.getReader();
                        const decoder = new TextDecoder('utf-8');
                        let firstChunk = true;

                        while (true) {
                          const { done, value } = await reader.read();
                          if (done) break;
                          const chunk = decoder.decode(value, { stream: true });
                          const lines = chunk.split('\n').filter(l => l.trim().startsWith('data:'));
                          for (const line of lines) {
                            const payload = line.replace(/^data:\s*/, '').trim();
                            if (!payload || payload === '[DONE]') continue;
                            try {
                              const parsed = JSON.parse(payload);
                              const parts = parsed.candidates?.[0]?.content?.parts || [];
                              const delta = parts.filter(p => !p.thought).map(p => p.text || '').join('');
                              if (delta) {
                                if (firstChunk) {
                                  firstChunk = false;
                                  clearInterval(thinkingTicker);
                                }
                                reply += delta;
                                setBubbleText(reply);
                                if (window.OverlayBridge) {
                                  window.OverlayBridge.setPetMoodAndMouth('happy', 0.9);
                                }
                              }
                            } catch (_) {}
                          }
                        }
                      } else {
                        const oaiMessages = [];
                        topEntries.forEach(e => {
                          oaiMessages.push({ role: e.role || 'system', content: replaceTavernMacros(e.content) });
                        });
                        chatHistory.forEach(m => oaiMessages.push({ role: m.role, content: m.content }));
                        bottomEntries.forEach(e => {
                          oaiMessages.push({ role: e.role || 'system', content: replaceTavernMacros(e.content) });
                        });

                        const bodyObj = {
                          model: config.model || 'deepseek-chat',
                          stream: true,
                          temperature: temp,
                          top_p: topP,
                          max_tokens: maxTok,
                          messages: oaiMessages
                        };

                        const res = await fetch(`${config.baseUrl.replace(/\/$/, '')}/chat/completions`, {
                          method: 'POST',
                          headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${config.apiKey}`
                          },
                          signal: signal,
                          body: JSON.stringify(bodyObj)
                        });
                        if (!res.ok) throw new Error('OpenAI HTTP ' + res.status);

                        const reader = res.body.getReader();
                        const decoder = new TextDecoder('utf-8');
                        let firstChunk = true;

                        while (true) {
                          const { done, value } = await reader.read();
                          if (done) break;
                          const chunk = decoder.decode(value, { stream: true });
                          const lines = chunk.split('\n').filter(l => l.trim().startsWith('data:'));
                          for (const line of lines) {
                            const payload = line.replace(/^data:\s*/, '').trim();
                            if (payload === '[DONE]') break;
                            try {
                              const parsed = JSON.parse(payload);
                              const delta = parsed.choices?.[0]?.delta?.content || '';
                              if (delta) {
                                if (firstChunk) {
                                  firstChunk = false;
                                  clearInterval(thinkingTicker);
                                }
                                reply += delta;
                                setBubbleText(reply);
                                if (window.OverlayBridge) {
                                  window.OverlayBridge.setPetMoodAndMouth('happy', 0.9);
                                }
                              }
                            } catch (_) {}
                          }
                        }
                      }

                      clearInterval(thinkingTicker);
                      if (!reply.trim()) {
                        reply = '（歪了歪头，没有发出声音～）';
                        setBubbleText(reply);
                      }
                      lastReplyText = reply;
                      chatHistory.push({ role: 'assistant', content: reply });
                    } catch (err) {
                      clearInterval(thinkingTicker);
                      if (err && err.name === 'AbortError') {
                        // 用户主动点击了 ✕ 停止生成，不报错
                        return;
                      }
                      setBubbleText('请求出错 (' + err.message + ')，请检查接口设置～');
                    } finally {
                      clearInterval(thinkingTicker);
                      isBusy = false;
                      currentAbortController = null;
                      updateCloseBtnState(false);
                      if (window.OverlayBridge) {
                        window.OverlayBridge.setPetMoodAndMouth('happy', 0);
                      }
                      scheduleAutoCollapse(28000);
                    }
                  }

                  window.triggerHalfHourContextChat = function(forceWake) {
                    if (!isScreenOn && !forceWake) return;
                    reloadPanelConfig();
                    if (!hasValidKey()) {
                      if (forceWake && window.OverlayBridge) {
                        window.OverlayBridge.expandPanel('greet', false);
                        setBubbleText('主人，先在主程序里填好 API Key，我就能每半小时根据手机状态主动找你聊天啦！');
                        scheduleAutoCollapse(15000);
                      }
                      return;
                    }
                    const prompt = replaceTavernMacros(
                      '[定时主动关怀触发] 此刻状态：时间={{time}}，电量={{battery}}，天气={{weather}}，闹钟={{alarm}}，通知={{notifications}}，正在听的歌={{song}}。请挑一两个最值得注意的点，主动跟{{user}}搭一句话。'
                    );
                    askWhaleWithTavernPreset(prompt);
                  };

                  setInterval(() => {
                    if (isScreenOn && !isBusy) {
                      window.triggerHalfHourContextChat(false);
                    }
                  }, 30 * 60 * 1000);

                  window.onScreenStateChanged = function(on) {
                    isScreenOn = Boolean(on);
                  };

                  window.onNativeInstantEvent = function(type, defaultLine) {
                    if (!isScreenOn) return;
                    setBubbleText(defaultLine);
                    scheduleAutoCollapse(20000);
                    if (hasValidKey() && !isBusy) {
                      askWhaleWithTavernPreset(`[手机刚刚发生即时事件：${type}（${defaultLine}）] 请立即跟{{user}}说一句简短贴心的提醒或互动。`);
                    }
                  };

                  let lastReactedSong = '';
                  window.onNativeSongChanged = function(songInfo) {
                    if (!isScreenOn || !songInfo || songInfo === lastReactedSong || isBusy) return;
                    lastReactedSong = songInfo;
                    if (hasValidKey()) {
                      askWhaleWithTavernPreset(`[播放器切歌通知] 我刚刚开始播放歌曲《${songInfo}》，请作为陪我听歌的{{char}}简短点评或哼两句互动！`);
                    } else if (window.OverlayBridge) {
                      window.OverlayBridge.expandPanel('greet', false);
                      setBubbleText(`🎵 正在陪你听：《${songInfo}》`);
                      scheduleAutoCollapse(12000);
                    }
                  };

                  reloadPanelConfig();
                </script>
              </body>
              </html>
              """).lstrip())

