                      if (window.OverlayBridge) window.OverlayBridge.resizePanelHeight(285, 270, false);
                    } else {
                      if (window.OverlayBridge) window.OverlayBridge.resizePanelHeight(260, 145, false);
                      scheduleAutoCollapse(22000);
                    }
                  }

                  function renderHistoryList() {
                    const box = document.getElementById('history-list');
                    if (!chatHistory.length) {
                      box.innerHTML = '<div style="color:#94a3b8;text-align:center;padding:16px 0;">暂无对话记录</div>';
                      return;
                    }
                    box.innerHTML = chatHistory.map(m => {
                      const isU = m.role === 'user';
                      const who = isU ? (config.userName || '你') : (config.charName || '助手');
                      const esc = (m.content || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                      return `<div class="hist-item ${isU ? 'hist-user' : 'hist-ai'}"><div class="hist-meta">${who} ${m.ts || ''}</div><div>${esc}</div></div>`;
                    }).join('');
                    box.parentElement.scrollTop = box.parentElement.scrollHeight;
                  }

                  function clearSavedHistory() {
                    chatHistory = [];
                    persistHistory();
                    renderHistoryList();
                  }

                  window.onPetWakeUp = function() {
                    if (isBusy) return;
                    if (isHistoryOpen) toggleHistoryView(false);
                    const line = WAKE_GREETINGS[Math.floor(Math.random() * WAKE_GREETINGS.length)];
                    setBubbleText(line);
                    closeInputBar(false);
                    scheduleAutoCollapse(22000);
                  };

                  function openInputBar() {
                    clearTimeout(autoCollapseTimer);
                    if (isHistoryOpen) toggleHistoryView(false);
                    document.getElementById('action-row').style.display = 'none';
                    document.getElementById('input-row').style.display = 'flex';
                    if (lastReplyText) setBubbleText(lastReplyText);
                    if (window.OverlayBridge) window.OverlayBridge.resizePanelHeight(275, 175, true);
                    setTimeout(() => document.getElementById('chat-inp').focus(), 180);
                  }

                  function closeInputBar(recalcWindow = true) {
                    document.getElementById('input-row').style.display = 'none';
                    document.getElementById('action-row').style.display = 'flex';
                    if (recalcWindow && window.OverlayBridge) {
                      window.OverlayBridge.resizePanelHeight(260, 145, false);
                    }
                    scheduleAutoCollapse(25000);
                  }

                  function closePanelNow() {
                    if (currentAbortController) {
                      try { currentAbortController.abort(); } catch (_) {}
                      currentAbortController = null;
                    }
                    isBusy = false;
                    isHistoryOpen = false;
                    document.getElementById('history-box').style.display = 'none';
                    document.getElementById('bubble-box').style.display = 'block';
                    updateCloseBtnState(false);
                    clearInterval(thinkingTicker);
                    clearTimeout(autoCollapseTimer);
                    if (window.OverlayBridge) window.OverlayBridge.collapseToPeek();
                  }

                  function startVoice() {
                    clearTimeout(autoCollapseTimer);
                    if (isHistoryOpen) toggleHistoryView(false);
                    isBusy = true;
                    updateCloseBtnState(true);
                    setBubbleText('🎤 正在倾听，请说话...');
                    if (window.OverlayBridge) {
                      window.OverlayBridge.setPetMoodAndMouth('listening', 0);
                      window.OverlayBridge.startVoiceRecognition();
                    }
                  }

                  function triggerScreenVision(customPrompt) {
                    reloadPanelConfig();
                    if (!hasValidKey()) {
                      setBubbleText('请先打开主程序填好 API Key 哦！');
                      return;
                    }
                    clearTimeout(autoCollapseTimer);
                    if (isHistoryOpen) toggleHistoryView(false);
                    const inp = document.getElementById('chat-inp');
                    if (inp) inp.value = '';
                    closeInputBar(false);
                    pendingVisionPrompt = customPrompt || '看看我现在手机屏幕上是什么内容，用你的人设简短聊两句或帮我分析一下。';
                    isBusy = true;
                    updateCloseBtnState(true);
                    setBubbleText('👁️ 正在获取当前屏幕画面...');
                    if (window.OverlayBridge) {
                      window.OverlayBridge.requestScreenCapture();
                    }
                  }

                  window.onScreenShotCaptured = function(b64Jpeg) {
                    const q = pendingVisionPrompt || '看看我现在的屏幕，简短聊两句。';
                    pendingVisionPrompt = '';
                    askWhaleWithTavernPreset(q, b64Jpeg);
                  };

                  window.onScreenShotError = function(msg) {
                    isBusy = false;
                    updateCloseBtnState(false);
                    setBubbleText('👁️ 看屏失败：' + (msg || '未获取画面'));
                    scheduleAutoCollapse(15000);
                  };

                  window.onVoiceResult = function(text) {
                    if (text && text.trim()) {
                      askWhaleWithTavernPreset(text.trim(), null);
                    } else {
                      isBusy = false;
                      updateCloseBtnState(false);
                      setBubbleText('没听清呢，点「🎤」再试一次吧～');
                      scheduleAutoCollapse(15000);
                    }
                  };

                  window.onVoiceError = function() {
                    isBusy = false;
                    updateCloseBtnState(false);
                    setBubbleText('没听清呢，点「🎤」再试一次或点「💬 对话」打字吧～');
                    scheduleAutoCollapse(15000);
                  };

                  function sendText() {
                    const inp = document.getElementById('chat-inp');
                    const txt = inp.value.trim();
                    if (!txt) return;
                    inp.value = '';
                    closeInputBar(true);
                    askWhaleWithTavernPreset(txt, null);
                  }

                  function replaceTavernMacros(str) {
                    let dev = {};
                    if (window.OverlayBridge) {
                      try { dev = JSON.parse(window.OverlayBridge.getDeviceContextJson() || '{}'); } catch (_) {}
                    }
                    const batStr = `${dev.batteryPct ?? '?'}% (${dev.isCharging ? '充电中' : '未充电'}, ${dev.batteryTempC ?? '?'}°C)`;
                    const notifStr = `未接来电${dev.missedCalls || 0}, 未读短信${dev.unreadSms || 0}, 社交未读${dev.unreadSocial || 0}`;
                    const mems = getLongTermMemories();
                    const memStr = mems.length ? mems.join('；') : '暂无特殊长期记忆';
                    return (str || '')
                      .replace(/\{\{char\}\}/g, config.charName || '大肥鱼')
                      .replace(/\{\{user\}\}/g, config.userName || '主人')
                      .replace(/\{\{time\}\}/g, dev.timeStr || new Date().toLocaleTimeString())
                      .replace(/\{\{battery\}\}/g, batStr)
                      .replace(/\{\{weather\}\}/g, cachedWeather)
                      .replace(/\{\{alarm\}\}/g, dev.nextAlarm || '未设置')
                      .replace(/\{\{notifications\}\}/g, notifStr)
                      .replace(/\{\{song\}\}/g, dev.currentSong || '暂无播放')
                      .replace(/\{\{memory\}\}/g, memStr);
                  }

                  function hasValidKey() {
                    return config.apiProvider === 'gemini'
                      ? Boolean(config.geminiApiKey && config.geminiApiKey.trim())
                      : Boolean(config.apiKey && config.apiKey.trim());
                  }

                  function parseAndRunActions(rawReply) {
                    const tagRegex = /\[\[ACTION:([^\]|]+)(?:\|([^\]|]*))?(?:\|([^\]]*))?\]\]/gi;
                    let match;
                    const logs = [];
                    while ((match = tagRegex.exec(rawReply)) !== null) {
                      const act = (match[1] || '').trim().toLowerCase();
                      const a1 = (match[2] || '').trim();
                      const a2 = (match[3] || '').trim();
                      if (act === 'save_memory' && a1) {
                        appendLongTermMemory(a1);
                        logs.push('已记住：' + a1);
                      } else if (window.OverlayBridge && config.enableActions !== false) {
                        const res = window.OverlayBridge.executeAssistantAction(act, a1, a2);
                        if (res) logs.push(res);
                      }
                    }
                    if (logs.length) showActionToast(logs.join(' | '));
                    return rawReply.replace(tagRegex, '').trim();
                  }

                  async function askWhaleWithTavernPreset(userMessage, imageBase64) {
                    reloadPanelConfig();
                    if (!hasValidKey()) {
                      isBusy = false;
                      updateCloseBtnState(false);
                      setBubbleText('请先打开「大肥鱼全局伴侣」主程序填好 API Key 哦！');
                      scheduleAutoCollapse(15000);
                      return;
                    }

                    if (currentAbortController) {
                      try { currentAbortController.abort(); } catch (_) {}
                    }
                    currentAbortController = new AbortController();
                    const signal = currentAbortController.signal;

                    isBusy = true;
                    updateCloseBtnState(true);
                    clearTimeout(autoCollapseTimer);
                    clearInterval(thinkingTicker);
                    if (window.OverlayBridge) {
                      window.OverlayBridge.expandPanel('greet', false);
                      window.OverlayBridge.setPetMoodAndMouth('thinking', 0);
                    }

                    const startMs = Date.now();
                    const prefix = imageBase64 ? '👁️ 看屏分析中' : '💭 思考中';
                    setBubbleText(`${prefix} (0.0s)... [点 ✕ 停止]`);
                    thinkingTicker = setInterval(() => {
                      const sec = ((Date.now() - startMs) / 1000).toFixed(1);
                      setBubbleText(`${prefix} (${sec}s)... [点 ✕ 停止]`);
                    }, 200);

                    const preset = config.tavernPreset || DEFAULT_TAVERN_PRESET;
                    const entries = (preset.entries || []).filter(e => e.enabled);
                    const topEntries = entries.filter(e => e.position !== 'bottom');
                    const bottomEntries = entries.filter(e => e.position === 'bottom');

                    const nowTs = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    const displayUserMsg = imageBase64 ? `[👁️看屏] ${userMessage}` : userMessage;
                    chatHistory.push({ role: 'user', content: displayUserMsg, ts: nowTs });
                    persistHistory();

                    const depthLimit = Math.max(2, (parseInt(preset.contextDepth, 10) || 6) * 2);
                    const recentSlice = chatHistory.slice(-depthLimit);

                    const mems = getLongTermMemories();
                    const rawTopStr = topEntries.map(e => replaceTavernMacros(e.content)).join('\n\n');
                    let fullSysText = rawTopStr;
                    if (mems.length && !topEntries.some(e => (e.content || '').includes('{{memory}}'))) {
                      fullSysText += `\n\n【长期记忆】${mems.join('；')}`;
                    }
                    if (config.enableActions !== false) {
                      fullSysText += `\n\n${ACTION_SYSTEM_GUIDE}`;
                    }
                    const postText = bottomEntries.map(e => replaceTavernMacros(e.content)).join('\n');

                    try {
                      let reply = '';
                      const temp = parseFloat(preset.temperature) || 0.85;
                      const topP = parseFloat(preset.topP) || 0.95;
                      const maxTok = parseInt(preset.maxTokens, 10) || 160;
                      const thinkBudget = parseInt(preset.thinkingBudget, 10);

                      if (config.apiProvider === 'gemini') {
                        const base = (config.geminiBaseUrl || 'https://generativelanguage.googleapis.com/v1beta').replace(/\/$/, '');
                        const cleanModel = (config.geminiModel || 'gemini-2.5-flash').replace(/^models\//, '');
                        const url = `${base}/models/${cleanModel}:streamGenerateContent?alt=sse&key=${encodeURIComponent(config.geminiApiKey)}`;

                        const geminiContents = recentSlice.map((m, idx) => {
                          let txt = m.content;
                          const isLast = idx === recentSlice.length - 1;
                          if (isLast && postText) txt = `${txt}\n\n${postText}`;
                          const parts = [{ text: txt }];
                          if (isLast && imageBase64) {
                            parts.push({ inlineData: { mimeType: 'image/jpeg', data: imageBase64 } });
                          }
                          return { role: m.role === 'assistant' ? 'model' : 'user', parts };
                        });

                        const genConfig = { temperature: temp, topP: topP, maxOutputTokens: maxTok };
                        if (!isNaN(thinkBudget) && thinkBudget >= 0 && cleanModel.includes('2.5')) {
                          genConfig.thinkingConfig = { thinkingBudget: thinkBudget };
                        }

                        const res = await fetch(url, {
                          method: 'POST',
                          headers: { 'Content-Type': 'application/json' },
                          signal: signal,
                          body: JSON.stringify({
                            systemInstruction: { parts: [{ text: fullSysText }] },
                            contents: geminiContents,
                            generationConfig: genConfig
                          })
                        });
                        if (!res.ok) throw new Error('Gemini HTTP ' + res.status);

                        const reader = res.body.getReader();
                        const decoder = new TextDecoder('utf-8');
                        let firstChunk = true;

                        while (true) {
                          const { done, value } = await reader.read();
                          if (done) break;
                          const chunk = decoder.decode(value, { stream: true });
                          const lines = chunk.split('\n').filter(l => l.trim().startsWith('data:'));
                          for (const line of lines) {
                            const payload = line.replace(/^data:\s*/, '').trim();
                            if (!payload || payload === '[DONE]') continue;
                            try {
                              const parsed = JSON.parse(payload);
                              const parts = parsed.candidates?.[0]?.content?.parts || [];
                              const delta = parts.filter(p => !p.thought).map(p => p.text || '').join('');
                              if (delta) {
                                if (firstChunk) { firstChunk = false; clearInterval(thinkingTicker); }
                                reply += delta;
                                setBubbleText(reply.replace(/\[\[ACTION:[^\]]*\]?\]?/gi, '').trim() || '...');
                                if (window.OverlayBridge) window.OverlayBridge.setPetMoodAndMouth('happy', 0.9);
                              }
                            } catch (_) {}
                          }
                        }
                      } else {
                        const oaiMessages = [{ role: 'system', content: fullSysText }];
                        recentSlice.forEach((m, idx) => {
                          const isLast = idx === recentSlice.length - 1;
                          if (isLast && imageBase64) {
                            oaiMessages.push({
                              role: 'user',
                              content: [
                                { type: 'text', text: m.content },
                                { type: 'image_url', image_url: { url: 'data:image/jpeg;base64,' + imageBase64 } }
                              ]
                            });
                          } else {
                            oaiMessages.push({ role: m.role, content: m.content });
                          }
                        });
                        if (postText) oaiMessages.push({ role: 'system', content: postText });

                        const res = await fetch(`${config.baseUrl.replace(/\/$/, '')}/chat/completions`, {
                          method: 'POST',
                          headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${config.apiKey}`
                          },
                          signal: signal,
                          body: JSON.stringify({
                            model: config.model || 'deepseek-chat',
                            stream: true,
                            temperature: temp,
                            top_p: topP,
                            max_tokens: maxTok,
                            messages: oaiMessages
                          })
                        });
                        if (!res.ok) throw new Error('OpenAI HTTP ' + res.status);

                        const reader = res.body.getReader();
                        const decoder = new TextDecoder('utf-8');
                        let firstChunk = true;

                        while (true) {
                          const { done, value } = await reader.read();
                          if (done) break;
                          const chunk = decoder.decode(value, { stream: true });
                          const lines = chunk.split('\n').filter(l => l.trim().startsWith('data:'));
                          for (const line of lines) {
                            const payload = line.replace(/^data:\s*/, '').trim();
                            if (payload === '[DONE]') break;
                            try {
                              const parsed = JSON.parse(payload);
                              const delta = parsed.choices?.[0]?.delta?.content || '';
                              if (delta) {
                                if (firstChunk) { firstChunk = false; clearInterval(thinkingTicker); }
                                reply += delta;
                                setBubbleText(reply.replace(/\[\[ACTION:[^\]]*\]?\]?/gi, '').trim() || '...');
                                if (window.OverlayBridge) window.OverlayBridge.setPetMoodAndMouth('happy', 0.9);
                              }
                            } catch (_) {}
                          }
                        }
                      }

                      clearInterval(thinkingTicker);
                      const cleanReply = parseAndRunActions(reply);
                      const finalTxt = cleanReply || '（完成了操作，微笑着点点头～）';
                      setBubbleText(finalTxt);
                      lastReplyText = finalTxt;
                      chatHistory.push({ role: 'assistant', content: finalTxt, ts: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
                      persistHistory();
                    } catch (err) {
                      clearInterval(thinkingTicker);
                      if (err && err.name === 'AbortError') return;
                      setBubbleText('请求出错 (' + err.message + ')，请检查接口设置～');
                    } finally {
                      clearInterval(thinkingTicker);
                      isBusy = false;
                      currentAbortController = null;
                      updateCloseBtnState(false);
                      if (window.OverlayBridge) window.OverlayBridge.setPetMoodAndMouth('happy', 0);
                      scheduleAutoCollapse(28000);
                    }
                  }

                  window.triggerHalfHourContextChat = function(forceWake) {
                    if (!isScreenOn && !forceWake) return;
                    reloadPanelConfig();
                    if (!hasValidKey()) {
                      if (forceWake && window.OverlayBridge) {
                        window.OverlayBridge.expandPanel('greet', false);
                        setBubbleText('主人，先在主程序里填好 API Key，我就能每半小时根据手机状态主动找你聊天啦！');
                        scheduleAutoCollapse(15000);
                      }
                      return;
                    }
                    const prompt = replaceTavernMacros(
                      '[定时主动关怀触发] 此刻状态：时间={{time}}，电量={{battery}}，天气={{weather}}，闹钟={{alarm}}，通知={{notifications}}，正在听的歌={{song}}。请挑一两个最值得注意的点，主动跟{{user}}搭一句话。'
                    );
                    askWhaleWithTavernPreset(prompt, null);
                  };

                  setInterval(() => {
                    if (isScreenOn && !isBusy) window.triggerHalfHourContextChat(false);
                  }, 30 * 60 * 1000);

                  window.onScreenStateChanged = function(on) { isScreenOn = Boolean(on); };

                  window.onNativeInstantEvent = function(type, defaultLine) {
                    if (!isScreenOn) return;
                    setBubbleText(defaultLine);
                    scheduleAutoCollapse(20000);
                    if (hasValidKey() && !isBusy) {
                      askWhaleWithTavernPreset(`[手机刚刚发生即时事件：${type}（${defaultLine}）] 请立即跟{{user}}说一句简短贴心的提醒或互动。`, null);
                    }
                  };

                  let lastReactedSong = '';
                  window.onNativeSongChanged = function(songInfo) {
                    if (!isScreenOn || !songInfo || songInfo === lastReactedSong || isBusy) return;
                    lastReactedSong = songInfo;
                    if (hasValidKey()) {
                      askWhaleWithTavernPreset(`[播放器切歌通知] 我刚刚开始播放歌曲《${songInfo}》，请作为陪我听歌的{{char}}简短点评或互动一句！`, null);
                    } else if (window.OverlayBridge) {
                      window.OverlayBridge.expandPanel('greet', false);
                      setBubbleText(`🎵 正在陪你听：《${songInfo}》`);
                      scheduleAutoCollapse(12000);
                    }
                  };

                  loadSavedHistory();
                  reloadPanelConfig();
                </script>
              </body>
              </html>
              """).lstrip())

          # 13. 生成主程序控制台 control-panel.html（新增：白名单自由编辑、Shizuku 授权面板、长期记忆本、SAF 原生 .json 文件导出/导入）
          with open(os.path.join(www_dir, 'control-panel.html'), 'w', encoding='utf-8') as f:
              f.write(textwrap.dedent(r"""
              <!DOCTYPE html>
              <html lang="zh-CN">
              <head>
                <meta charset="UTF-8" />
