                  public static WebResourceResponse interceptCustomSpriteRequest(Context ctx, WebResourceRequest request, WebViewAssetLoader assetLoader) {
                      String path = request.getUrl().getPath();
                      if (path != null && path.startsWith("/custom_sprites/")) {
                          String fileName = path.replace("/custom_sprites/", "");
                          File f = new File(ctx.getFilesDir(), fileName);
                          if (f.exists()) {
                              try {
                                  SharedPreferences sp = ctx.getSharedPreferences("whale_native_prefs", MODE_PRIVATE);
                                  String mime = sp.getString("mime_" + fileName, "image/png");
                                  return new WebResourceResponse(mime, "UTF-8", new FileInputStream(f));
                              } catch (Exception ignored) {}
                          }
                      }
                      return assetLoader.shouldInterceptRequest(request.getUrl());
                  }

