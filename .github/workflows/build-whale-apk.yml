              import android.webkit.WebViewClient;
              import androidx.core.app.NotificationCompat;
              import androidx.webkit.WebViewAssetLoader;
              import java.io.File;
              import java.io.FileInputStream;
              import java.util.ArrayList;
              import java.util.Locale;

              public class FloatingOverlayService extends Service {
                  public static FloatingOverlayService instance;
                  private static final String CHANNEL_ID = "WhaleFloatingOverlayV7";

                  private WindowManager windowManager;
                  private WebView petWebView;
                  private WindowManager.LayoutParams petParams;
                  private WebView panelWebView;
                  private WindowManager.LayoutParams panelParams;

                  private SpeechRecognizer speechRecognizer;
                  private float density = 3.0f;
                  private int screenWidth = 1080;
                  private int screenHeight = 2400;

                  private int petSizeDp = 58;
                  private boolean isPeekMode = true;
                  private String dockEdge = "right";
                  private int anchorX = 900;
                  private int anchorY = 600;

                  // 充电到 80% 与用电到 40% 阈值提醒状态锁（避免同一周期重复刷屏）
                  private boolean remindedCharge80 = false;
                  private boolean remindedDrain40 = false;
                  private boolean remindedDrain20 = false;
                  private int lastObservedBatteryPct = -1;

                  private final BroadcastReceiver systemEventReceiver = new BroadcastReceiver() {
                      @Override
                      public void onReceive(Context context, Intent intent) {
                          if (intent == null || intent.getAction() == null) return;
                          String act = intent.getAction();
                          if (Intent.ACTION_SCREEN_OFF.equals(act)) {
                              evalPanelJs("window.onScreenStateChanged && window.onScreenStateChanged(false);");
                          } else if (Intent.ACTION_SCREEN_ON.equals(act)) {
                              evalPanelJs("window.onScreenStateChanged && window.onScreenStateChanged(true);");
                          } else if (Intent.ACTION_POWER_CONNECTED.equals(act)) {
                              remindedDrain40 = false;
                              remindedDrain20 = false;
                              notifyInstantEvent("power_connected", "哇！充上电啦⚡ 能量满格涌进来咯～");
                          } else if (Intent.ACTION_POWER_DISCONNECTED.equals(act)) {
                              remindedCharge80 = false;
                              notifyInstantEvent("power_disconnected", "拔掉充电线啦，今天也要元气满满哦！");
                          } else if (Intent.ACTION_BATTERY_CHANGED.equals(act)) {
                              int level = intent.getIntExtra(BatteryManager.EXTRA_LEVEL, -1);
                              int scale = intent.getIntExtra(BatteryManager.EXTRA_SCALE, -1);
                              int status = intent.getIntExtra(BatteryManager.EXTRA_STATUS, -1);
                              if (level < 0 || scale <= 0) return;
                              int pct = Math.round((level * 100f) / scale);
                              boolean isCharging = status == BatteryManager.BATTERY_STATUS_CHARGING || status == BatteryManager.BATTERY_STATUS_FULL;

                              if (isCharging) {
                                  remindedDrain40 = false;
                                  remindedDrain20 = false;
                                  if (pct < 78) {
                                      remindedCharge80 = false;
                                  }
                                  // 充电到达 80% 提醒（从低于80充到80，或插上充电器正好80%且尚未提醒）
                                  if (pct >= 80 && !remindedCharge80 && (lastObservedBatteryPct < 80 || lastObservedBatteryPct == -1)) {
                                      remindedCharge80 = true;
                                      notifyInstantEvent("battery_charged_80", "主人！电量已经充到 " + pct + "% 啦🔋 达到 80% 黄金养护线咯～");
                                  }
                              } else {
                                  remindedCharge80 = false;
                                  if (pct > 42) {
                                      remindedDrain40 = false;
                                  }
                                  if (pct > 22) {
                                      remindedDrain20 = false;
                                  }
                                  // 用电降到 40% 提醒
                                  if (pct <= 40 && pct > 20 && !remindedDrain40 && (lastObservedBatteryPct > 40 || lastObservedBatteryPct == -1)) {
                                      remindedDrain40 = true;
                                      notifyInstantEvent("battery_drain_40", "提醒主人～电量已经用到 " + pct + "% 啦⚡ 要留意剩余电量哦！");
                                  } else if (pct <= 20 && !remindedDrain20 && (lastObservedBatteryPct > 20 || lastObservedBatteryPct == -1)) {
                                      remindedDrain20 = true;
                                      notifyInstantEvent("battery_low_20", "主人主人，电量只剩 " + pct + "% 啦🪫 快找充电器喂饱手机吧！");
                                  }
                              }
                              lastObservedBatteryPct = pct;
                          }
                      }
                  };

                  @Override
                  public void onCreate() {
                      super.onCreate();
                      instance = this;
                      createNotificationChannel();

                      Intent openAppIntent = new Intent(this, MainActivity.class);
                      PendingIntent pi = PendingIntent.getActivity(this, 0, openAppIntent,
                              PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                      Notification notification = new NotificationCompat.Builder(this, CHANNEL_ID)
                              .setContentTitle("大肥鱼桌面悬浮球运行中")
                              .setContentText("点击进入预设、贴图与尺寸控制台")
                              .setSmallIcon(android.R.drawable.sym_def_app_icon)
                              .setContentIntent(pi)
                              .setPriority(NotificationCompat.PRIORITY_MIN)
                              .build();
                      startForeground(1001, notification);

                      SharedPreferences sp = getSharedPreferences("whale_native_prefs", MODE_PRIVATE);
                      petSizeDp = sp.getInt("petSizeDp", 58);
                      dockEdge = sp.getString("dockEdge", "right");

                      IntentFilter filter = new IntentFilter();
                      filter.addAction(Intent.ACTION_SCREEN_OFF);
                      filter.addAction(Intent.ACTION_SCREEN_ON);
                      filter.addAction(Intent.ACTION_POWER_CONNECTED);
                      filter.addAction(Intent.ACTION_POWER_DISCONNECTED);
                      filter.addAction(Intent.ACTION_BATTERY_CHANGED);
                      registerReceiver(systemEventReceiver, filter);

                      initDualOverlayWindows();
                  }

                  private int dp(int d) {
                      return Math.round(d * density);
                  }

                  // 支持从内部存储直接读取用户上传的自定义角色贴图 (custom_sprite_idle / custom_sprite_talk)
                  public static WebResourceResponse interceptCustomSpriteRequest(Context ctx, WebResourceRequest request, WebViewAssetLoader assetLoader) {
                      String path = request.getUrl().getPath();
                      if (path != null && path.startsWith("/custom_sprites/")) {
                          String fileName = path.replace("/custom_sprites/", "");
                          File f = new File(ctx.getFilesDir(), fileName);
                          if (f.exists()) {
                              try {
                                  SharedPreferences sp = ctx.getSharedPreferences("whale_native_prefs", MODE_PRIVATE);
                                  String mime = sp.getString("mime_" + fileName, "image/png");
                                  return new WebResourceResponse(mime, "UTF-8", new FileInputStream(f));
                              } catch (Exception ignored) {}
                          }
                      }
                      return assetLoader.shouldInterceptRequest(request.getUrl());
                  }

                  @SuppressLint("ClickableViewAccessibility")
                  private void initDualOverlayWindows() {
                      if (!Settings.canDrawOverlays(this)) return;
                      windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);
                      DisplayMetrics dm = getResources().getDisplayMetrics();
                      density = dm.density;
                      screenWidth = dm.widthPixels;
                      screenHeight = dm.heightPixels;

                      SharedPreferences sp = getSharedPreferences("whale_native_prefs", MODE_PRIVATE);
                      anchorX = sp.getInt("anchorX", screenWidth - dp(petSizeDp));
                      anchorY = sp.getInt("anchorY", Math.round(screenHeight * 0.35f));

                      final WebViewAssetLoader assetLoader = new WebViewAssetLoader.Builder()
                              .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                              .build();

                      petParams = new WindowManager.LayoutParams(
                              dp(petSizeDp),
                              dp(petSizeDp),
                              WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                      | WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL
                                      | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                              PixelFormat.TRANSLUCENT
                      );
                      petParams.gravity = Gravity.TOP | Gravity.START;

                      petWebView = new WebView(this);
                      petWebView.setBackgroundColor(Color.TRANSPARENT);
                      petWebView.setVerticalScrollBarEnabled(false);
                      petWebView.setHorizontalScrollBarEnabled(false);
                      WebSettings ps = petWebView.getSettings();
                      ps.setJavaScriptEnabled(true);
                      ps.setDomStorageEnabled(true);
                      ps.setCacheMode(WebSettings.LOAD_NO_CACHE);
                      petWebView.setWebViewClient(new WebViewClient() {
                          @Override
                          public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                              return interceptCustomSpriteRequest(FloatingOverlayService.this, request, assetLoader);
                          }
                      });
                      petWebView.addJavascriptInterface(new SharedOverlayBridge(), "OverlayBridge");

                      petWebView.setOnTouchListener(new View.OnTouchListener() {
                          private float downRawX, downRawY;
                          private int startWinX, startWinY;
                          private boolean isDragging = false;

                          @Override
                          public boolean onTouch(View v, MotionEvent event) {
                              switch (event.getActionMasked()) {
                                  case MotionEvent.ACTION_DOWN:
                                      downRawX = event.getRawX();
                                      downRawY = event.getRawY();
                                      startWinX = petParams.x;
                                      startWinY = petParams.y;
                                      isDragging = false;
                                      return true;

                                  case MotionEvent.ACTION_MOVE:
                                      float dx = event.getRawX() - downRawX;
                                      float dy = event.getRawY() - downRawY;
                                      if (!isDragging && Math.hypot(dx, dy) > dp(6)) {
                                          isDragging = true;
                                      }
                                      if (isDragging) {
                                          petParams.x = Math.max(0, Math.min(screenWidth - petParams.width, startWinX + Math.round(dx)));
                                          petParams.y = Math.max(dp(24), Math.min(screenHeight - petParams.height - dp(24), startWinY + Math.round(dy)));
                                          windowManager.updateViewLayout(petWebView, petParams);
                                          if (panelWebView != null && panelWebView.getVisibility() == View.VISIBLE) {
                                              repositionPanelBesidePet();
                                          }
                                      }
                                      return true;

                                  case MotionEvent.ACTION_UP:
                                  case MotionEvent.ACTION_CANCEL:
                                      if (!isDragging) {
                                          onPetClickedNatively();
                                      } else {
                                          snapPetToNearestEdge();
                                      }
                                      return true;
                              }
                              return false;
                          }
                      });

                      panelParams = new WindowManager.LayoutParams(
                              dp(235),
                              dp(130),
                              WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                      | WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                              PixelFormat.TRANSLUCENT
                      );
                      panelParams.gravity = Gravity.TOP | Gravity.START;

                      panelWebView = new WebView(this);
                      panelWebView.setBackgroundColor(Color.TRANSPARENT);
                      panelWebView.setVerticalScrollBarEnabled(false);
                      panelWebView.setHorizontalScrollBarEnabled(false);
                      panelWebView.setVisibility(View.GONE);
                      WebSettings pls = panelWebView.getSettings();
                      pls.setJavaScriptEnabled(true);
                      pls.setDomStorageEnabled(true);
                      panelWebView.setWebViewClient(new WebViewClient() {
                          @Override
                          public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                              return interceptCustomSpriteRequest(FloatingOverlayService.this, request, assetLoader);
                          }
                      });
                      panelWebView.addJavascriptInterface(new SharedOverlayBridge(), "OverlayBridge");

                      windowManager.addView(petWebView, petParams);
                      windowManager.addView(panelWebView, panelParams);

                      applyPetGeometry();
                      petWebView.loadUrl("https://appassets.androidplatform.net/assets/www/pet-sprite.html");
                      panelWebView.loadUrl("https://appassets.androidplatform.net/assets/www/pet-panel.html");
                  }

                  private void onPetClickedNatively() {
                      if (isPeekMode) {
                          isPeekMode = false;
                          applyPetGeometry();
                          evalPetJs("window.setPetPose && window.setPetPose('active', '" + dockEdge + "');");
                          showPanelWindow("greet", false);
                          evalPanelJs("window.onPetWakeUp && window.onPetWakeUp();");
                      } else {
                          evalPetJs("window.triggerPetBounce && window.triggerPetBounce();");
                          if (panelWebView.getVisibility() != View.VISIBLE) {
                              showPanelWindow("greet", false);
                          }
                          evalPanelJs("window.onPetWakeUp && window.onPetWakeUp();");
                      }
                  }

                  private void snapPetToNearestEdge() {
                      DisplayMetrics dm = getResources().getDisplayMetrics();
                      screenWidth = dm.widthPixels;
                      screenHeight = dm.heightPixels;

                      int centerX = petParams.x + petParams.width / 2;
                      int centerY = petParams.y + petParams.height / 2;

                      int distLeft = centerX;
                      int distRight = screenWidth - centerX;
                      int distBottom = screenHeight - centerY;

                      if (distBottom < dp(95) && distBottom <= distLeft && distBottom <= distRight) {
                          dockEdge = "bottom";
                          anchorX = Math.max(dp(16), Math.min(screenWidth - dp(petSizeDp) - dp(16), petParams.x));
                          anchorY = screenHeight - dp(petSizeDp);
                      } else if (distLeft <= distRight) {
                          dockEdge = "left";
                          anchorX = 0;
                          anchorY = Math.max(dp(48), Math.min(screenHeight - dp(petSizeDp) - dp(48), petParams.y));
                      } else {
                          dockEdge = "right";
                          anchorX = screenWidth - dp(petSizeDp);
                          anchorY = Math.max(dp(48), Math.min(screenHeight - dp(petSizeDp) - dp(48), petParams.y));
                      }

                      getSharedPreferences("whale_native_prefs", MODE_PRIVATE).edit()
                              .putString("dockEdge", dockEdge)
                              .putInt("anchorX", anchorX)
                              .putInt("anchorY", anchorY)
                              .apply();

                      applyPetGeometry();
                      evalPetJs("window.setPetPose && window.setPetPose('" + (isPeekMode ? "peek" : "active") + "', '" + dockEdge + "');");
                      if (panelWebView != null && panelWebView.getVisibility() == View.VISIBLE) {
                          repositionPanelBesidePet();
                      }
                  }

                  private void applyPetGeometry() {
                      if (windowManager == null || petWebView == null) return;
                      DisplayMetrics dm = getResources().getDisplayMetrics();
                      screenWidth = dm.widthPixels;
                      screenHeight = dm.heightPixels;

                      int fullPx = dp(petSizeDp);
                      int halfPx = Math.max(dp(22), Math.round(fullPx * 0.56f));

                      if (isPeekMode) {
                          if ("left".equals(dockEdge)) {
                              petParams.width = halfPx;
                              petParams.height = fullPx;
                              petParams.x = 0;
                              petParams.y = Math.max(dp(40), Math.min(screenHeight - fullPx - dp(40), anchorY));
                          } else if ("right".equals(dockEdge)) {
                              petParams.width = halfPx;
                              petParams.height = fullPx;
                              petParams.x = screenWidth - halfPx;
                              petParams.y = Math.max(dp(40), Math.min(screenHeight - fullPx - dp(40), anchorY));
                          } else {
                              petParams.width = fullPx;
                              petParams.height = halfPx;
                              petParams.x = Math.max(dp(10), Math.min(screenWidth - fullPx - dp(10), anchorX));
                              petParams.y = screenHeight - halfPx;
                          }
                      } else {
                          petParams.width = fullPx;
                          petParams.height = fullPx;
                          if ("left".equals(dockEdge)) {
                              petParams.x = dp(4);
                              petParams.y = Math.max(dp(40), Math.min(screenHeight - fullPx - dp(40), anchorY));
                          } else if ("right".equals(dockEdge)) {
                              petParams.x = screenWidth - fullPx - dp(4);
                              petParams.y = Math.max(dp(40), Math.min(screenHeight - fullPx - dp(40), anchorY));
                          } else {
                              petParams.x = Math.max(dp(10), Math.min(screenWidth - fullPx - dp(10), anchorX));
                              petParams.y = screenHeight - fullPx - dp(6);
                          }
                      }
                      windowManager.updateViewLayout(petWebView, petParams);
                  }

                  private void showPanelWindow(String panelState, boolean focusKeyboard) {
                      if (windowManager == null || panelWebView == null) return;
                      int wDp = "chat".equals(panelState) ? 265 : 235;
                      int hDp = "chat".equals(panelState) ? 165 : 130;

                      panelParams.width = dp(wDp);
                      panelParams.height = dp(hDp);

                      if (focusKeyboard) {
                          panelParams.flags &= ~WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE;
                      } else {
                          panelParams.flags |= WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE;
                      }

                      panelWebView.setVisibility(View.VISIBLE);
                      repositionPanelBesidePet();

                      if (focusKeyboard) {
                          panelWebView.requestFocus();
                          InputMethodManager imm = (InputMethodManager) getSystemService(Context.INPUT_METHOD_SERVICE);
                          if (imm != null) {
                              imm.showSoftInput(panelWebView, InputMethodManager.SHOW_IMPLICIT);
                          }
                      }
                  }

                  private void repositionPanelBesidePet() {
                      if (windowManager == null || panelWebView == null || petParams == null) return;
                      DisplayMetrics dm = getResources().getDisplayMetrics();
                      screenWidth = dm.widthPixels;
                      screenHeight = dm.heightPixels;

                      int pw = panelParams.width;
                      int ph = panelParams.height;

                      if ("right".equals(dockEdge)) {
                          panelParams.x = Math.max(dp(8), petParams.x - pw - dp(6));
                          panelParams.y = Math.max(dp(36), Math.min(screenHeight - ph - dp(36), petParams.y + petParams.height / 2 - ph / 2));
                      } else if ("left".equals(dockEdge)) {
                          panelParams.x = Math.min(screenWidth - pw - dp(8), petParams.x + petParams.width + dp(6));
                          panelParams.y = Math.max(dp(36), Math.min(screenHeight - ph - dp(36), petParams.y + petParams.height / 2 - ph / 2));
                      } else {
                          int petCenterX = petParams.x + petParams.width / 2;
                          panelParams.x = Math.max(dp(8), Math.min(screenWidth - pw - dp(8), petCenterX - pw / 2));
                          panelParams.y = Math.max(dp(36), petParams.y - ph - dp(6));
                      }
                      windowManager.updateViewLayout(panelWebView, panelParams);
                  }

                  private void hidePanelAndCollapseToPeek() {
                      isPeekMode = true;
                      if (panelWebView != null && windowManager != null) {
                          panelParams.flags |= WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE;
                          panelWebView.setVisibility(View.GONE);
                          windowManager.updateViewLayout(panelWebView, panelParams);
                      }
                      applyPetGeometry();
                      evalPetJs("window.setPetPose && window.setPetPose('peek', '" + dockEdge + "');");
                  }

                  public void evalPetJs(final String script) {
                      if (petWebView == null) return;
                      petWebView.post(() -> petWebView.evaluateJavascript(script, null));
                  }

                  public void evalPanelJs(final String script) {
                      if (panelWebView == null) return;
                      panelWebView.post(() -> panelWebView.evaluateJavascript(script, null));
                  }

                  public void updatePetSizeFromSettings(final int newSizeDp) {
                      if (petWebView == null) return;
                      petWebView.post(() -> {
                          petSizeDp = Math.max(32, Math.min(160, newSizeDp));
                          getSharedPreferences("whale_native_prefs", MODE_PRIVATE).edit().putInt("petSizeDp", petSizeDp).apply();
                          applyPetGeometry();
                          if (panelWebView != null && panelWebView.getVisibility() == View.VISIBLE) {
                              repositionPanelBesidePet();
                          }
                          evalPetJs("window.reloadSpriteConfig && window.reloadSpriteConfig();");
                          evalPanelJs("window.reloadPanelConfig && window.reloadPanelConfig();");
                      });
                  }

                  public void notifyCustomSpriteUpdated() {
                      evalPetJs("window.reloadSpriteConfig && window.reloadSpriteConfig(true);");
                  }

                  public void notifyInstantEvent(String type, String defaultLine) {
                      String safe = defaultLine.replace("'", "\\'");
                      if (petWebView != null) {
                          petWebView.post(() -> {
                              isPeekMode = false;
                              applyPetGeometry();
                              evalPetJs("window.setPetPose && window.setPetPose('active', '" + dockEdge + "');");
                              showPanelWindow("greet", false);
                              evalPanelJs("window.onNativeInstantEvent && window.onNativeInstantEvent('" + type + "', '" + safe + "');");
                          });
                      }
                  }

                  public void notifySongChanged(String songInfo) {
                      String safe = songInfo.replace("'", "\\'");
                      evalPetJs("window.setPetMood && window.setPetMood('dancing');");
                      evalPanelJs("window.onNativeSongChanged && window.onNativeSongChanged('" + safe + "');");
                  }

                  public void dispatchSystemAudioBeat(double rms, boolean isBeat) {
                      evalPetJs(String.format(Locale.US, "window.onSystemAudioBeat && window.onSystemAudioBeat(%.4f, %b);", rms, isBeat));
                  }

                  public void dispatchSystemAudioWav(String b64Wav) {
                      evalPanelJs("window.onSystemAudioWav && window.onSystemAudioWav('" + b64Wav + "');");
                  }

                  public class SharedOverlayBridge {
                      @JavascriptInterface
                      public void expandPanel(final String state, final boolean needKeyboard) {
                          if (panelWebView == null) return;
                          panelWebView.post(() -> {
                              isPeekMode = false;
                              applyPetGeometry();
                              evalPetJs("window.setPetPose && window.setPetPose('active', '" + dockEdge + "');");
                              showPanelWindow(state, needKeyboard);
                          });
                      }

                      @JavascriptInterface
                      public void resizePanelHeight(final int widthDp, final int heightDp, final boolean needKeyboard) {
                          if (panelWebView == null) return;
                          panelWebView.post(() -> {
                              panelParams.width = dp(Math.max(190, Math.min(310, widthDp)));
                              panelParams.height = dp(Math.max(95, Math.min(280, heightDp)));
                              if (needKeyboard) {
                                  panelParams.flags &= ~WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE;
                              } else {
                                  panelParams.flags |= WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE;
                              }
                              if (panelWebView.getVisibility() != View.VISIBLE) {
                                  panelWebView.setVisibility(View.VISIBLE);
                              }
                              repositionPanelBesidePet();
                          });
                      }

                      @JavascriptInterface
                      public void collapseToPeek() {
                          if (panelWebView == null) return;
                          panelWebView.post(FloatingOverlayService.this::hidePanelAndCollapseToPeek);
                      }

                      @JavascriptInterface
                      public void setPetMoodAndMouth(final String mood, final float mouthOpen) {
                          evalPetJs(String.format(Locale.US, "window.setPetMood && window.setPetMood('%s', %.2f);", mood, mouthOpen));
                      }

                      @JavascriptInterface
                      public boolean hasCustomSprite(String kind) {
                          String fn = "talk".equals(kind) ? "custom_talk.dat" : "custom_idle.dat";
                          return new File(getFilesDir(), fn).exists();
                      }

                      @JavascriptInterface
                      public String getDeviceContextJson() {
                          return DeviceContextHelper.getDeviceStatusJson(FloatingOverlayService.this);
                      }

                      @JavascriptInterface
                      public void startVoiceRecognition() {
                          if (panelWebView == null) return;
                          panelWebView.post(() -> {
                              if (speechRecognizer != null) {
                                  speechRecognizer.destroy();
                              }
                              speechRecognizer = SpeechRecognizer.createSpeechRecognizer(FloatingOverlayService.this);
                              speechRecognizer.setRecognitionListener(new RecognitionListener() {
                                  @Override public void onReadyForSpeech(Bundle params) {
                                      evalPanelJs("window.onVoiceState && window.onVoiceState('listening');");
                                  }
                                  @Override public void onBeginningOfSpeech() {}
                                  @Override public void onRmsChanged(float rmsdB) {}
                                  @Override public void onBufferReceived(byte[] buffer) {}
                                  @Override public void onEndOfSpeech() {
                                      evalPanelJs("window.onVoiceState && window.onVoiceState('processing');");
                                  }
                                  @Override public void onError(int error) {
                                      evalPanelJs("window.onVoiceError && window.onVoiceError(" + error + ");");
                                  }
                                  @Override public void onResults(Bundle results) {
                                      ArrayList<String> matches = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                                      if (matches != null && !matches.isEmpty()) {
                                          String text = matches.get(0).replace("'", "\\'");
                                          evalPanelJs("window.onVoiceResult && window.onVoiceResult('" + text + "');");
                                      }
                                  }
                                  @Override public void onPartialResults(Bundle partialResults) {}
                                  @Override public void onEvent(int eventType, Bundle params) {}
                              });
                              Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                              intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                              intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, Locale.getDefault());
                              speechRecognizer.startListening(intent);
                          });
                      }
                  }

                  @Override
                  public void onDestroy() {
                      instance = null;
                      try {
                          unregisterReceiver(systemEventReceiver);
                      } catch (Exception ignored) {}
                      if (windowManager != null) {
                          if (petWebView != null) windowManager.removeView(petWebView);
                          if (panelWebView != null) windowManager.removeView(panelWebView);
                      }
                      if (speechRecognizer != null) speechRecognizer.destroy();
                      super.onDestroy();
                  }

                  @Override
                  public IBinder onBind(Intent intent) {
                      return null;
                  }

                  private void createNotificationChannel() {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          NotificationChannel channel = new NotificationChannel(
                                  CHANNEL_ID, "大肥鱼全局桌面悬浮球", NotificationManager.IMPORTANCE_MIN);
                          NotificationManager nm = getSystemService(NotificationManager.class);
                          if (nm != null) nm.createNotificationChannel(channel);
                      }
                  }
              }
