                  private void requestBasePermissions() {
                      String[] perms;
                      if (Build.VERSION.SDK_INT >= 33) {
                          perms = new String[]{
                                  Manifest.permission.RECORD_AUDIO,
                                  Manifest.permission.ACCESS_COARSE_LOCATION,
                                  Manifest.permission.ACCESS_FINE_LOCATION,
                                  Manifest.permission.POST_NOTIFICATIONS,
                                  Manifest.permission.READ_MEDIA_IMAGES
                          };
                      } else {
                          perms = new String[]{
                                  Manifest.permission.RECORD_AUDIO,
                                  Manifest.permission.ACCESS_COARSE_LOCATION,
                                  Manifest.permission.ACCESS_FINE_LOCATION,
                                  Manifest.permission.READ_EXTERNAL_STORAGE
                          };
                      }
                      ActivityCompat.requestPermissions(this, perms, REQ_PERMS);
                  }

                  private void savePickedSpriteUri(Uri uri, String targetFileName) {
                      if (uri == null) return;
                      try {
                          String mime = getContentResolver().getType(uri);
                          if (mime == null || mime.isEmpty()) mime = "image/png";
                          InputStream is = getContentResolver().openInputStream(uri);
                          if (is == null) return;
                          File outFile = new File(getFilesDir(), targetFileName);
                          FileOutputStream fos = new FileOutputStream(outFile);
                          byte[] buf = new byte[8192];
                          int len;
                          while ((len = is.read(buf)) > 0) {
                              fos.write(buf, 0, len);
                          }
                          fos.flush();
                          fos.close();
                          is.close();

                          SharedPreferences sp = getSharedPreferences("whale_native_prefs", MODE_PRIVATE);
                          sp.edit().putString("mime_" + targetFileName, mime).apply();

                          if (FloatingOverlayService.instance != null) {
                              FloatingOverlayService.instance.notifyCustomSpriteUpdated();
                          }
                          if (controlWebView != null) {
                              controlWebView.evaluateJavascript("window.onCustomSpriteChanged && window.onCustomSpriteChanged();", null);
                          }
                      } catch (Exception ignored) {}
                  }

                  @Override
                  protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                      super.onActivityResult(requestCode, resultCode, data);
                      if (requestCode == REQ_OVERLAY) {
                          if (Settings.canDrawOverlays(this)) {
                              startFloatingService();
                          }
                          if (controlWebView != null) {
                              controlWebView.evaluateJavascript("window.refreshDashboard && window.refreshDashboard();", null);
                          }
                      } else if (requestCode == REQ_MEDIA_PROJECTION) {
                          if (resultCode == Activity.RESULT_OK && data != null) {
                              Intent serviceIntent = new Intent(this, SystemAudioCaptureService.class);
                              serviceIntent.setAction(SystemAudioCaptureService.ACTION_START);
                              serviceIntent.putExtra(SystemAudioCaptureService.EXTRA_RESULT_DATA, data);
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  startForegroundService(serviceIntent);
                              } else {
                                  startService(serviceIntent);
                              }
                          }
                      } else if (requestCode == REQ_PICK_IDLE_SPRITE && resultCode == Activity.RESULT_OK && data != null) {
                          savePickedSpriteUri(data.getData(), "custom_idle.dat");
                      } else if (requestCode == REQ_PICK_TALK_SPRITE && resultCode == Activity.RESULT_OK && data != null) {
                          savePickedSpriteUri(data.getData(), "custom_talk.dat");
                      } else if (requestCode == REQ_EXPORT_PRESET_FILE && resultCode == Activity.RESULT_OK && data != null) {
                          Uri uri = data.getData();
                          if (uri != null) {
                              try (OutputStream os = getContentResolver().openOutputStream(uri)) {
                                  if (os != null) {
                                      os.write(pendingExportJson.getBytes(StandardCharsets.UTF_8));
                                      os.flush();
                                      Toast.makeText(this, "✅ 预设文件已成功导出！", Toast.LENGTH_SHORT).show();
                                  }
                              } catch (Exception e) {
                                  Toast.makeText(this, "导出失败：" + e.getMessage(), Toast.LENGTH_SHORT).show();
                              }
                          }
                      } else if (requestCode == REQ_IMPORT_PRESET_FILE && resultCode == Activity.RESULT_OK && data != null) {
                          Uri uri = data.getData();
                          if (uri != null) {
                              try (InputStream is = getContentResolver().openInputStream(uri)) {
                                  if (is != null) {
                                      ByteArrayOutputStream baos = new ByteArrayOutputStream();
                                      byte[] buf = new byte[8192];
                                      int len;
                                      while ((len = is.read(buf)) > 0) baos.write(buf, 0, len);
                                      String b64 = Base64.encodeToString(baos.toByteArray(), Base64.NO_WRAP);
                                      if (controlWebView != null) {
                                          controlWebView.evaluateJavascript("window.onNativePresetImported && window.onNativePresetImported('" + b64 + "');", null);
                                      }
                                  }
                              } catch (Exception e) {
                                  Toast.makeText(this, "读取文件失败：" + e.getMessage(), Toast.LENGTH_SHORT).show();
                              }
                          }
                      }
                  }

                  private void startFloatingService() {
                      Intent i = new Intent(this, FloatingOverlayService.class);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(i);
                      } else {
                          startService(i);
                      }
                  }

