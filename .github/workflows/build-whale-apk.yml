                    <div class="field">
                      <label><span>色彩滤镜主题</span></label>
                      <select id="cfg-scheme" onchange="saveAllConfig(false)">
                        <option value="deepseek_blue">🌊 默认无滤镜</option>
                        <option value="claude_amber">🍯 暖阳琥珀橘</option>
                        <option value="sakura_pink">🌸 樱花元气粉</option>
                        <option value="mint_emerald">🌿 薄荷翡翠绿</option>
                        <option value="violet_dream">🔮 幻境星云紫</option>
                        <option value="cyber_cyan">⚡ 赛博霓虹青</option>
                        <option value="moonlight_silver">🌙 月光银灰</option>
                      </select>
                    </div>
