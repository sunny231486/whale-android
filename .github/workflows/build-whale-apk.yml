                      if ("right".equals(dockEdge)) {
                          panelParams.x = Math.max(dp(8), petParams.x - pw - dp(6));
                          panelParams.y = Math.max(dp(36), Math.min(screenHeight - ph - dp(36), petParams.y + petParams.height / 2 - ph / 2));
                      } else if ("left".equals(dockEdge)) {
                          panelParams.x = Math.min(screenWidth - pw - dp(8), petParams.x + petParams.width + dp(6));
                          panelParams.y = Math.max(dp(36), Math.min(screenHeight - ph - dp(36), petParams.y + petParams.height / 2 - ph / 2));
                      } else {
                          int petCenterX = petParams.x + petParams.width / 2;
                          panelParams.x = Math.max(dp(8), Math.min(screenWidth - pw - dp(8), petCenterX - pw / 2));
                          panelParams.y = Math.max(dp(36), petParams.y - ph - dp(6));
                      }
                      windowManager.updateViewLayout(panelWebView, panelParams);
                  }

