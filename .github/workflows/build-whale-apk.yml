                  }
                  .stat-item span { display: block; color: var(--mute); font-size: 11px; margin-bottom: 2px; }
                  .stat-item b { font-size: 12px; color: #38bdf8; word-break: break-word; }
                  .field { margin-bottom: 10px; }
                  .field label { display: flex; justify-content: space-between; font-size: 12px; color: var(--mute); margin-bottom: 4px; }
                  .field input, .field select, .field textarea {
                    width: 100%; padding: 8px 11px; border-radius: 9px;
                    border: 1px solid rgba(255,255,255,0.16); background: #0f172a; color: var(--text); font-size: 12.5px;
                  }
                  input[type="range"] { padding: 0; accent-color: var(--accent); }
                  .st-entry, .mem-item {
                    background: rgba(15, 23, 42, 0.78); border: 1px solid rgba(56, 189, 248, 0.25);
                    border-radius: 12px; padding: 10px; margin-bottom: 8px;
                  }
                  .mem-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12.5px; }
                  .st-entry-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 12.5px; font-weight: 600; }
                  .sprite-preview-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
                  .sprite-box {
                    background: rgba(15, 23, 42, 0.7); border: 1px dashed rgba(56, 189, 248, 0.4);
                    border-radius: 12px; padding: 10px; text-align: center;
                  }
                  .sprite-box img { width: 64px; height: 64px; object-fit: contain; display: block; margin: 0 auto 6px; }
                  #connect-status { font-size: 12px; margin-top: 8px; padding: 8px 12px; border-radius: 10px; background: rgba(15, 23, 42, 0.7); display: none; }
                  #json-modal {
                    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75);
                    z-index: 999; padding: 20px; align-items: center; justify-content: center;
                  }
                  .modal-inner {
                    background: #1e293b; border: 1px solid #38bdf8; border-radius: 16px;
                    padding: 14px; width: 100%; max-width: 460px;
                  }
                </style>
              </head>
              <body>
                <div class="header">
                  <img id="top-avatar-img" src="whale-official-icon.png" onerror="this.style.display='none'" />
                  <div>
                    <h2 style="margin:0; font-size:17px;">🐟 大肥鱼全局 AI 助理 v8</h2>
                    <p style="margin:3px 0 0; font-size:11.5px; color:var(--mute);">Shizuku + Common Intents · 看屏 · 白名单识曲 · 长期记忆 · 原生文件导入导出</p>
                  </div>
                </div>

                <!-- 1. 悬浮球与核心权限 -->
                <div class="card">
                  <h3>
                    <span>🚀 第一步：悬浮球、通知重连与 Shizuku 授权</span>
                    <span id="overlay-badge" style="font-size:12px; color:#38bdf8;">检测中...</span>
                  </h3>
                  <button class="btn" id="btn-toggle-overlay" onclick="MainBridge.toggleFloatingOverlay()">开启全局悬浮桌宠</button>
                  <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:4px;">
                    <button class="btn secondary" id="btn-notif-perm" onclick="MainBridge.openNotificationAccessSettings()">🔔 通知监听权限</button>
                    <button class="btn shizuku" id="btn-shizuku" onclick="MainBridge.requestShizukuPermission()">⚡ 授权 Shizuku</button>
                  </div>
                  <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:4px;">
                    <button class="btn secondary" onclick="toggleSysAudio()">🎧 系统内录律动</button>
                    <button class="btn secondary" onclick="MainBridge.triggerTestContextGreeting()">✨ 测试状态搭话</button>
                  </div>
                  <p id="perm-hint" style="font-size:11px; color:var(--mute); margin:8px 0 0; line-height:1.45;">
                    红米 HyperOS 建议在系统应用详情中开启「自启动」并设为「省电无限制」，重启后即可自动重连通知监听。
                  </p>
                </div>

                <!-- 2. 音乐监听白名单与动手能力开关 -->
                <div class="card">
                  <h3>🎵 第二步：音乐白名单与 AI 动手能力</h3>
                  <div class="field">
                    <label><span>仅监听以下包名的音乐播放（逗号或换行分隔，彻底杜绝多软件冲突）</span></label>
                    <textarea id="cfg-music-whitelist" rows="2" placeholder="com.salt.music" onchange="saveAllConfig(false)"></textarea>
                    <div class="chip-row">
                      <span class="chip" onclick="addWhitelistPkg('com.salt.music')">+ 椒盐音乐</span>
                      <span class="chip" onclick="addWhitelistPkg('com.netease.cloudmusic')">+ 网易云</span>
                      <span class="chip" onclick="addWhitelistPkg('com.tencent.qqmusic')">+ QQ音乐</span>
                      <span class="chip" onclick="addWhitelistPkg('com.apple.android.music')">+ Apple Music</span>
                    </div>
                  </div>
                  <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; align-items:end;">
                    <div class="field" style="margin-bottom:0;">
                      <label><span>切歌点评冷却时间（秒）</span></label>
                      <input type="number" id="cfg-song-cooldown" value="120" min="10" onchange="saveAllConfig(false)" />
                    </div>
                    <div class="field" style="margin-bottom:0;">
                      <label style="align-items:center; gap:6px; justify-content:flex-start; color:#f8fafc; padding:8px 0;">
                        <input type="checkbox" id="cfg-enable-actions" checked style="width:auto;" onchange="saveAllConfig(false)" />
                        <span>⚡ 启用 AI 动手能力（切歌/闹钟/开App/Shizuku）</span>
                      </label>
                    </div>
                  </div>
