                <!-- 5. 酒馆预设编辑器 + 原生文件导入导出 -->
                <div class="card">
                  <h3>🍺 第五步：酒馆风预设与 .json 文件导入/导出</h3>
                  <div class="field">
                    <label><span>⚡ 思考耗时控制 (Thinking Budget)</span></label>
                    <select id="st-thinking" onchange="saveAllConfig(false)">
                      <option value="0">🚀 0（彻底关闭思考链 · 极速秒回）</option>
                      <option value="256">⚡ 256 Tokens（轻度思考）</option>
                      <option value="1024">🧠 1024 Tokens（中度思考）</option>
                      <option value="-1">🐢 模型默认思考</option>
                    </select>
                  </div>
                  <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                    <div class="field"><label><span>温度 (Temperature)</span></label><input type="number" step="0.05" id="st-temp" value="0.85" onchange="saveAllConfig(false)" /></div>
                    <div class="field"><label><span>最大回复字数 (Max Tokens)</span></label><input type="number" id="st-max-tokens" value="160" onchange="saveAllConfig(false)" /></div>
                    <div class="field"><label><span>角色名 ({{char}})</span></label><input id="cfg-char-name" value="大肥鱼" onchange="saveAllConfig(false)" /></div>
                    <div class="field"><label><span>你的称呼 ({{user}})</span></label><input id="cfg-user-name" value="主人" onchange="saveAllConfig(false)" /></div>
                  </div>
                  <div id="st-entries-container"></div>
                  <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                    <button class="btn connect" onclick="exportPresetFile()">📤 导出为 .json 文件</button>
                    <button class="btn connect" onclick="importPresetFile()">📥 从 .json 文件导入</button>
                  </div>
                  <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:4px;">
                    <button class="btn secondary" onclick="openJsonModal('export')">📋 复制预设文本</button>
                    <button class="btn secondary" onclick="openJsonModal('import')">📝 粘贴文本导入</button>
                  </div>
                </div>

                <!-- 6. AI 接口配置 -->
                <div class="card">
                  <h3>🔌 第六步：AI 接口与模型拉取</h3>
                  <div class="provider-tabs">
                    <div class="tab-btn active" id="tab-gemini" onclick="switchProviderTab('gemini')">✨ Google AI Studio<br><span style="font-size:11px;font-weight:400;">官方 Gemini（原生支持看屏）</span></div>
                    <div class="tab-btn" id="tab-openai" onclick="switchProviderTab('openai')">🌐 第三方 OpenAI 格式<br><span style="font-size:11px;font-weight:400;">DeepSeek / 硅基 / NewAPI</span></div>
                  </div>
                  <div id="panel-gemini">
                    <div class="field"><label><span>Google AI Studio API Key</span></label><input id="cfg-gemini-key" type="password" placeholder="AIzaSy..." /></div>
                    <div class="field"><label><span>Gemini 接口地址</span></label><input id="cfg-gemini-url" placeholder="https://generativelanguage.googleapis.com/v1beta" /></div>
                    <button class="btn connect" onclick="connectAndFetchModels('gemini')">🔗 连接 Google AI Studio 并拉取可用模型</button>
                    <div class="field" style="margin-top:10px;"><label><span>选择拉取到的 Gemini 模型</span></label><select id="sel-gemini-models" onchange="if(this.value) document.getElementById('cfg-gemini-model').value=this.value; saveAllConfig(false);"><option value="gemini-2.5-flash">gemini-2.5-flash</option><option value="gemini-2.0-flash">gemini-2.0-flash</option></select></div>
                    <div class="field"><label><span>当前使用的 Gemini 模型 ID</span></label><input id="cfg-gemini-model" placeholder="gemini-2.5-flash" /></div>
                  </div>
                  <div id="panel-openai" style="display:none;">
                    <div class="field"><label><span>API Base URL</span></label><input id="cfg-base-url" placeholder="https://api.deepseek.com/v1" /></div>
                    <div class="field"><label><span>API Key</span></label><input id="cfg-api-key" type="password" placeholder="sk-..." /></div>
                    <button class="btn connect" onclick="connectAndFetchModels('openai')">🔗 连接第三方接口并拉取可用模型</button>
                    <div class="field" style="margin-top:10px;"><label><span>选择拉取到的可用模型</span></label><select id="sel-openai-models" onchange="if(this.value) document.getElementById('cfg-model').value=this.value; saveAllConfig(false);"><option value="deepseek-chat">deepseek-chat</option></select></div>
                    <div class="field"><label><span>当前使用的对话模型 ID</span></label><input id="cfg-model" placeholder="deepseek-chat" /></div>
                  </div>
                  <div id="connect-status"></div>
                  <div class="field" style="margin-top:10px;"><label><span>默认城市名（天气查询）</span></label><input id="cfg-city" placeholder="Shanghai" /></div>
                  <button class="btn" onclick="saveAllConfig(true)">💾 保存全部设置并同步给悬浮球</button>
                </div>

                <!-- 7. 实时状态监控 -->
                <div class="card">
                  <h3><span>📱 手机与权限实时监控</span><span style="font-size:11px; color:var(--mute); cursor:pointer;" onclick="refreshDashboard()">🔄 刷新</span></h3>
                  <div class="status-grid">
                    <div class="stat-item"><span>电量与温度</span><b id="st-battery">--</b></div>
                    <div class="stat-item"><span>下一个真实闹钟</span><b id="st-alarm">--</b></div>
                    <div class="stat-item"><span>通知监听状态</span><b id="st-notif">--</b></div>
                    <div class="stat-item"><span>Shizuku 状态</span><b id="st-shizuku">--</b></div>
                    <div class="stat-item"><span>未接来电 / 未读短信</span><b id="st-calls-sms">--</b></div>
                    <div class="stat-item"><span>未读微信与社交</span><b id="st-social">--</b></div>
                    <div class="stat-item" style="grid-column: span 2;"><span>🎵 白名单播放器当前歌曲</span><b id="st-song">暂无播放</b></div>
                  </div>
                </div>

                <!-- 复制/粘贴 JSON 弹窗 -->
                <div id="json-modal">
                  <div class="modal-inner">
                    <h4 id="modal-title" style="margin:0 0 8px; color:#38bdf8;">预设 JSON</h4>
                    <textarea id="modal-textarea" rows="10" style="width:100%; padding:8px; border-radius:10px; background:#0f172a; color:#f8fafc; border:1px solid rgba(255,255,255,0.2); font-size:11.5px;"></textarea>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px;">
                      <button class="btn connect" id="modal-confirm-btn" onclick="onModalConfirm()">确定</button>
                      <button class="btn secondary" onclick="document.getElementById('json-modal').style.display='none'">关闭</button>
                    </div>
                  </div>
                </div>

                <script>
                  const DEFAULT_TAVERN_PRESET = {
                    presetName: '⚡ 极速秒回桌宠预设（默认）',
                    thinkingBudget: 0,
                    temperature: 0.85,
                    topP: 0.95,
                    maxTokens: 160,
                    contextDepth: 6,
                    entries: [
                      { id: 'main_sys', name: '1. 主系统指令 (Main Prompt)', enabled: true, role: 'system', position: 'top', content: '你将扮演住在用户手机屏幕边缘的桌面宠物「{{char}}」与「{{user}}」互动。直接输出{{char}}说的台词，不要输出任何动作括号描写、心理活动或思考过程。' },
                      { id: 'char_card', name: '2. 角色设定卡 (Character Card)', enabled: true, role: 'system', position: 'top', content: '{{char}}是一只蓝白配色的小鲸鱼娘（大肥鱼），性格灵动粘人、温柔俏皮，偶尔爱吐槽。称呼{{user}}为“主人”。' },
                      { id: 'user_persona', name: '3. 用户人设 (User Persona)', enabled: true, role: 'system', position: 'top', content: '{{user}}是{{char}}最信赖的伙伴，日常带着手机听歌、看视频、聊天。' },
                      { id: 'world_info_phone', name: '4. 世界书：手机状态与长期记忆注入', enabled: true, role: 'system', position: 'top', content: '【当前手机实时状态】时间:{{time}} | 电量:{{battery}} | 天气:{{weather}} | 闹钟:{{alarm}} | 通知:{{notifications}} | 正在播放音乐:{{song}}。\n【长期记忆】{{memory}}' },
                      { id: 'post_history_jb', name: '5. 尾置强约束 (秒回短句约束)', enabled: true, role: 'system', position: 'bottom', content: '[输出铁律：严禁输出思维链，直接用口语回复1~2句话，总字数严格控制在65字以内！]' }
                    ]
                  };

                  const DEFAULT_CFG = {
                    apiProvider: 'gemini',
                    geminiBaseUrl: 'https://generativelanguage.googleapis.com/v1beta',
                    geminiApiKey: '',
                    geminiModel: 'gemini-2.5-flash',
                    baseUrl: 'https://api.deepseek.com/v1',
                    apiKey: '',
                    model: 'deepseek-chat',
                    petSizeDp: 58,
                    fontScale: 100,
                    colorScheme: 'deepseek_blue',
                    cityFallback: 'Shanghai',
                    userName: '主人',
                    charName: '大肥鱼',
                    musicWhitelist: 'com.salt.music',
                    songCooldownSec: 120,
                    enableActions: true,
                    tavernPreset: DEFAULT_TAVERN_PRESET
                  };

                  let currentProvider = 'gemini';
                  let currentEntries = JSON.parse(JSON.stringify(DEFAULT_TAVERN_PRESET.entries));
                  let modalMode = 'export';

                  function getMemories() {
                    try { const a = JSON.parse(localStorage.getItem('whale_v8_memories') || '[]'); return Array.isArray(a) ? a : []; } catch (_) { return []; }
                  }

                  function renderMemories() {
                    const box = document.getElementById('mem-list-container');
                    const arr = getMemories();
                    if (!arr.length) {
                      box.innerHTML = '<div style="font-size:11.5px; color:var(--mute);">暂无长期记忆。你可以手动添加，也可以在聊天中直接说“记住我喜欢喝冰美式”。</div>';
                      return;
                    }
                    box.innerHTML = arr.map((m, i) => `
                      <div class="mem-item">
                        <span>• ${m.replace(/</g, '&lt;')}</span>
                        <span style="color:#f87171; cursor:pointer; font-size:11.5px; white-space:nowrap;" onclick="deleteMemory(${i})">删除</span>
                      </div>
                    `).join('');
                  }

                  window.addMemoryFromUi = function() {
                    const inp = document.getElementById('new-mem-input');
                    const val = inp.value.trim();
                    if (!val) return;
                    const arr = getMemories();
                    arr.push(val);
                    localStorage.setItem('whale_v8_memories', JSON.stringify(arr));
                    inp.value = '';
                    renderMemories();
                  };

                  window.deleteMemory = function(idx) {
                    const arr = getMemories();
                    arr.splice(idx, 1);
                    localStorage.setItem('whale_v8_memories', JSON.stringify(arr));
                    renderMemories();
                  };

                  window.addWhitelistPkg = function(pkg) {
                    const el = document.getElementById('cfg-music-whitelist');
                    const parts = el.value.split(/[,\s\n]+/).map(s => s.trim()).filter(Boolean);
                    if (!parts.includes(pkg)) parts.push(pkg);
                    el.value = parts.join(', ');
                    saveAllConfig(false);
                  };

                  function buildExportPresetJson() {
                    return JSON.stringify({
                      charName: document.getElementById('cfg-char-name').value.trim() || '大肥鱼',
                      userName: document.getElementById('cfg-user-name').value.trim() || '主人',
                      thinkingBudget: parseInt(document.getElementById('st-thinking').value, 10),
                      temperature: parseFloat(document.getElementById('st-temp').value) || 0.85,
                      maxTokens: parseInt(document.getElementById('st-max-tokens').value, 10) || 160,
                      entries: currentEntries,
                      memories: getMemories()
                    }, null, 2);
                  }

                  function applyImportedPresetObj(obj) {
                    if (Array.isArray(obj.entries)) {
                      currentEntries = obj.entries;
                      renderTavernEntries();
                    }
                    if (typeof obj.charName === 'string' && obj.charName.trim()) document.getElementById('cfg-char-name').value = obj.charName.trim();
                    if (typeof obj.userName === 'string' && obj.userName.trim()) document.getElementById('cfg-user-name').value = obj.userName.trim();
                    if (typeof obj.thinkingBudget === 'number') document.getElementById('st-thinking').value = String(obj.thinkingBudget);
                    if (typeof obj.temperature === 'number') document.getElementById('st-temp').value = String(obj.temperature);
                    if (typeof obj.maxTokens === 'number') document.getElementById('st-max-tokens').value = String(obj.maxTokens);
                    if (Array.isArray(obj.memories)) {
                      localStorage.setItem('whale_v8_memories', JSON.stringify(obj.memories));
                      renderMemories();
                    }
                    saveAllConfig(true);
                  }

                  window.exportPresetFile = function() {
                    const jsonStr = buildExportPresetJson();
                    const charName = (document.getElementById('cfg-char-name').value.trim() || 'whale').replace(/[^\w\u4e00-\u9fa5-]/g, '_');
                    if (window.MainBridge && window.MainBridge.exportPresetToFile) {
                      window.MainBridge.exportPresetToFile(jsonStr, `${charName}_preset_v8.json`);
                    }
                  };

                  window.importPresetFile = function() {
                    if (window.MainBridge && window.MainBridge.importPresetFromFile) {
                      window.MainBridge.importPresetFromFile();
                    }
                  };

                  window.onNativePresetImported = function(b64) {
                    try {
                      const bin = atob(b64);
                      const bytes = new Uint8Array(bin.length);
                      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                      const text = new TextDecoder('utf-8').decode(bytes);
                      const obj = JSON.parse(text);
                      applyImportedPresetObj(obj);
                    } catch (e) {
                      alert('预设 JSON 解析失败：' + e.message);
                    }
                  };

                  window.openJsonModal = function(mode) {
                    modalMode = mode;
                    const m = document.getElementById('json-modal');
                    const ta = document.getElementById('modal-textarea');
                    const title = document.getElementById('modal-title');
                    const btn = document.getElementById('modal-confirm-btn');
                    if (mode === 'export') {
                      title.textContent = '📤 复制预设 JSON';
                      ta.value = buildExportPresetJson();
                      btn.textContent = '📋 一键复制到剪贴板';
                    } else {
                      title.textContent = '📥 粘贴预设 JSON 导入';
                      ta.value = '';
                      ta.placeholder = '在此粘贴完整的 JSON 预设内容...';
                      btn.textContent = '✅ 确认导入并生效';
                    }
                    m.style.display = 'flex';
                  };

                  window.onModalConfirm = function() {
                    const ta = document.getElementById('modal-textarea');
                    if (modalMode === 'export') {
                      if (window.MainBridge && window.MainBridge.copyTextToClipboard) {
                        window.MainBridge.copyTextToClipboard(ta.value);
                      }
                      document.getElementById('json-modal').style.display = 'none';
                    } else {
                      try {
                        const obj = JSON.parse(ta.value.trim());
                        document.getElementById('json-modal').style.display = 'none';
                        applyImportedPresetObj(obj);
                      } catch (e) {
                        alert('JSON 格式错误：' + e.message);
                      }
                    }
                  };

                  window.onCustomSpriteChanged = function() {
                    if (!window.MainBridge) return;
                    const ts = Date.now();
                    const hasIdle = window.MainBridge.hasCustomSprite('idle');
                    const hasTalk = window.MainBridge.hasCustomSprite('talk');
                    const idleImg = document.getElementById('prev-idle-img');
                    const talkImg = document.getElementById('prev-talk-img');
                    const topAvatar = document.getElementById('top-avatar-img');
                    if (hasIdle) {
                      const url = 'https://appassets.androidplatform.net/custom_sprites/custom_idle.dat?t=' + ts;
                      idleImg.src = url; topAvatar.src = url;
                      document.getElementById('lbl-idle-status').textContent = '✅ 已启用自定义贴图';
                    } else {
                      idleImg.src = 'whale-official-icon.png'; topAvatar.src = 'whale-official-icon.png';
                      document.getElementById('lbl-idle-status').textContent = '当前：默认大肥鱼';
                    }
                    if (hasTalk) {
                      talkImg.src = 'https://appassets.androidplatform.net/custom_sprites/custom_talk.dat?t=' + ts;
                      document.getElementById('lbl-talk-status').textContent = '✅ 已启用说话差分图';
                    } else {
                      talkImg.src = hasIdle ? idleImg.src : 'whale-official-icon.png';
                      document.getElementById('lbl-talk-status').textContent = '说话差分：未设置(可选)';
                    }
                  };

                  function renderTavernEntries() {
                    const box = document.getElementById('st-entries-container');
                    box.innerHTML = '';
                    currentEntries.forEach((entry, idx) => {
                      const div = document.createElement('div');
                      div.className = 'st-entry';
                      div.innerHTML = `
                        <div class="st-entry-head">
                          <span>${entry.name}</span>
                          <label style="display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#38bdf8;">
                            <input type="checkbox" ${entry.enabled ? 'checked' : ''} onchange="toggleEntry(${idx}, this.checked)" /> 启用
                          </label>
                        </div>
                        <textarea rows="2" style="width:100%;padding:7px;border-radius:8px;background:#0f172a;color:#f8fafc;border:1px solid rgba(255,255,255,0.14);font-size:12px;" oninput="updateEntryContent(${idx}, this.value)">${entry.content}</textarea>
                      `;
                      box.appendChild(div);
                    });
                  }

                  window.toggleEntry = function(idx, checked) { currentEntries[idx].enabled = checked; saveAllConfig(false); };
                  window.updateEntryContent = function(idx, val) { currentEntries[idx].content = val; saveAllConfig(false); };
                  window.onSizeSliderChange = function(val) { document.getElementById('lbl-size').textContent = val + ' dp'; saveAllConfig(false); };

                  function switchProviderTab(provider) {
                    currentProvider = provider;
                    document.getElementById('tab-gemini').classList.toggle('active', provider === 'gemini');
                    document.getElementById('tab-openai').classList.toggle('active', provider === 'openai');
                    document.getElementById('panel-gemini').style.display = provider === 'gemini' ? 'block' : 'none';
                    document.getElementById('panel-openai').style.display = provider === 'openai' ? 'block' : 'none';
                    saveAllConfig(false);
                  }

                  function showConnectStatus(msg, isError) {
                    const el = document.getElementById('connect-status');
                    el.style.display = 'block';
                    el.style.color = isError ? '#f87171' : '#4ade80';
                    el.textContent = msg;
                  }

                  async function connectAndFetchModels(provider) {
                    showConnectStatus('⏳ 正在连接并拉取可用模型列表...', false);
                    try {
                      if (provider === 'gemini') {
                        const key = document.getElementById('cfg-gemini-key').value.trim();
                        const base = (document.getElementById('cfg-gemini-url').value.trim() || DEFAULT_CFG.geminiBaseUrl).replace(/\/$/, '');
                        if (!key) { showConnectStatus('❌ 请先填写 Google AI Studio API Key', true); return; }
                        const res = await fetch(`${base}/models?pageSize=100&key=${encodeURIComponent(key)}`);
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        const data = await res.json();
                        const models = (data.models || []).filter(m => Array.isArray(m.supportedGenerationMethods) && m.supportedGenerationMethods.includes('generateContent'));
                        if (!models.length) throw new Error('未找到可用模型');
                        const sel = document.getElementById('sel-gemini-models');
                        sel.innerHTML = '';
                        models.forEach(m => {
                          const id = (m.name || '').replace(/^models\//, '');
                          const opt = document.createElement('option');
                          opt.value = id; opt.textContent = m.displayName ? `${id} (${m.displayName})` : id;
                          sel.appendChild(opt);
                        });
                        sel.selectedIndex = 0;
                        document.getElementById('cfg-gemini-model').value = sel.value;
                        saveAllConfig(false);
                        showConnectStatus(`✅ 连接成功！已拉取 ${models.length} 个 Gemini 模型。`, false);
                      } else {
                        const key = document.getElementById('cfg-api-key').value.trim();
                        const base = (document.getElementById('cfg-base-url').value.trim() || DEFAULT_CFG.baseUrl).replace(/\/$/, '');
                        if (!key) { showConnectStatus('❌ 请先填写 API Key', true); return; }
                        const res = await fetch(`${base}/models`, { method: 'GET', headers: { 'Authorization': `Bearer ${key}` } });
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        const data = await res.json();
                        const list = Array.isArray(data.data) ? data.data : (Array.isArray(data.models) ? data.models : []);
                        if (!list.length) throw new Error('模型列表为空');
                        const sel = document.getElementById('sel-openai-models');
                        sel.innerHTML = '';
                        list.forEach(item => {
                          const id = item.id || item.name || String(item);
                          const opt = document.createElement('option');
                          opt.value = id; opt.textContent = id;
                          sel.appendChild(opt);
                        });
                        sel.selectedIndex = 0;
                        document.getElementById('cfg-model').value = sel.value;
                        saveAllConfig(false);
                        showConnectStatus(`✅ 连接成功！已拉取 ${list.length} 个模型。`, false);
                      }
                    } catch (err) {
                      showConnectStatus(`❌ 拉取失败 (${err.message})`, true);
                    }
                  }

                  function loadForm() {
                    let cfg = Object.assign({}, DEFAULT_CFG, JSON.parse(localStorage.getItem('whale_v6_cfg') || '{}'));
                    document.getElementById('cfg-gemini-key').value = cfg.geminiApiKey || '';
                    document.getElementById('cfg-gemini-url').value = cfg.geminiBaseUrl || DEFAULT_CFG.geminiBaseUrl;
                    document.getElementById('cfg-gemini-model').value = cfg.geminiModel || DEFAULT_CFG.geminiModel;
                    document.getElementById('cfg-base-url').value = cfg.baseUrl || DEFAULT_CFG.baseUrl;
                    document.getElementById('cfg-api-key').value = cfg.apiKey || '';
                    document.getElementById('cfg-model').value = cfg.model || DEFAULT_CFG.model;
                    document.getElementById('cfg-size').value = cfg.petSizeDp || 58;
                    document.getElementById('lbl-size').textContent = (cfg.petSizeDp || 58) + ' dp';
                    document.getElementById('cfg-font').value = String(cfg.fontScale || 100);
                    document.getElementById('cfg-scheme').value = cfg.colorScheme || 'deepseek_blue';
                    document.getElementById('cfg-city').value = cfg.cityFallback || 'Shanghai';
                    document.getElementById('cfg-char-name').value = cfg.charName || '大肥鱼';
                    document.getElementById('cfg-user-name').value = cfg.userName || '主人';
                    document.getElementById('cfg-music-whitelist').value = cfg.musicWhitelist || 'com.salt.music';
                    document.getElementById('cfg-song-cooldown').value = String(cfg.songCooldownSec || 120);
                    document.getElementById('cfg-enable-actions').checked = cfg.enableActions !== false;

                    const preset = cfg.tavernPreset || DEFAULT_TAVERN_PRESET;
                    document.getElementById('st-thinking').value = String(preset.thinkingBudget ?? 0);
                    document.getElementById('st-temp').value = String(preset.temperature ?? 0.85);
                    document.getElementById('st-max-tokens').value = String(preset.maxTokens ?? 160);
                    if (Array.isArray(preset.entries) && preset.entries.length > 0) currentEntries = preset.entries;
                    renderTavernEntries();
                    renderMemories();
                    switchProviderTab(cfg.apiProvider || 'gemini');
                    onCustomSpriteChanged();
                  }

                  function saveAllConfig(showAlert) {
                    const sizeDp = parseInt(document.getElementById('cfg-size').value, 10) || 58;
                    const whitelist = document.getElementById('cfg-music-whitelist').value.trim() || 'com.salt.music';
                    const cooldownSec = Math.max(10, parseInt(document.getElementById('cfg-song-cooldown').value, 10) || 120);
                    const cfg = {
                      apiProvider: currentProvider,
                      geminiBaseUrl: document.getElementById('cfg-gemini-url').value.trim() || DEFAULT_CFG.geminiBaseUrl,
                      geminiApiKey: document.getElementById('cfg-gemini-key').value.trim(),
                      geminiModel: document.getElementById('cfg-gemini-model').value.trim() || DEFAULT_CFG.geminiModel,
                      baseUrl: document.getElementById('cfg-base-url').value.trim() || DEFAULT_CFG.baseUrl,
                      apiKey: document.getElementById('cfg-api-key').value.trim(),
                      model: document.getElementById('cfg-model').value.trim() || DEFAULT_CFG.model,
                      petSizeDp: sizeDp,
                      fontScale: parseInt(document.getElementById('cfg-font').value, 10) || 100,
                      colorScheme: document.getElementById('cfg-scheme').value,
                      cityFallback: document.getElementById('cfg-city').value.trim() || 'Shanghai',
                      charName: document.getElementById('cfg-char-name').value.trim() || '大肥鱼',
                      userName: document.getElementById('cfg-user-name').value.trim() || '主人',
                      musicWhitelist: whitelist,
                      songCooldownSec: cooldownSec,
                      enableActions: document.getElementById('cfg-enable-actions').checked,
                      tavernPreset: {
                        thinkingBudget: parseInt(document.getElementById('st-thinking').value, 10),
                        temperature: parseFloat(document.getElementById('st-temp').value) || 0.85,
                        topP: 0.95,
                        maxTokens: parseInt(document.getElementById('st-max-tokens').value, 10) || 160,
                        contextDepth: 6,
                        entries: currentEntries
                      }
                    };
                    localStorage.setItem('whale_v6_cfg', JSON.stringify(cfg));
                    if (window.MainBridge) {
                      window.MainBridge.notifyConfigSaved(sizeDp, whitelist, cooldownSec);
                    }
                    if (showAlert) alert('✅ 设置已保存并实时同步给悬浮球！');
                  }

                  function toggleSysAudio() {
                    if (window.MainBridge) window.MainBridge.toggleSystemAudioCapture(false);
                  }

                  window.refreshDashboard = function() {
                    if (!window.MainBridge) return;
                    const running = window.MainBridge.isOverlayRunning();
                    const canDraw = window.MainBridge.canDrawOverlays();
                    const badge = document.getElementById('overlay-badge');
                    const btn = document.getElementById('btn-toggle-overlay');

                    if (running) {
                      badge.textContent = '● 悬浮球运行中'; badge.style.color = '#4ade80';
                      btn.textContent = '关闭全局悬浮桌宠';
                    } else if (!canDraw) {
                      badge.textContent = '○ 需授予悬浮窗权限'; badge.style.color = '#facc15';
                      btn.textContent = '点击授予悬浮窗权限并启动';
                    } else {
                      badge.textContent = '○ 未启动'; badge.style.color = '#94a3b8';
                      btn.textContent = '启动全局悬浮桌宠';
                    }

                    try {
                      const st = JSON.parse(window.MainBridge.getDeviceStatusJson() || '{}');
                      document.getElementById('st-battery').textContent = `${st.batteryPct ?? '--'}% (${st.isCharging ? '⚡充电中' : '未充电'} · ${st.batteryTempC ?? '--'}°C)`;
                      document.getElementById('st-alarm').textContent = st.nextAlarm || '未设置';

                      const notifBtn = document.getElementById('btn-notif-perm');
                      if (st.notificationGranted && st.notificationAccess) {
                        document.getElementById('st-notif').textContent = '✅ 已授权并运行';
                        notifBtn.textContent = '✅ 通知监听已就绪';
                      } else if (st.notificationGranted) {
                        document.getElementById('st-notif').textContent = '🔄 已授权，自动重连中...';
                        notifBtn.textContent = '🔄 通知自动重连中';
                      } else {
                        document.getElementById('st-notif').textContent = '⚠️ 未授权';
                        notifBtn.textContent = '🔔 授权通知/识曲';
                      }

                      const szBtn = document.getElementById('btn-shizuku');
                      document.getElementById('st-shizuku').textContent = st.shizukuStatus || '未检测到';
                      if (st.shizukuGranted) {
                        szBtn.textContent = '✅ Shizuku 已授权';
                      } else if (st.shizukuAvailable) {
                        szBtn.textContent = '⚡ 点击授权 Shizuku';
                      } else {
                        szBtn.textContent = '⚡ 启动 Shizuku 服务';
                      }

                      document.getElementById('st-calls-sms').textContent = st.notificationGranted
                        ? `${st.missedCalls || 0} 个未接 / ${st.unreadSms || 0} 条短信`
                        : '请点击上方授权通知监听';
                      document.getElementById('st-social').textContent = st.notificationGranted
                        ? `${st.unreadSocial || 0} 条未读消息`
                        : '未授权通知监听';
                      document.getElementById('st-song').textContent = st.currentSong
                        ? `${st.currentSong} ${st.musicApp ? '(' + st.musicApp + ')' : ''}`
                        : '暂无白名单音乐播放';
                    } catch (_) {}
                  };

                  loadForm();
                  refreshDashboard();
                  setInterval(refreshDashboard, 3000);
                </script>
              </body>
              </html>
              """).lstrip())
          print("WhaleCompanion v8 generated successfully.")
          PY

      - name: 6. 安装匹配的 Gradle 8.5 环境
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: 7. 使用 Gradle 编译生成安卓 APK
        working-directory: /tmp/whale-android
        run: |
          gradle assembleDebug --no-daemon

      - name: 8. 上传编译好的安卓 APK 安装包
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Whale-Android-APK-v8
          path: /tmp/whale-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
