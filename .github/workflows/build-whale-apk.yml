# ==============================================================================
# 🐟 DeepSeek 大肥鱼（dsh-coopanion）安卓全局悬浮伴侣版 · v5 完整优化版自动打包配置
# ==============================================================================
# ✨ v5 全部特性汇总：
# 1. 双接口引擎（第三方 OpenAI 格式 + 谷歌官方 Google AI Studio Gemini API）：
#    - 内置「🔗 连接并拉取可用模型」按钮，点击后自动请求 /models 接口验证连通性并生成可用模型下拉列表。
#    - Google AI Studio 模式下支持原生 Gemini 多模态音频直传（系统内录视频/音乐声音可直接由 Gemini 听音互动，无需额外配置语音转写接口）。
# 2. 真·全局跨应用悬浮窗（TYPE_APPLICATION_OVERLAY）：可在桌面、微信、浏览器、视频 App 上方自由显示，窗口边界动态收缩，绝不遮挡其他区域点击。
# 3. 自由吸附 + 待机只露半个头：拖到底部边缘向上探出半个头，拖到左右边缘歪头侧向探出半个头。
# 4. 点击跳出站好 + 随机 10 句问候语 + 双按钮：点半个头立即抛物线跃起站好，随机弹出 10 句问候语之一，并展开「🎤 语音」与「💬 对话」双胶囊按钮。
# 5. 桌宠大小与气泡字号自由无级调节（90dp~260dp 尺寸缩放 + 8 套原版配色切换 + 原仓库真实大肥鱼贴图提取挂载）。
# 6. KLWP 同款手机状态感知 + 30 分钟主动搭话：读取电量/充电/温度、下个系统闹钟、通知栏未读短信/未接电话/微信未读、正在播放的歌名，以及免 Key 实时天气（Open-Meteo）。
# 7. 智能省电与即时事件：锁屏息屏自动暂停定时请求；插拔充电器、低电量(<20%)、新未接来电、切歌时立即探头互动。
# ==============================================================================

name: Build DeepSeek Whale Android APK v5

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出当前仓库
        uses: actions/checkout@v4

      - name: 2. 拉取 takboo/dsh-coopanion 官方仓库并提取原版大肥鱼贴图与资源
        run: |
          git clone --depth 1 https://github.com/takboo/dsh-coopanion.git /tmp/dsh-coopanion
          mkdir -p /tmp/whale-android/app/src/main/assets/www
          cp -r /tmp/dsh-coopanion/web/* /tmp/whale-android/app/src/main/assets/www/ || true
          if [ -d "/tmp/dsh-coopanion/assets" ]; then
            cp -r /tmp/dsh-coopanion/assets /tmp/whale-android/app/src/main/assets/www/assets || true
          fi
          if [ -f "/tmp/dsh-coopanion/desktop/icon.png" ]; then
            cp /tmp/dsh-coopanion/desktop/icon.png /tmp/whale-android/app/src/main/assets/www/whale-official-icon.png
          fi
          python3 - << 'PY'
          import os, json

          root = '/tmp/whale-android/app/src/main/assets/www'
          files = []
          whale_images = []
          figure_meta = {}

          for dirpath, _, filenames in os.walk(root):
              for f in filenames:
                  full = os.path.join(dirpath, f)
                  rel = os.path.relpath(full, root).replace('\\', '/')
                  files.append(rel)
                  low = rel.lower()
                  if low.endswith(('.png', '.webp', '.svg', '.gif')) and ('whale' in low or 'icon' in low or 'figure' in low or 'assets' in low):
                      whale_images.append(rel)
                  if f == 'figure.json' and 'whale' in low:
                      try:
                          with open(full, 'r', encoding='utf-8') as jf:
                              figure_meta = json.load(jf)
                      except Exception:
                          pass

          preferred = []
          for kw in ['whale-official-icon.png', 'preview', 'thumb', 'full', 'body', 'idle', 'stand', 'whale', 'icon']:
              for img in whale_images:
                  if kw in img.lower() and img not in preferred:
                      preferred.append(img)

          manifest_data = {
              'files': sorted(files),
              'whaleImages': preferred,
              'figureMeta': figure_meta
          }
          with open(os.path.join(root, 'whale-assets-manifest.json'), 'w', encoding='utf-8') as out:
              json.dump(manifest_data, out, ensure_ascii=False, indent=2)
          print(f"Extracted {len(files)} total files, {len(preferred)} whale textures.")
          PY

      - name: 3. 配置 JDK 17 编译环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. 挂载预装 Android SDK 并签收协议
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: 5. 生成 v5 独立安卓工程（双接口引擎 + 模型拉取 + 全局悬浮窗 + KLWP 状态感知）
        run: |
          python3 - << 'PY'
          import os, textwrap

          base = '/tmp/whale-android'
          java_dir = os.path.join(base, 'app/src/main/java/com/takboo/whalecompanion')
          res_values = os.path.join(base, 'app/src/main/res/values')
          www_dir = os.path.join(base, 'app/src/main/assets/www')
          os.makedirs(java_dir, exist_ok=True)
          os.makedirs(res_values, exist_ok=True)
          os.makedirs(www_dir, exist_ok=True)

          # 1. Gradle 配置文件
          with open(os.path.join(base, 'settings.gradle'), 'w', encoding='utf-8') as f:
              f.write("rootProject.name = 'WhaleCompanionV5'\ninclude ':app'\n")

          with open(os.path.join(base, 'build.gradle'), 'w', encoding='utf-8') as f:
              f.write(textwrap.dedent(r"""
              buildscript {
                  repositories {
                      google()
                      mavenCentral()
                  }
                  dependencies {
                      classpath 'com.android.tools.build:gradle:8.2.2'
                  }
              }
              allprojects {
                  repositories {
                      google()
                      mavenCentral()
                  }
              }
              """).lstrip())

          with open(os.path.join(base, 'gradle.properties'), 'w', encoding='utf-8') as f:
              f.write("android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2048m\n")

          with open(os.path.join(base, 'app/build.gradle'), 'w', encoding='utf-8') as f:
              f.write(textwrap.dedent(r"""
              plugins {
                  id 'com.android.application'
              }
              android {
                  namespace 'com.takboo.whalecompanion'
                  compileSdk 34
                  defaultConfig {
                      applicationId "com.takboo.whalecompanion"
                      minSdk 29
                      targetSdk 34
                      versionCode 5
                      versionName "5.1.0-gemini-openai-floating"
                  }
                  buildTypes {
                      debug {
                          minifyEnabled false
                      }
                  }
                  compileOptions {
                      sourceCompatibility JavaVersion.VERSION_17
                      targetCompatibility JavaVersion.VERSION_17
                  }
              }
              dependencies {
                  implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  implementation 'androidx.appcompat:appcompat:1.6.1'
                  implementation 'androidx.core:core:1.12.0'
                  implementation 'androidx.webkit:webkit:1.9.0'
              }
              """).lstrip())

          # 2. AndroidManifest.xml
          with open(os.path.join(base, 'app/src/main/AndroidManifest.xml'), 'w', encoding='utf-8') as f:
              f.write(textwrap.dedent(r"""
              <?xml version="1.0" encoding="utf-8"?>
              <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                  <uses-permission android:name="android.permission.INTERNET" />
                  <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
                  <uses-permission android:name="android.permission.RECORD_AUDIO" />
                  <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
                  <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
                  <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
                  <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
                  <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
                  <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

                  <application
                      android:allowBackup="true"
                      android:label="大肥鱼全局伴侣"
                      android:usesCleartextTraffic="true"
                      android:theme="@style/Theme.AppCompat.NoActionBar">

                      <activity
                          android:name=".MainActivity"
                          android:exported="true"
                          android:launchMode="singleTask"
                          android:configChanges="orientation|screenSize|keyboardHidden">
                          <intent-filter>
                              <action android:name="android.intent.action.MAIN" />
                              <category android:name="android.intent.category.LAUNCHER" />
                          </intent-filter>
                      </activity>

                      <service
                          android:name=".FloatingOverlayService"
                          android:enabled="true"
                          android:exported="false"
                          android:foregroundServiceType="specialUse">
                          <property
                              android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                              android:value="desktop_pet_companion_overlay" />
                      </service>

                      <service
                          android:name=".SystemAudioCaptureService"
                          android:enabled="true"
                          android:exported="false"
                          android:foregroundServiceType="mediaProjection" />

                      <service
                          android:name=".WhaleNotificationListener"
                          android:label="大肥鱼状态与歌名感知"
                          android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                          android:exported="true">
                          <intent-filter>
                              <action android:name="android.service.notification.NotificationListenerService" />
                          </intent-filter>
                      </service>
                  </application>
              </manifest>
              """).lstrip())

          # 3. WhaleNotificationListener.java
          with open(os.path.join(java_dir, 'WhaleNotificationListener.java'), 'w', encoding='utf-8') as f:
              f.write(textwrap.dedent(r"""
              package com.takboo.whalecompanion;

              import android.app.Notification;
              import android.os.Bundle;
              import android.service.notification.NotificationListenerService;
              import android.service.notification.StatusBarNotification;

              public class WhaleNotificationListener extends NotificationListenerService {
                  public static volatile boolean isConnected = false;
                  public static volatile int missedCallCount = 0;
                  public static volatile int unreadSmsCount = 0;
                  public static volatile int unreadSocialCount = 0;
                  public static volatile String currentSongTitle = "";
                  public static volatile String currentSongArtist = "";
                  private static String lastNotifiedSong = "";

                  @Override
                  public void onListenerConnected() {
                      super.onListenerConnected();
                      isConnected = true;
                      refreshActiveNotifications();
                  }

                  @Override
                  public void onListenerDisconnected() {
                      super.onListenerDisconnected();
                      isConnected = false;
                  }

                  @Override
                  public void onNotificationPosted(StatusBarNotification sbn) {
                      int prevMissed = missedCallCount;
                      refreshActiveNotifications();
                      if (missedCallCount > prevMissed && FloatingOverlayService.instance != null) {
                          FloatingOverlayService.instance.notifyInstantEvent("missed_call", "主人，刚才好像有未接来电哦，要看看是谁打来的吗？");
                      }
                      if (!currentSongTitle.isEmpty() && !currentSongTitle.equals(lastNotifiedSong)) {
                          lastNotifiedSong = currentSongTitle;
                          if (FloatingOverlayService.instance != null) {
                              String songInfo = currentSongTitle + (currentSongArtist.isEmpty() ? "" : " - " + currentSongArtist);
                              FloatingOverlayService.instance.notifySongChanged(songInfo);
                          }
                      }
                  }

                  @Override
                  public void onNotificationRemoved(StatusBarNotification sbn) {
                      refreshActiveNotifications();
                  }

                  public void refreshActiveNotifications() {
                      try {
                          StatusBarNotification[] list = getActiveNotifications();
                          if (list == null) return;
                          int missed = 0;
                          int sms = 0;
                          int social = 0;
                          String song = "";
                          String artist = "";

                          for (StatusBarNotification sbn : list) {
                              String pkg = sbn.getPackageName() != null ? sbn.getPackageName().toLowerCase() : "";
                              Notification n = sbn.getNotification();
                              if (n == null) continue;
                              String cat = n.category != null ? n.category : "";
                              Bundle extras = n.extras;
                              String title = extras != null && extras.getCharSequence(Notification.EXTRA_TITLE) != null
                                      ? extras.getCharSequence(Notification.EXTRA_TITLE).toString() : "";
                              String text = extras != null && extras.getCharSequence(Notification.EXTRA_TEXT) != null
                                      ? extras.getCharSequence(Notification.EXTRA_TEXT).toString() : "";

                              if (extras != null && (extras.containsKey(Notification.EXTRA_MEDIA_SESSION)
                                      || "transport".equals(cat)
                                      || pkg.contains("music") || pkg.contains("spotify") || pkg.contains("netease") || pkg.contains("kugou") || pkg.contains("qqmusic"))) {
                                  if (!title.isEmpty()) {
                                      song = title;
                                      artist = text;
                                  }
                                  continue;
                              }

                              if (Notification.CATEGORY_MISSED_CALL.equals(cat) || (pkg.contains("dialer") || pkg.contains("telecom") || pkg.contains("phone")) && (title.contains("未接") || text.contains("未接") || title.toLowerCase().contains("missed"))) {
                                  missed++;
                              } else if (pkg.contains("mms") || pkg.contains("messaging") || pkg.contains("sms")) {
                                  sms++;
                              } else if (Notification.CATEGORY_MESSAGE.equals(cat) || pkg.contains("tencent.mm") || pkg.contains("mobileqq") || pkg.contains("telegram") || pkg.contains("whatsapp")) {
                                  social++;
                              }
                          }
                          missedCallCount = missed;
                          unreadSmsCount = sms;
                          unreadSocialCount = social;
                          currentSongTitle = song;
                          currentSongArtist = artist;
                      } catch (Exception ignored) {}
                  }
              }
              """).lstrip())

          # 4. DeviceContextHelper.java
          with open(os.path.join(java_dir, 'DeviceContextHelper.java'), 'w', encoding='utf-8') as f:
              f.write(textwrap.dedent(r"""
              package com.takboo.whalecompanion;

              import android.Manifest;
              import android.app.AlarmManager;
              import android.content.Context;
              import android.content.Intent;
              import android.content.IntentFilter;
              import android.content.pm.PackageManager;
              import android.location.Location;
              import android.location.LocationManager;
              import android.os.BatteryManager;
              import androidx.core.content.ContextCompat;
              import org.json.JSONObject;
              import java.text.SimpleDateFormat;
              import java.util.Date;
              import java.util.List;
              import java.util.Locale;

              public class DeviceContextHelper {
                  public static String getDeviceStatusJson(Context ctx) {
                      JSONObject obj = new JSONObject();
                      try {
                          SimpleDateFormat sdf = new SimpleDateFormat("yyyy-MM-dd EEEE HH:mm", Locale.CHINA);
                          obj.put("timeStr", sdf.format(new Date()));

                          IntentFilter ifilter = new IntentFilter(Intent.ACTION_BATTERY_CHANGED);
                          Intent batteryStatus = ctx.registerReceiver(null, ifilter);
                          if (batteryStatus != null) {
                              int level = batteryStatus.getIntExtra(BatteryManager.EXTRA_LEVEL, -1);
                              int scale = batteryStatus.getIntExtra(BatteryManager.EXTRA_SCALE, -1);
                              int pct = (level >= 0 && scale > 0) ? Math.round((level * 100f) / scale) : -1;
                              int status = batteryStatus.getIntExtra(BatteryManager.EXTRA_STATUS, -1);
                              boolean isCharging = status == BatteryManager.BATTERY_STATUS_CHARGING || status == BatteryManager.BATTERY_STATUS_FULL;
                              int tempTenths = batteryStatus.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 0);
                              obj.put("batteryPct", pct);
                              obj.put("isCharging", isCharging);
                              obj.put("batteryTempC", tempTenths / 10.0);
                          }

                          AlarmManager am = (AlarmManager) ctx.getSystemService(Context.ALARM_SERVICE);
                          if (am != null && am.getNextAlarmClock() != null) {
                              long triggerTime = am.getNextAlarmClock().getTriggerTime();
                              SimpleDateFormat alarmFmt = new SimpleDateFormat("EEE HH:mm", Locale.CHINA);
                              obj.put("nextAlarm", alarmFmt.format(new Date(triggerTime)));
                          } else {
                              obj.put("nextAlarm", "未设置");
                          }

                          obj.put("notificationAccess", WhaleNotificationListener.isConnected);
                          obj.put("missedCalls", WhaleNotificationListener.missedCallCount);
                          obj.put("unreadSms", WhaleNotificationListener.unreadSmsCount);
                          obj.put("unreadSocial", WhaleNotificationListener.unreadSocialCount);
                          String song = WhaleNotificationListener.currentSongTitle;
                          if (!WhaleNotificationListener.currentSongArtist.isEmpty()) {
                              song += " - " + WhaleNotificationListener.currentSongArtist;
                          }
                          obj.put("currentSong", song);

                          if (ContextCompat.checkSelfPermission(ctx, Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED) {
                              LocationManager lm = (LocationManager) ctx.getSystemService(Context.LOCATION_SERVICE);
                              if (lm != null) {
                                  List<String> providers = lm.getProviders(true);
                                  Location best = null;
                                  for (String p : providers) {
                                      Location l = lm.getLastKnownLocation(p);
                                      if (l != null && (best == null || l.getAccuracy() < best.getAccuracy())) {
                                          best = l;
                                      }
                                  }
                                  if (best != null) {
                                      obj.put("lat", best.getLatitude());
                                      obj.put("lon", best.getLongitude());
                                  }
                              }
                          }
                      } catch (Exception ignored) {}
                      return obj.toString();
                  }
              }
              """).lstrip())

          # 5. SystemAudioCaptureService.java
          with open(os.path.join(java_dir, 'SystemAudioCaptureService.java'), 'w', encoding='utf-8') as f:
              f.write(textwrap.dedent(r"""
              package com.takboo.whalecompanion;

              import android.app.Activity;
              import android.app.Notification;
              import android.app.NotificationChannel;
              import android.app.NotificationManager;
              import android.app.Service;
              import android.content.Context;
              import android.content.Intent;
              import android.media.AudioAttributes;
              import android.media.AudioFormat;
              import android.media.AudioPlaybackCaptureConfiguration;
              import android.media.AudioRecord;
              import android.media.projection.MediaProjection;
              import android.media.projection.MediaProjectionManager;
              import android.os.Build;
              import android.os.IBinder;
              import android.util.Base64;
              import androidx.core.app.NotificationCompat;
              import java.io.ByteArrayOutputStream;
              import java.nio.ByteBuffer;
              import java.nio.ByteOrder;

              public class SystemAudioCaptureService extends Service {
                  public static final String ACTION_START = "ACTION_START_AUDIO_CAPTURE";
                  public static final String ACTION_STOP = "ACTION_STOP_AUDIO_CAPTURE";
                  public static final String EXTRA_RESULT_DATA = "EXTRA_RESULT_DATA";
                  private static final String CHANNEL_ID = "WhaleAudioCaptureChannel";

                  private MediaProjection mediaProjection;
                  private AudioRecord audioRecord;
                  public static volatile boolean isCapturing = false;
                  private Thread captureThread;
                  public static volatile boolean enableAutoSliceWav = false;

                  @Override
                  public void onCreate() {
                      super.onCreate();
                      createNotificationChannel();
                  }

                  @Override
                  public int onStartCommand(Intent intent, int flags, int startId) {
                      if (intent == null) return START_NOT_STICKY;
                      String action = intent.getAction();
                      if (ACTION_STOP.equals(action)) {
                          stopCapture();
                          stopSelf();
                          return START_NOT_STICKY;
                      }
                      if (ACTION_START.equals(action)) {
                          Notification notification = new NotificationCompat.Builder(this, CHANNEL_ID)
                                  .setContentTitle("大肥鱼正在倾听系统声音")
                                  .setContentText("音乐节奏律动与视频伴侣已激活")
                                  .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                                  .setPriority(NotificationCompat.PRIORITY_LOW)
                                  .build();
                          startForeground(1002, notification);

                          Intent data = intent.getParcelableExtra(EXTRA_RESULT_DATA);
                          if (data != null) {
                              startAudioPlaybackCapture(data);
                          }
                      }
                      return START_STICKY;
                  }

                  private void startAudioPlaybackCapture(Intent projectionData) {
                      try {
                          MediaProjectionManager mpm = (MediaProjectionManager) getSystemService(Context.MEDIA_PROJECTION_SERVICE);
                          mediaProjection = mpm.getMediaProjection(Activity.RESULT_OK, projectionData);
                          if (mediaProjection == null) return;

                          AudioPlaybackCaptureConfiguration config = new AudioPlaybackCaptureConfiguration.Builder(mediaProjection)
                                  .addMatchingUsage(AudioAttributes.USAGE_MEDIA)
                                  .addMatchingUsage(AudioAttributes.USAGE_GAME)
                                  .addMatchingUsage(AudioAttributes.USAGE_UNKNOWN)
                                  .build();

                          int sampleRate = 16000;
                          int bufferSize = Math.max(
                                  AudioRecord.getMinBufferSize(sampleRate, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT),
                                  sampleRate * 2
                          );

                          AudioFormat format = new AudioFormat.Builder()
                                  .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                                  .setSampleRate(sampleRate)
                                  .setChannelMask(AudioFormat.CHANNEL_IN_MONO)
                                  .build();

                          audioRecord = new AudioRecord.Builder()
                                  .setAudioFormat(format)
                                  .setBufferSizeInBytes(bufferSize)
                                  .setAudioPlaybackCaptureConfig(config)
                                  .build();

                          audioRecord.startRecording();
                          isCapturing = true;
                          if (FloatingOverlayService.instance != null) {
                              FloatingOverlayService.instance.dispatchSystemAudioStatus(true, "已开启系统声音律动");
                          }

                          captureThread = new Thread(() -> {
                              short[] readBuffer = new short[1600];
                              ByteArrayOutputStream pcmAccumulator = new ByteArrayOutputStream();
                              double avgEnergy = 0.02;
                              int activeFrames = 0;

                              while (isCapturing && audioRecord != null) {
                                  int read = audioRecord.read(readBuffer, 0, readBuffer.length);
                                  if (read > 0) {
                                      long sumSq = 0;
                                      for (int i = 0; i < read; i++) {
                                          sumSq += (long) readBuffer[i] * readBuffer[i];
                                      }
                                      double rms = Math.sqrt((double) sumSq / read) / 32768.0;
                                      boolean isBeat = rms > 0.035 && rms > avgEnergy * 1.45;
                                      avgEnergy = avgEnergy * 0.85 + rms * 0.15;

                                      if (FloatingOverlayService.instance != null) {
                                          FloatingOverlayService.instance.dispatchSystemAudioBeat(Math.min(1.0, rms * 4.5), isBeat);
                                      }

                                      if (enableAutoSliceWav) {
                                          if (rms > 0.015) {
                                              activeFrames++;
                                              ByteBuffer bb = ByteBuffer.allocate(read * 2).order(ByteOrder.LITTLE_ENDIAN);
                                              for (int i = 0; i < read; i++) bb.putShort(readBuffer[i]);
                                              pcmAccumulator.write(bb.array(), 0, read * 2);
                                          }
                                          if (activeFrames >= 60) {
                                              byte[] pcmBytes = pcmAccumulator.toByteArray();
                                              pcmAccumulator.reset();
                                              activeFrames = 0;
                                              String b64 = Base64.encodeToString(buildWavHeader(pcmBytes, sampleRate), Base64.NO_WRAP);
                                              if (FloatingOverlayService.instance != null) {
                                                  FloatingOverlayService.instance.dispatchSystemAudioWav(b64);
                                              }
                                          }
                                      } else {
                                          pcmAccumulator.reset();
                                          activeFrames = 0;
                                      }
                                  }
                              }
                          }, "WhaleSystemAudioThread");
                          captureThread.start();
                      } catch (Exception ignored) {}
                  }

                  private byte[] buildWavHeader(byte[] pcmData, int sampleRate) {
                      int totalDataLen = pcmData.length + 36;
                      long byteRate = sampleRate * 2;
                      ByteBuffer header = ByteBuffer.allocate(44 + pcmData.length).order(ByteOrder.LITTLE_ENDIAN);
                      header.put("RIFF".getBytes());
                      header.putInt(totalDataLen);
                      header.put("WAVE".getBytes());
                      header.put("fmt ".getBytes());
                      header.putInt(16);
                      header.putShort((short) 1);
                      header.putShort((short) 1);
                      header.putInt(sampleRate);
                      header.putInt((int) byteRate);
                      header.putShort((short) 2);
                      header.putShort((short) 16);
                      header.put("data".getBytes());
                      header.putInt(pcmData.length);
                      header.put(pcmData);
                      return header.array();
                  }

                  private void stopCapture() {
                      isCapturing = false;
                      try {
                          if (audioRecord != null) {
                              audioRecord.stop();
                              audioRecord.release();
                              audioRecord = null;
                          }
                          if (mediaProjection != null) {
                              mediaProjection.stop();
                              mediaProjection = null;
                          }
                      } catch (Exception ignored) {}
                      if (FloatingOverlayService.instance != null) {
                          FloatingOverlayService.instance.dispatchSystemAudioStatus(false, "已关闭系统声音律动");
                      }
                  }

                  @Override
                  public void onDestroy() {
                      stopCapture();
                      super.onDestroy();
                  }

                  @Override
                  public IBinder onBind(Intent intent) {
                      return null;
                  }

                  private void createNotificationChannel() {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          NotificationChannel channel = new NotificationChannel(
                                  CHANNEL_ID, "大肥鱼系统声音内录", NotificationManager.IMPORTANCE_LOW);
                          NotificationManager nm = getSystemService(NotificationManager.class);
                          if (nm != null) nm.createNotificationChannel(channel);
                      }
                  }
              }
