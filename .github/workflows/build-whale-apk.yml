                  private void snapPetToNearestEdge() {
                      DisplayMetrics dm = getResources().getDisplayMetrics();
                      screenWidth = dm.widthPixels;
                      screenHeight = dm.heightPixels;

                      int centerX = petParams.x + petParams.width / 2;
                      int centerY = petParams.y + petParams.height / 2;

                      int distLeft = centerX;
                      int distRight = screenWidth - centerX;
                      int distBottom = screenHeight - centerY;

                      if (distBottom < dp(95) && distBottom <= distLeft && distBottom <= distRight) {
                          dockEdge = "bottom";
                          anchorX = Math.max(dp(16), Math.min(screenWidth - dp(petSizeDp) - dp(16), petParams.x));
                          anchorY = screenHeight - dp(petSizeDp);
                      } else if (distLeft <= distRight) {
                          dockEdge = "left";
                          anchorX = 0;
                          anchorY = Math.max(dp(48), Math.min(screenHeight - dp(petSizeDp) - dp(48), petParams.y));
                      } else {
                          dockEdge = "right";
                          anchorX = screenWidth - dp(petSizeDp);
                          anchorY = Math.max(dp(48), Math.min(screenHeight - dp(petSizeDp) - dp(48), petParams.y));
                      }

                      getSharedPreferences("whale_native_prefs", MODE_PRIVATE).edit()
                              .putString("dockEdge", dockEdge)
                              .putInt("anchorX", anchorX)
                              .putInt("anchorY", anchorY)
                              .apply();

