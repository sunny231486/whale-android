              import android.provider.Settings;
              import android.webkit.JavascriptInterface;
              import android.webkit.WebResourceRequest;
              import android.webkit.WebResourceResponse;
              import android.webkit.WebSettings;
              import android.webkit.WebView;
              import android.webkit.WebViewClient;
              import androidx.appcompat.app.AppCompatActivity;
              import androidx.core.app.ActivityCompat;
              import androidx.webkit.WebViewAssetLoader;

              public class MainActivity extends AppCompatActivity {
                  private static final int REQ_MEDIA_PROJECTION = 2001;
                  private static final int REQ_PERMS = 2002;
                  private static final int REQ_OVERLAY = 2003;
                  private WebView controlWebView;

                  @Override
                  protected void onCreate(Bundle savedInstanceState) {
                      super.onCreate(savedInstanceState);
                      controlWebView = new WebView(this);
                      setContentView(controlWebView);

                      WebSettings s = controlWebView.getSettings();
                      s.setJavaScriptEnabled(true);
                      s.setDomStorageEnabled(true);

                      final WebViewAssetLoader assetLoader = new WebViewAssetLoader.Builder()
                              .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                              .build();

                      controlWebView.setWebViewClient(new WebViewClient() {
                          @Override
                          public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                              return assetLoader.shouldInterceptRequest(request.getUrl());
                          }
                      });

                      controlWebView.addJavascriptInterface(new MainControlBridge(), "MainBridge");
                      requestBasePermissions();
                      controlWebView.loadUrl("https://appassets.androidplatform.net/assets/www/control-panel.html");
                  }

                  @Override
                  protected void onResume() {
                      super.onResume();
                      if (controlWebView != null) {
                          controlWebView.evaluateJavascript("window.refreshDashboard && window.refreshDashboard();", null);
                      }
                  }

                  private void requestBasePermissions() {
                      String[] perms = new String[]{
                              Manifest.permission.RECORD_AUDIO,
                              Manifest.permission.ACCESS_COARSE_LOCATION,
                              Manifest.permission.ACCESS_FINE_LOCATION
                      };
                      ActivityCompat.requestPermissions(this, perms, REQ_PERMS);
                  }

                  @Override
                  protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                      super.onActivityResult(requestCode, resultCode, data);
                      if (requestCode == REQ_OVERLAY) {
                          if (Settings.canDrawOverlays(this)) {
                              startFloatingService();
                          }
                          if (controlWebView != null) {
                              controlWebView.evaluateJavascript("window.refreshDashboard && window.refreshDashboard();", null);
                          }
                      } else if (requestCode == REQ_MEDIA_PROJECTION) {
                          if (resultCode == Activity.RESULT_OK && data != null) {
                              Intent serviceIntent = new Intent(this, SystemAudioCaptureService.class);
                              serviceIntent.setAction(SystemAudioCaptureService.ACTION_START);
                              serviceIntent.putExtra(SystemAudioCaptureService.EXTRA_RESULT_DATA, data);
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  startForegroundService(serviceIntent);
                              } else {
                                  startService(serviceIntent);
                              }
                          }
                      }
                  }

                  private void startFloatingService() {
                      Intent i = new Intent(this, FloatingOverlayService.class);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(i);
                      } else {
                          startService(i);
                      }
                  }

                  public class MainControlBridge {
                      @JavascriptInterface
                      public boolean canDrawOverlays() {
                          return Settings.canDrawOverlays(MainActivity.this);
                      }

                      @JavascriptInterface
                      public boolean isOverlayRunning() {
                          return FloatingOverlayService.instance != null;
                      }

                      @JavascriptInterface
                      public void toggleFloatingOverlay() {
                          runOnUiThread(() -> {
                              if (!Settings.canDrawOverlays(MainActivity.this)) {
                                  Intent intent = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                          Uri.parse("package:" + getPackageName()));
                                  startActivityForResult(intent, REQ_OVERLAY);
                                  return;
                              }
                              if (FloatingOverlayService.instance != null) {
                                  stopService(new Intent(MainActivity.this, FloatingOverlayService.class));
                              } else {
                                  startFloatingService();
                              }
                              controlWebView.postDelayed(() ->
                                      controlWebView.evaluateJavascript("window.refreshDashboard && window.refreshDashboard();", null), 400);
                          });
                      }

                      @JavascriptInterface
                      public void openNotificationAccessSettings() {
                          Intent intent = new Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS);
                          startActivity(intent);
                      }

                      @JavascriptInterface
                      public void toggleSystemAudioCapture(boolean autoSliceWav) {
                          runOnUiThread(() -> {
                              if (SystemAudioCaptureService.isCapturing) {
                                  Intent stopIntent = new Intent(MainActivity.this, SystemAudioCaptureService.class);
                                  stopIntent.setAction(SystemAudioCaptureService.ACTION_STOP);
                                  startService(stopIntent);
                              } else {
                                  SystemAudioCaptureService.enableAutoSliceWav = autoSliceWav;
                                  MediaProjectionManager mpm = (MediaProjectionManager) getSystemService(Context.MEDIA_PROJECTION_SERVICE);
                                  if (mpm != null) {
                                      startActivityForResult(mpm.createScreenCaptureIntent(), REQ_MEDIA_PROJECTION);
                                  }
                              }
                          });
                      }

                      @JavascriptInterface
                      public String getDeviceStatusJson() {
                          return DeviceContextHelper.getDeviceStatusJson(MainActivity.this);
                      }

                      @JavascriptInterface
                      public void notifyConfigSaved() {
                          if (FloatingOverlayService.instance != null) {
                              FloatingOverlayService.instance.reloadConfigFromMain();
                          }
                      }

                      @JavascriptInterface
                      public void triggerTestContextGreeting() {
                          if (FloatingOverlayService.instance != null) {
                              FloatingOverlayService.instance.evalJs("window.triggerHalfHourContextChat && window.triggerHalfHourContextChat(true);");
                          }
                      }
                  }
              }
