                  <button class="btn secondary" style="margin-top:0; margin-bottom:12px;" onclick="MainBridge.resetCustomSprites()">🔄 恢复默认大肥鱼贴图</button>
                  <div class="field">
                    <label><span>桌宠大小（32dp ~ 150dp）</span><b id="lbl-size" style="color:#38bdf8;">58 dp</b></label>
                    <input type="range" id="cfg-size" min="32" max="150" step="2" value="58" oninput="onSizeSliderChange(this.value)" />
