                          } else if (Intent.ACTION_POWER_CONNECTED.equals(act)) {
                              notifyInstantEvent("power_connected", "哇！充上电啦⚡ 能量源源不断涌进来咯～");
                          } else if (Intent.ACTION_POWER_DISCONNECTED.equals(act)) {
                              notifyInstantEvent("power_disconnected", "拔掉充电线啦，今天也要元气满满地出发哦！");
                          } else if (Intent.ACTION_BATTERY_LOW.equals(act)) {
