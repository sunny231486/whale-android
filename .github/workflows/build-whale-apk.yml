                        role: 'system',
                        position: 'top',
                        content: '你将扮演住在用户手机屏幕边缘的桌面宠物「{{char}}」与「{{user}}」互动。直接输出{{char}}说的台词，不要输出任何动作括号描写、心理活动或思考过程。'
                      },
                      {
                        id: 'char_card',
                        name: '2. 角色设定卡 (Character Card)',
                        enabled: true,
                        role: 'system',
                        position: 'top',
                        content: '{{char}}是一只蓝白配色的小鲸鱼娘（大肥鱼），性格灵动粘人、温柔俏皮，偶尔爱吐槽。称呼{{user}}为“主人”。'
                      },
                      {
                        id: 'user_persona',
                        name: '3. 用户人设 (User Persona)',
                        enabled: true,
                        role: 'system',
                        position: 'top',
                        content: '{{user}}是{{char}}最信赖的伙伴，日常带着手机听歌、看视频、聊天。'
                      },
                      {
                        id: 'world_info_phone',
                        name: '4. 世界书：手机状态与音乐注入 (World Info)',
                        enabled: true,
                        role: 'system',
                        position: 'top',
                        content: '【当前手机实时状态】时间:{{time}} | 电量:{{battery}} | 天气:{{weather}} | 闹钟:{{alarm}} | 通知:{{notifications}} | 正在播放音乐:{{song}}。仅在话题相关或主动关怀时自然提及。'
                      },
                      {
                        id: 'post_history_jb',
                        name: '5. 尾置强约束 (Post-History 秒回短句约束)',
                        enabled: true,
                        role: 'system',
                        position: 'bottom',
                        content: '[输出铁律：严禁输出思维链，直接用口语回复1~2句话，总字数严格控制在55字以内！]'
                      }
                    ]
                  };

                  const DEFAULT_CFG = {
                    apiProvider: 'gemini',
                    geminiBaseUrl: 'https://generativelanguage.googleapis.com/v1beta',
                    geminiApiKey: '',
                    geminiModel: 'gemini-2.5-flash',
                    baseUrl: 'https://api.deepseek.com/v1',
                    apiKey: '',
                    model: 'deepseek-chat',
                    asrModel: 'FunAudioLLM/SenseVoiceSmall',
                    petSizeDp: 58,
                    fontScale: 100,
                    colorScheme: 'deepseek_blue',
                    cityFallback: 'Shanghai',
                    autoVideoComment: false,
                    userName: '主人',
                    charName: '大肥鱼',
                    tavernPreset: DEFAULT_TAVERN_PRESET
                  };

                  let currentProvider = 'gemini';
                  let currentEntries = JSON.parse(JSON.stringify(DEFAULT_TAVERN_PRESET.entries));

                  window.onCustomSpriteChanged = function() {
                    if (!window.MainBridge) return;
                    const ts = Date.now();
                    const hasIdle = window.MainBridge.hasCustomSprite('idle');
                    const hasTalk = window.MainBridge.hasCustomSprite('talk');
                    const idleImg = document.getElementById('prev-idle-img');
                    const talkImg = document.getElementById('prev-talk-img');
                    const topAvatar = document.getElementById('top-avatar-img');

                    if (hasIdle) {
                      const url = 'https://appassets.androidplatform.net/custom_sprites/custom_idle.dat?t=' + ts;
                      idleImg.src = url;
                      topAvatar.src = url;
                      document.getElementById('lbl-idle-status').textContent = '✅ 已启用自定义贴图';
                    } else {
                      idleImg.src = 'whale-official-icon.png';
                      topAvatar.src = 'whale-official-icon.png';
                      document.getElementById('lbl-idle-status').textContent = '当前：默认大肥鱼';
                    }

                    if (hasTalk) {
                      talkImg.src = 'https://appassets.androidplatform.net/custom_sprites/custom_talk.dat?t=' + ts;
                      document.getElementById('lbl-talk-status').textContent = '✅ 已启用说话差分图';
                    } else {
                      talkImg.src = hasIdle ? idleImg.src : 'whale-official-icon.png';
                      document.getElementById('lbl-talk-status').textContent = '说话差分：未设置(可选)';
                    }
                  };

                  function renderTavernEntries() {
                    const box = document.getElementById('st-entries-container');
                    box.innerHTML = '';
                    currentEntries.forEach((entry, idx) => {
                      const div = document.createElement('div');
                      div.className = 'st-entry';
                      div.innerHTML = `
                        <div class="st-entry-head">
                          <span>${entry.name}</span>
                          <label style="display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#38bdf8;">
                            <input type="checkbox" ${entry.enabled ? 'checked' : ''} onchange="toggleEntry(${idx}, this.checked)" /> 启用
                          </label>
                        </div>
                        <textarea rows="2" style="width:100%;padding:7px;border-radius:8px;background:#0f172a;color:#f8fafc;border:1px solid rgba(255,255,255,0.14);font-size:12px;" oninput="updateEntryContent(${idx}, this.value)">${entry.content}</textarea>
                      `;
                      box.appendChild(div);
                    });
                  }

                  window.toggleEntry = function(idx, checked) {
                    currentEntries[idx].enabled = checked;
                    saveAllConfig(false);
                  };

                  window.updateEntryContent = function(idx, val) {
                    currentEntries[idx].content = val;
                    saveAllConfig(false);
                  };

                  window.onSizeSliderChange = function(val) {
                    document.getElementById('lbl-size').textContent = val + ' dp';
                    saveAllConfig(false);
                  };

                  function switchProviderTab(provider) {
                    currentProvider = provider;
                    document.getElementById('tab-gemini').classList.toggle('active', provider === 'gemini');
                    document.getElementById('tab-openai').classList.toggle('active', provider === 'openai');
                    document.getElementById('panel-gemini').style.display = provider === 'gemini' ? 'block' : 'none';
                    document.getElementById('panel-openai').style.display = provider === 'openai' ? 'block' : 'none';
                    saveAllConfig(false);
                  }

                  function showConnectStatus(msg, isError) {
                    const el = document.getElementById('connect-status');
                    el.style.display = 'block';
                    el.style.color = isError ? '#f87171' : '#4ade80';
                    el.textContent = msg;
                  }

                  async function connectAndFetchModels(provider) {
                    showConnectStatus('⏳ 正在连接并拉取可用模型列表...', false);
                    try {
                      if (provider === 'gemini') {
                        const key = document.getElementById('cfg-gemini-key').value.trim();
                        const base = (document.getElementById('cfg-gemini-url').value.trim() || DEFAULT_CFG.geminiBaseUrl).replace(/\/$/, '');
                        if (!key) { showConnectStatus('❌ 请先填写 Google AI Studio API Key', true); return; }
                        const res = await fetch(`${base}/models?pageSize=100&key=${encodeURIComponent(key)}`);
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        const data = await res.json();
                        const models = (data.models || []).filter(m =>
                          Array.isArray(m.supportedGenerationMethods) && m.supportedGenerationMethods.includes('generateContent')
                        );
                        if (models.length === 0) throw new Error('未找到可用模型');
                        const sel = document.getElementById('sel-gemini-models');
                        sel.innerHTML = '';
                        models.forEach(m => {
                          const id = (m.name || '').replace(/^models\//, '');
                          const opt = document.createElement('option');
                          opt.value = id;
                          opt.textContent = m.displayName ? `${id} (${m.displayName})` : id;
                          sel.appendChild(opt);
                        });
                        sel.selectedIndex = 0;
                        document.getElementById('cfg-gemini-model').value = sel.value;
                        saveAllConfig(false);
                        showConnectStatus(`✅ 连接成功！已拉取 ${models.length} 个 Gemini 模型。`, false);
                      } else {
                        const key = document.getElementById('cfg-api-key').value.trim();
                        const base = (document.getElementById('cfg-base-url').value.trim() || DEFAULT_CFG.baseUrl).replace(/\/$/, '');
                        if (!key) { showConnectStatus('❌ 请先填写 API Key', true); return; }
                        const res = await fetch(`${base}/models`, {
                          method: 'GET',
                          headers: { 'Authorization': `Bearer ${key}` }
                        });
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        const data = await res.json();
                        const list = Array.isArray(data.data) ? data.data : (Array.isArray(data.models) ? data.models : []);
                        if (list.length === 0) throw new Error('模型列表为空');
                        const sel = document.getElementById('sel-openai-models');
                        sel.innerHTML = '';
                        list.forEach(item => {
                          const id = item.id || item.name || String(item);
                          const opt = document.createElement('option');
                          opt.value = id;
                          opt.textContent = id;
                          sel.appendChild(opt);
                        });
                        sel.selectedIndex = 0;
                        document.getElementById('cfg-model').value = sel.value;
                        saveAllConfig(false);
                        showConnectStatus(`✅ 连接成功！已拉取 ${list.length} 个模型。`, false);
                      }
                    } catch (err) {
                      showConnectStatus(`❌ 拉取失败 (${err.message})`, true);
                    }
                  }

                  window.exportTavernPreset = function() {
                    const presetJson = JSON.stringify({
                      thinkingBudget: parseInt(document.getElementById('st-thinking').value, 10),
                      temperature: parseFloat(document.getElementById('st-temp').value) || 0.85,
                      maxTokens: parseInt(document.getElementById('st-max-tokens').value, 10) || 140,
                      entries: currentEntries
                    }, null, 2);
                    prompt('复制下方酒馆预设 JSON 进行备份或分享：', presetJson);
                  };

                  window.importTavernPreset = function() {
                    const raw = prompt('请粘贴酒馆预设 JSON：');
                    if (!raw) return;
                    try {
                      const obj = JSON.parse(raw);
                      if (Array.isArray(obj.entries)) {
                        currentEntries = obj.entries;
                        renderTavernEntries();
                      }
                      if (typeof obj.thinkingBudget === 'number') document.getElementById('st-thinking').value = String(obj.thinkingBudget);
                      if (typeof obj.temperature === 'number') document.getElementById('st-temp').value = String(obj.temperature);
                      if (typeof obj.maxTokens === 'number') document.getElementById('st-max-tokens').value = String(obj.maxTokens);
                      saveAllConfig(true);
                    } catch (e) {
                      alert('JSON 格式不正确：' + e.message);
                    }
                  };

                  function loadForm() {
                    let cfg = Object.assign({}, DEFAULT_CFG, JSON.parse(localStorage.getItem('whale_v6_cfg') || '{}'));
                    document.getElementById('cfg-gemini-key').value = cfg.geminiApiKey || '';
                    document.getElementById('cfg-gemini-url').value = cfg.geminiBaseUrl || DEFAULT_CFG.geminiBaseUrl;
                    document.getElementById('cfg-gemini-model').value = cfg.geminiModel || DEFAULT_CFG.geminiModel;
                    document.getElementById('cfg-base-url').value = cfg.baseUrl || DEFAULT_CFG.baseUrl;
                    document.getElementById('cfg-api-key').value = cfg.apiKey || '';
                    document.getElementById('cfg-model').value = cfg.model || DEFAULT_CFG.model;
                    document.getElementById('cfg-size').value = cfg.petSizeDp || 58;
                    document.getElementById('lbl-size').textContent = (cfg.petSizeDp || 58) + ' dp';
                    document.getElementById('cfg-font').value = String(cfg.fontScale || 100);
                    document.getElementById('cfg-scheme').value = cfg.colorScheme || 'deepseek_blue';
                    document.getElementById('cfg-city').value = cfg.cityFallback || 'Shanghai';
                    document.getElementById('cfg-char-name').value = cfg.charName || '大肥鱼';
                    document.getElementById('cfg-user-name').value = cfg.userName || '主人';

                    const preset = cfg.tavernPreset || DEFAULT_TAVERN_PRESET;
                    document.getElementById('st-thinking').value = String(preset.thinkingBudget ?? 0);
                    document.getElementById('st-temp').value = String(preset.temperature ?? 0.85);
                    document.getElementById('st-max-tokens').value = String(preset.maxTokens ?? 140);
                    if (Array.isArray(preset.entries) && preset.entries.length > 0) {
                      currentEntries = preset.entries;
                    }
                    renderTavernEntries();
                    switchProviderTab(cfg.apiProvider || 'gemini');
                    onCustomSpriteChanged();
                  }

                  function saveAllConfig(showAlert) {
                    const sizeDp = parseInt(document.getElementById('cfg-size').value, 10) || 58;
                    const cfg = {
                      apiProvider: currentProvider,
                      geminiBaseUrl: document.getElementById('cfg-gemini-url').value.trim() || DEFAULT_CFG.geminiBaseUrl,
                      geminiApiKey: document.getElementById('cfg-gemini-key').value.trim(),
                      geminiModel: document.getElementById('cfg-gemini-model').value.trim() || DEFAULT_CFG.geminiModel,
                      baseUrl: document.getElementById('cfg-base-url').value.trim() || DEFAULT_CFG.baseUrl,
                      apiKey: document.getElementById('cfg-api-key').value.trim(),
                      model: document.getElementById('cfg-model').value.trim() || DEFAULT_CFG.model,
                      petSizeDp: sizeDp,
                      fontScale: parseInt(document.getElementById('cfg-font').value, 10) || 100,
                      colorScheme: document.getElementById('cfg-scheme').value,
                      cityFallback: document.getElementById('cfg-city').value.trim() || 'Shanghai',
                      charName: document.getElementById('cfg-char-name').value.trim() || '大肥鱼',
                      userName: document.getElementById('cfg-user-name').value.trim() || '主人',
                      tavernPreset: {
                        thinkingBudget: parseInt(document.getElementById('st-thinking').value, 10),
                        temperature: parseFloat(document.getElementById('st-temp').value) || 0.85,
                        topP: 0.95,
                        maxTokens: parseInt(document.getElementById('st-max-tokens').value, 10) || 140,
                        contextDepth: 6,
                        entries: currentEntries
                      }
                    };
                    localStorage.setItem('whale_v6_cfg', JSON.stringify(cfg));
                    if (window.MainBridge) {
                      window.MainBridge.notifyConfigSaved(sizeDp);
                    }
                    if (showAlert) {
                      alert('设置已保存并实时同步给悬浮桌宠！');
                    }
                  }

                  function toggleSysAudio() {
                    if (window.MainBridge) {
                      window.MainBridge.toggleSystemAudioCapture(false);
                    }
                  }

                  window.refreshDashboard = function() {
                    if (!window.MainBridge) return;
                    const running = window.MainBridge.isOverlayRunning();
                    const canDraw = window.MainBridge.canDrawOverlays();
                    const badge = document.getElementById('overlay-badge');
                    const btn = document.getElementById('btn-toggle-overlay');

                    if (running) {
                      badge.textContent = '● 悬浮球运行中';
                      badge.style.color = '#4ade80';
                      btn.textContent = '关闭全局悬浮桌宠';
                    } else if (!canDraw) {
                      badge.textContent = '○ 需授予悬浮窗权限';
                      badge.style.color = '#facc15';
                      btn.textContent = '点击授予悬浮窗权限并启动';
                    } else {
                      badge.textContent = '○ 未启动';
                      badge.style.color = '#94a3b8';
                      btn.textContent = '启动全局悬浮桌宠';
                    }

                    try {
                      const st = JSON.parse(window.MainBridge.getDeviceStatusJson() || '{}');
                      document.getElementById('st-battery').textContent = `${st.batteryPct ?? '--'}% (${st.isCharging ? '⚡充电中' : '未充电'} · ${st.batteryTempC ?? '--'}°C)`;
                      document.getElementById('st-alarm').textContent = st.nextAlarm || '未设置';
                      document.getElementById('st-calls-sms').textContent = st.notificationAccess
                        ? `${st.missedCalls || 0} 个未接 / ${st.unreadSms || 0} 条短信`
                        : '请点击上方授权通知监听';
                      document.getElementById('st-social').textContent = st.notificationAccess
                        ? `${st.unreadSocial || 0} 条未读消息`
                        : '未授权通知监听';
                      document.getElementById('st-song').textContent = st.currentSong
                        ? `${st.currentSong} ${st.musicApp ? '(' + st.musicApp + ')' : ''}`
                        : '暂无音乐播放';
                    } catch (_) {}
                  };

                  loadForm();
                  refreshDashboard();
                  setInterval(refreshDashboard, 3000);
                </script>
              </body>
              </html>
              """).lstrip())
          print("WhaleCompanion v7 generated successfully.")
          PY

      - name: 6. 安装匹配的 Gradle 8.5 环境
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: 7. 使用 Gradle 编译生成安卓 APK
        working-directory: /tmp/whale-android
        run: |
          gradle assembleDebug --no-daemon

      - name: 8. 上传编译好的安卓 APK 安装包
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Whale-Android-APK-v7
          path: /tmp/whale-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
