              <!DOCTYPE html>
              <html lang="zh-CN">
              <head>
                <meta charset="UTF-8" />
                <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
                <style>
                  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
                  html, body {
                    width: 100vw; height: 100vh; overflow: hidden;
                    background: transparent !important;
                  }
                  #sprite-wrap {
                    width: 100vw; height: 100vh; position: relative;
                    display: flex; align-items: center; justify-content: center;
                    transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
                  }
                  body.pose-peek.edge-right #sprite-wrap {
                    transform: translateX(32%) rotate(-24deg);
                  }
                  body.pose-peek.edge-left #sprite-wrap {
                    transform: translateX(-32%) rotate(24deg);
                  }
                  body.pose-peek.edge-bottom #sprite-wrap {
                    transform: translateY(34%);
                  }
                  body.pose-active #sprite-wrap {
                    transform: translate(0, 0) rotate(0deg);
                  }
                  canvas, #custom-gif-img {
                    width: 100%; height: 100%; display: block; object-fit: contain;
                  }
                  #custom-gif-img {
                    display: none;
                  }
                  #mood-badge {
                    position: absolute; top: 2px; right: 2px; font-size: 16px; pointer-events: none;
                  }
                </style>
              </head>
              <body class="pose-peek edge-right">
                <div id="sprite-wrap">
                  <canvas id="pet-canvas" width="256" height="256"></canvas>
                  <img id="custom-gif-img" alt="pet" />
                  <div id="mood-badge"></div>
                </div>
                <script>
                  const COLOR_SCHEMES = {
                    'deepseek_blue': 'none',
                    'claude_amber': 'hue-rotate(155deg) saturate(1.15)',
                    'sakura_pink': 'hue-rotate(110deg) saturate(1.25)',
                    'mint_emerald': 'hue-rotate(310deg) saturate(1.1)',
                    'violet_dream': 'hue-rotate(55deg) saturate(1.2)',
                    'sunset_coral': 'hue-rotate(135deg) saturate(1.3)',
                    'cyber_cyan': 'hue-rotate(340deg) saturate(1.35)',
                    'moonlight_silver': 'grayscale(0.65) brightness(1.12)'
                  };

                  let officialImg = new Image();
                  let hasOfficial = false;
                  officialImg.onload = () => { hasOfficial = true; };
                  officialImg.src = 'whale-official-icon.png';

                  let customIdleImg = new Image();
                  let hasCustomIdle = false;
                  let customTalkImg = new Image();
                  let hasCustomTalk = false;

                  let state = {
                    tick: 0,
                    bounce: 0,
                    mouth: 0,
                    mood: 'calm'
                  };

                  window.reloadSpriteConfig = function(forceReloadImg) {
                    try {
                      const cfg = JSON.parse(localStorage.getItem('whale_v6_cfg') || '{}');
                      document.getElementById('sprite-wrap').style.filter = COLOR_SCHEMES[cfg.colorScheme] || 'none';
                    } catch (_) {}

                    if (window.OverlayBridge) {
                      const idleExists = window.OverlayBridge.hasCustomSprite('idle');
                      const talkExists = window.OverlayBridge.hasCustomSprite('talk');
                      const ts = Date.now();
                      if (idleExists) {
                        customIdleImg = new Image();
                        customIdleImg.onload = () => { hasCustomIdle = true; };
                        customIdleImg.src = 'https://appassets.androidplatform.net/custom_sprites/custom_idle.dat?t=' + ts;
                        // 同步给 GIF <img> 标签以支持动态 GIF/WebP 帧播放
                        const gifEl = document.getElementById('custom-gif-img');
                        gifEl.src = customIdleImg.src;
                      } else {
                        hasCustomIdle = false;
                      }
                      if (talkExists) {
                        customTalkImg = new Image();
                        customTalkImg.onload = () => { hasCustomTalk = true; };
                        customTalkImg.src = 'https://appassets.androidplatform.net/custom_sprites/custom_talk.dat?t=' + ts;
                      } else {
                        hasCustomTalk = false;
                      }
                    }
                  };

                  window.setPetPose = function(pose, edge) {
                    document.body.className = 'pose-' + (pose || 'peek') + ' edge-' + (edge || 'right');
                    state.bounce = 0.85;
                  };

                  window.triggerPetBounce = function() {
                    state.bounce = 0.85;
                    state.mood = 'happy';
                  };

                  window.setPetMood = function(mood, mouthVal) {
                    if (mood) state.mood = mood;
                    if (typeof mouthVal === 'number') state.mouth = mouthVal;
                  };

                  window.onSystemAudioBeat = function(rms, isBeat) {
                    if (rms > 0.04) {
                      state.mood = 'dancing';
                      if (isBeat) state.bounce = Math.min(0.85, rms * 1.1);
                    } else if (state.mood === 'dancing') {
                      state.mood = 'calm';
                    }
                  };

                  const canvas = document.getElementById('pet-canvas');
                  const ctx = canvas.getContext('2d');

                  function draw() {
                    state.tick += 0.07;
                    ctx.clearRect(0, 0, 256, 256);
                    ctx.save();

                    const dy = Math.sin(state.tick) * 4 - state.bounce * 20;
                    const rot = state.mood === 'dancing'
                      ? Math.sin(state.tick * 3.5) * 0.14
                      : Math.sin(state.tick * 0.8) * 0.04;

                    ctx.translate(128, 132 + dy);
                    ctx.rotate(rot);

                    const sx = 1 + state.bounce * 0.12;
                    const sy = 1 - state.bounce * 0.10;
                    ctx.scale(sx, sy);

                    // 优先绘制用户自定义贴图（如果正在说话且上传了张嘴差分贴图，自动切换为张嘴贴图！）
                    let activeImg = null;
                    if (state.mouth > 0.1 && hasCustomTalk && customTalkImg.complete && customTalkImg.naturalWidth > 0) {
                      activeImg = customTalkImg;
                    } else if (hasCustomIdle && customIdleImg.complete && customIdleImg.naturalWidth > 0) {
                      activeImg = customIdleImg;
                    } else if (hasOfficial && officialImg.complete && officialImg.naturalWidth > 0) {
                      activeImg = officialImg;
                    }

                    if (activeImg) {
                      ctx.drawImage(activeImg, -118, -118, 236, 236);
                      // 若未设置独立张嘴贴图，使用默认大肥鱼时绘制动态口型
                      if (!hasCustomIdle && state.mouth > 0.08) {
                        ctx.fillStyle = 'rgba(244, 63, 94, 0.85)';
                        ctx.beginPath();
                        ctx.ellipse(0, 22, 8, 3 + state.mouth * 9, 0, 0, Math.PI * 2);
                        ctx.fill();
                      }
                    } else {
                      ctx.fillStyle = '#3b82f6';
                      ctx.beginPath(); ctx.ellipse(0, 0, 96, 82, 0, 0, Math.PI * 2); ctx.fill();
                      ctx.fillStyle = '#f8fafc';
                      ctx.beginPath(); ctx.ellipse(-4, 22, 78, 52, 0, 0, Math.PI); ctx.fill();
                    }
                    ctx.restore();

                    if (state.mood === 'thinking') {
                      ctx.font = '34px sans-serif'; ctx.fillText('💭', 180, 50 + Math.sin(state.tick * 4) * 5);
                    } else if (state.mood === 'dancing') {
                      ctx.font = '34px sans-serif'; ctx.fillText('🎵', 180, 50 + Math.cos(state.tick * 4) * 5);
                    }

                    state.bounce *= 0.82;
                    state.mouth *= 0.84;
                    requestAnimationFrame(draw);
                  }

                  reloadSpriteConfig(true);
                  requestAnimationFrame(draw);
                </script>
              </body>
              </html>
              """).lstrip())

